# Run in gs_tools's own environment: pytest tests/research/gs_tools
# This file pins pytest's rootdir here, so Open4D's root pyproject.toml
# (its addopts and strict markers) does not apply, and puts the research
# source on the import path.
[pytest]
pythonpath = ../../../open4d/reconstruction/gs_tools ../../.. ../../../open4d/streamer
markers =
    cpu: needs no GPU

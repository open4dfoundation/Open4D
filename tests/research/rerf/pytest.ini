# Run in rerf's own environment: pytest tests/research/rerf
# This file pins pytest's rootdir here, so Open4D's root pyproject.toml
# (its addopts and strict markers) does not apply, and puts the research
# source on the import path. Open4D itself is not importable there: ReRF's entropy coder needs Python 3.8.
[pytest]
pythonpath = ../../../open4d/codecs/rerf/source

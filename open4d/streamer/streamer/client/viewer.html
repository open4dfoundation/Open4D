 * no geometry to aim one at, so a captured method genuinely cannot appear
 * there -- but *hiding* it means someone who opens `basketball` looking for
 * the photograph finds it simply absent, with nothing saying it exists or how
 * to reach it. That is a worse failure than a greyed-out row, and it was
 * reported as the option missing.
 */
function methodsFor(scene, mode) {
  const seen = new Map();
  const shell = shellOf(app.scenes[scene]);
  for (const clip of app.index.clips) {
    if (clip.scene !== scene) continue;
    // Pixels are usable in Explore when the scene's rig is a ring: the drag
    // then picks the nearest rendered view instead of being refused. Without a
    // ring there is nothing to snap onto and they stay compare-only.
    const usable = mode !== "explore" || hasGeometry(clip)
      || (isPixels(clip) && !!shell && clip.camera !== null
          && clip.camera !== undefined);
    // A method with several clips is usable if any one of them is: Vega has
    // Gaussians, so it survives Explore even where its image clips do not.
    if (!seen.has(clip.method) || usable) seen.set(clip.method, usable
      || (seen.get(clip.method) || false));
  }
  // Sorted, because the order this arrives in is manifest order, which is the
  // order clips happened to be imported in. basketball had its Vega clip added
  // before its ReRF ones and every later subject the other way round, so the
  // two panes came up swapped depending on the subject -- and `selectScene`
  // takes the first two, so with more than two methods the *choice* would
  // depend on import history too.
  return [...seen]
    .map(([method, usable]) => ({ method, usable }))
    .sort((a, b) => a.method.localeCompare(b.method));
}

function rig() { return app.scenes[app.scene] || null; }

/* ------------------------------------------------ a free camera for pixels ---
 * A pre-rendered method is not stuck at one viewpoint, and saying so was an
 * error on my part: ReRF renders free viewpoint -- `rerf_render.py
 * --render_360` walks a ring around the subject, and that is the code path that
 * produced the orbit clips in this bundle. What it needs is a CUDA GPU, so the
 * rendering happens here, offline, rather than in a browser.
 *
 * Which leaves a real difference in *where* pixels are made, and no reason for
 * it to be a difference in what the camera does. Vega ships geometry, so a drag
 * rasterises a new view. ReRF ships a ring of rendered views, so a drag picks
 * the nearest one. Same gesture, and the honest caveats are that the azimuth is
 * quantised to the ring's spacing and the elevation is whatever it was rendered
 * at -- both of which the pane label states rather than hides.
 */

//: Tolerance for calling a rig a shell, as a fraction of its radius. Poses are
//: written from a float32 render pipeline, so exact equality is not available;
//: 2% is far tighter than the arc between neighbouring stations.
const SHELL_TOLERANCE = 0.02;

//: Elevations within this many degrees of each other are one ring. The rings
//: this recovers are 25 degrees apart, so the margin is wide.
const RING_MERGE_DEG = 1.0;

/* Where a rig's cameras are all looking.
 *
 * Solved from the poses rather than taken as the centroid of their positions.
 * A single ring's centroid *is* its centre, which is why the centroid was good
 * enough while there was one ring -- but stack two rings at different heights
 * and the centroid sits between them, off the axis, and every radius measured
 * from it comes out different. The cameras themselves know better: each one
 * points at the target, so the target is the point closest to all of their view
 * rays. Least squares over `sum |(I - ff')(x - p)|^2`, which is a 3x3 solve.
 */
function lookAtCentre(poses) {
  const a = [0, 0, 0, 0, 0, 0, 0, 0, 0];
  const b = [0, 0, 0];
  for (const pose of poses) {
    const f = normalize(pose.forward);
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const m = (r === c ? 1 : 0) - f[r] * f[c];
        a[r * 3 + c] += m;
        b[r] += m * pose.position[c];
      }
    }
  }
  const det = a[0] * (a[4] * a[8] - a[5] * a[7])
            - a[1] * (a[3] * a[8] - a[5] * a[6])
            + a[2] * (a[3] * a[7] - a[4] * a[6]);
  // Degenerate when every camera looks the same way -- a rig with no
  // convergence has no centre to find, and inverting anyway would produce a
  // wild point and a shell that happened to fit it.
  if (!isFinite(det) || Math.abs(det) < 1e-9) return null;
  const solve = (column) => {
    const m = a.slice();
    for (let r = 0; r < 3; r++) m[r * 3 + column] = b[r];
    return (m[0] * (m[4] * m[8] - m[5] * m[7])
          - m[1] * (m[3] * m[8] - m[5] * m[6])
          + m[2] * (m[3] * m[7] - m[4] * m[6])) / det;
  };
  return [solve(0), solve(1), solve(2)];
}

/* The shell of viewpoints a rig describes, or null if it does not describe one.
 *
 * Checked rather than assumed: a rig read from a capture corpus is wherever the
 * cameras physically were, and snapping a free camera onto an arbitrary cloud
 * of viewpoints would move it somewhere the user did not ask for. Only a rig
 * whose stations sit at one radius about a common look-at point gets to stand
 * in for an orbit.
 *
 * One radius and *not* one height, which is the generalisation from a single
 * ring: `--elevations 0,25,-25` renders three of them, and the export puts the
 * cameras at a constant distance precisely so that this holds and the subject
 * does not change size between them.
 */
function shellOf(scene) {
  if (!scene || !scene.poses || scene.poses.length < 4) return null;
  if (scene._shell !== undefined) return scene._shell;
  scene._shell = null;
  const poses = scene.poses;
  if (!poses.every((pose) => pose.position && pose.forward)) return null;
  const centre = lookAtCentre(poses);
  if (!centre) return null;

  const offsets = poses.map((pose) => [0, 1, 2].map((i) => pose.position[i] - centre[i]));
  const radii = offsets.map((o) => Math.hypot(o[0], o[1], o[2]));
  const radius = radii.reduce((a, b) => a + b, 0) / radii.length;
  if (!(radius > 0)) return null;
  if (!radii.every((r) => Math.abs(r - radius) <= SHELL_TOLERANCE * radius)) return null;

  // Unit direction from the subject out to each station. This is what a snap
  // compares against, and it carries azimuth and elevation together -- so the
  // seam at +/-180 degrees needs no special case and neither does the vertical.
  const dirs = offsets.map((o, i) => [o[0] / radii[i], o[1] / radii[i], o[2] / radii[i]]);
  const up = WORLD_UP;
  const elevations = dirs.map((d) =>
    Math.asin(Math.max(-1, Math.min(1, d[0] * up[0] + d[1] * up[1] + d[2] * up[2])))
    * 180 / Math.PI);

  // Recover the rings, so the label can quote an azimuth step and an elevation
  // count instead of one number that means neither.
  const rings = [];
  for (const elevation of [...elevations].sort((x, y) => x - y)) {
    const last = rings[rings.length - 1];
    if (last && Math.abs(elevation - last.elevation) <= RING_MERGE_DEG) {
      last.count += 1;
    } else {
      rings.push({ elevation, count: 1 });
    }
  }
  scene._shell = {
    centre, radius, dirs, rings,
    //: Azimuth step of the most populated ring, in degrees. Every ring the
    //: export writes holds the same number of views, so this is the step of
    //: all of them.
    azimuthStep: 360 / Math.max(...rings.map((ring) => ring.count)),
  };
  return scene._shell;
}

/* The station pointing most nearly the same way as `direction`.
 *
 * Compared as directions from the subject, not as yaw and pitch separately: a
 * dot product is monotone in the angle between them, so the largest one is the
 * nearest station with no wrap-around to handle and no need to weigh a degree
 * of azimuth against a degree of elevation.
 */
function nearestStation(shell, direction) {
  const d = normalize(direction);
  let best = 0, closest = -Infinity;
  for (let index = 0; index < shell.dirs.length; index++) {
    const s = shell.dirs[index];
    const dot = s[0] * d[0] + s[1] * d[1] + s[2] * d[2];
    if (dot > closest) { closest = dot; best = index; }
  }
  return best;
}

//: What each representation is called in a pane label, in the plural a count
//: reads naturally with.
const REPRESENTATION_NOUNS = {
  gaussians: "gaussians", points: "points", mesh: "triangles", pixels: "pixels",
};

/* What a pane is actually showing, for its label.
 *
 * A method can reach a viewer as more than one thing -- ReRF ships both a
 * ray-marched image per station and a point cloud read out of its density
 * field -- and which one a pane holds changes what the picture means. Naming
 * only the method left a pane labelled "rerf" showing a pre-rendered view with
 * nothing saying so, and a pane labelled "rerf" showing a live-rasterised
 * point cloud looking identical. So the label says which.
 *
 * Reported as it is, not as it is meant to be: a pixel pane in Explore says it
 * is the nearest of the rendered views, because a viewer comparing it against
 * a rasterised pane beside it would otherwise read the offset as a
 * reconstruction error.
 */
function describeSource(clip) {
  if (isLive(clip)) return streamLabel(clip);
  const noun = REPRESENTATION_NOUNS[clip.representation] || clip.representation;
  const count = (clip.counts || [])[0];
  const sized = count ? `${count.toLocaleString()} ${noun}` : noun;
  if (hasGeometry(clip)) {
    // Rasterised here, from geometry, at whatever camera is asked for. In
    // Explore that camera is free, which is the whole difference from a
    // pre-rendered pane; in Compare it is the rig pose, and saying "free"
    // there would describe a camera the mode does not give.
    return app.mode === "explore" ? `${sized}, free camera`
                                  : `${sized}, rasterised at cam ${app.station}`;
  }
  if (clip.camera === null || clip.camera === undefined) return noun;
  const shell = app.mode === "explore" ? shellOf(rig()) : null;
  if (shell) return `nearest of ${shell.dirs.length} rendered views`;
  // "ray-marched", not "rendered": at a rig station this pane is the method's
  // own renderer output, where the geometry pane beside it is this browser
  // re-rasterising a reduction of the same reconstruction. That is the
  // comparison the mode exists for, so the labels have to distinguish it.
  return `ray-marched at cam ${clip.camera}`;
}

/* The station a pixel pane should show in Explore mode: the one nearest where
 * the free camera is pointing. Null when the scene's rig is not a ring, in
 * which case pixels stay out of Explore as they were. */
function exploreStation() {
  const shell = shellOf(rig());
  if (!shell) return null;
  // The camera's own direction from what it is looking at, in the same terms
  // the shell holds its stations in.
  const pitch = app.camera.pitch, yaw = app.camera.yaw;
  return nearestStation(shell, [
    Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch),
  ]);
}

/* How the shell is sampled, for the pane label: the azimuth step and the
 * elevations. Quoted as two numbers rather than one, because that is how it is
 * experienced -- dragging sideways steps finely and dragging up jumps between
 * rings -- and a single worst-case figure would be the ring gap and would
 * describe the sideways drag wrongly. */
function shellSampling(shell) {
  const elevations = shell.rings.map((ring) => {
    // Rounded away from negative zero. The flat ring's elevation comes out of
    // an asin as a whisker below zero, and `(-0).toFixed(0)` is the string
    // "-0", so a level rig read "-0°".
    const degrees = Math.round(ring.elevation);
    return `${degrees === 0 ? 0 : degrees}°`;
  });
  return `±${(shell.azimuthStep / 2).toFixed(1)}° azimuth, `
    + (shell.rings.length === 1 ? `elevation fixed at ${elevations[0]}`
        : `${shell.rings.length} elevations (${elevations.join(", ")})`);
}

function clipFor(method) {
  const all = app.index.clips.filter((c) => c.scene === app.scene && c.method === method);
  if (app.mode === "explore") {
    // Geometry first: it can be rasterised at the exact camera, where a ring
    // station is only the nearest one rendered.
    const station = exploreStation();
    return all.find(hasGeometry)
        || (station === null ? null
            : all.find((c) => isPixels(c) && c.camera === station))
        || null;
  }
  // Compare: an image only exists at the station it was made at; Gaussians can
  // be rendered at any of them, so they are the fallback rather than the first
  // choice -- a real render beats a re-render of the same thing.
  // A live clip is resolved whatever the station: it renders its own camera, and
  // lives in its own scene precisely so that this cannot put it beside a rig
  // pose and imply they match.
  return all.find((c) => isPixels(c) && c.camera === app.station)
      || all.find(isLive)
      || all.find(hasGeometry)
      || null;
}

function frameCount() {
  // A live pane has no length and must not shorten the clip beside it; if every
  // pane is live there is nothing to scrub and the transport bar says so.
  const lengths = app.panes
    .filter((pane) => !isLive(pane.clip))
    .map((pane) => pane.length || 1);
  return lengths.length ? Math.max(1, ...lengths) : 1;
}

function allPanesLive() {
  return app.panes.length > 0 && app.panes.every((pane) => isLive(pane.clip));
}

/* A live scene has no timeline. Disabling the controls rather than leaving them
 * inert is the difference between "there is nothing to scrub here" and "the
 * scrubber is broken". */
function updateTransport() {
  const live = allPanesLive();
  scrubFrame.disabled = live;
  playPause.disabled = live;
  if (live) {
    app.playing = false;
    playPause.textContent = "▶";
    // Names what the panes actually are. All-replay reads "replay"; a mix says
    // so rather than picking the flattering one.
    const kinds = [...new Set(app.panes.map((pane) => streamLabel(pane.clip)))];
    frameLabel.textContent = kinds.join(" + ");
  }
}

/* Re-point every pane at the clip it should now be showing, without touching
 * the panes themselves. This is what a camera step does: same methods, same
 * renderers, different source -- so stepping through the rig costs a clip
 * lookup rather than a WebGL context per station. */
function updateClips() {
  for (const pane of app.panes) {
    try {
      pane.setClip(clipFor(pane.method));
    } catch (error) {
      return fail(`Could not start a renderer for ${pane.method}: ${error.message || error}`);
    }
  }
  scrubFrame.max = String(frameCount() - 1);
  app.frame = Math.min(app.frame, frameCount() - 1);
  updateTransport();
  refreshPanel();
  writeHash();
  showFrame(app.frame);
  // Take a copy of whatever is now selected. Both places the pane set can
  // change end here, and both need it. Deliberately not awaited: the page stays
  // interactive while it arrives, and each frame becomes playable as it lands
  // rather than after all of them.
  downloadSelection();
}

/* Move the pixel panes onto the ring station the camera now points at.
 *
 * Deliberately *not* per pointermove. Crossing a station changes which clip a
 * pixel pane plays, so re-resolving mid-drag would start a download per station
 * -- one spin across 36 of them is 50 MB of requests for pictures nobody
 * stopped to look at. The geometry panes redraw every frame regardless, because
 * for them the camera is the only input; the rendered panes catch up when the
 * hand stops, which is when their picture is being read.
 */
//: How long the camera has to hold still before a pixel pane follows it, in
//: milliseconds. Short enough not to feel like lag, long enough that a spin
//: costs one fetch rather than one per station crossed.
const FOLLOW_SETTLE_MS = 140;
let followTimer = null;

function followCamera() {
  if (app.mode !== "explore" || exploreStation() === null) return;
  if (followTimer) clearTimeout(followTimer);
  followTimer = setTimeout(() => {
    followTimer = null;
    if (app.mode !== "explore") return;
    let moved = false;
    for (const pane of app.panes) {
      const wanted = clipFor(pane.method);
      if (wanted === pane.clip) continue;
      try {
        pane.setClip(wanted);
      } catch (error) {
        return fail(`Could not start a renderer for ${pane.method}:`
          + ` ${error.message || error}`);
      }
      moved = true;
    }
    if (!moved) return;
    refreshPanel();
    showFrame(app.frame);
    // Panes already resident return from this immediately, so following the
    // camera costs the one station that changed.
    downloadSelection();
  }, FOLLOW_SETTLE_MS);
}

function rebuildPanes() {
  const existing = new Map(app.panes.map((pane) => [pane.method, pane]));
  app.panes = [];
  for (const method of app.methods) {
    const pane = existing.get(method) || new Pane(method);
    existing.delete(method);
    try {
      pane.setClip(clipFor(method));
    } catch (error) {
      return fail(`Could not start a renderer for ${method}: ${error.message || error}`);
    }
    app.panes.push(pane);
  }
  for (const pane of existing.values()) pane.dispose();
  // Reappend in order; moving an existing node does not recreate its context.
  for (const pane of app.panes) panesEl.appendChild(pane.host);
  const handle = document.getElementById("wipeHandle");
  if (handle) handle.remove();
  const wipeable = app.wipe && app.panes.length === 2;
  panesEl.classList.toggle("wipe", wipeable);
  panesEl.style.gridTemplateColumns = wipeable ? "" : `repeat(${Math.max(app.panes.length, 1)}, 1fr)`;
  if (wipeable) {
    const handle = document.createElement("div");
    handle.id = "wipeHandle";
    panesEl.appendChild(handle);
    bindWipe(handle);
  }
  scrubFrame.max = String(frameCount() - 1);
  app.frame = Math.min(app.frame, frameCount() - 1);
  updateTransport();
  refreshPanel();
  writeHash();
  showFrame(app.frame);
  // Take a copy of whatever is now selected. Both places the pane set can
  // change end here, and both need it. Deliberately not awaited: the page stays
  // interactive while it arrives, and each frame becomes playable as it lands
  // rather than after all of them.
  downloadSelection();
}

/* ------------------------------------------------------------ the readouts ---
 * A research panel, so: numbers in aligned columns, units in the header, one
 * row per pane. Not prose.
 *
 * The earlier version summed across panes and wrote sentences -- "8 panes
 * holding their last frame so the rest keep playing". That reads once and is
 * useless afterwards: the question while watching is always *which* pane, and
 * a total cannot answer it. Every figure here is per pane, and the aggregate
 * sits in one footer row where it belongs.
 *
 * Every column is something a reader would act on:
 *   rung/res   what is being sent, and how big it is
 *   kB/f, Mb/s what it costs -- measured from the manifest, not estimated
 *   PSNR/SSIM  what it is worth, against the captured reference
 *   buf        seconds of decoded playback ahead: the margin before it slows
 *   net/dec    where the time goes, and they are separate because the fixes are
 */

function fmt(value, digits = 1) {
  return value === null || value === undefined || !isFinite(value)
    ? "" : value.toFixed(digits);
}

function paneRow(pane) {
  const rungs = rungsOf(pane.clip, app.fps);
  const snap = pane.source && pane.source.snapshot ? pane.source.snapshot() : null;
  const name = snap ? snap.rung : null;
  const rung = rungs.find((r) => r.name === (name || "default")) || rungs[0] || null;
  const stats = pane.source ? pane.source.stats : null;
  const detail = rung && rung.name === "default"
    ? (pane.clip.detail || {})
    : ((pane.clip.variants || []).find((v) => v.name === (rung && rung.name)) || {}).detail
      || {};
  return {
    pane,
    method: pane.method,
    live: isLive(pane.clip),
    frozen: !!(pane.source && pane.source.frozen),
    rung: rungs.length > 1 ? (name || "default") : "\u2014",
    resolution: detail.resolution || null,
    kbPerFrame: rung ? rung.bitsPerSecond / (8 * app.fps) / 1000 : null,
    mbits: rung ? rung.bitsPerSecond / 1e6 : null,
    psnr: rung && rung.quality ? rung.quality.psnr : null,
    ssim: rung && rung.quality ? rung.quality.ssim : null,
    buffered: pane.source ? bufferedSeconds(pane, app.frame, app.fps) : null,
    fetchMs: stats ? stats.fetchMs : null,
    decodeMs: stats ? stats.decodeMs : null,
    bytes: stats ? stats.bytes : 0,
    switches: stats ? (stats.switches || 0) : 0,
  };
}

function renderPaneTable() {
  const table = document.getElementById("paneTable");
  table.innerHTML = "";
  const rows = app.panes.filter((pane) => pane.clip).map(paneRow);
  if (!rows.length) return;

  const anyLadder = rows.some((row) => row.rung !== "\u2014");
  const anyQuality = rows.some((row) => row.psnr !== null && row.psnr !== undefined);
  const columns = [
    ["method", (r) => r.method, "name"],
    ...(anyLadder ? [["rung", (r) => (r.frozen ? "frozen" : r.rung), "n"]] : []),
    ["res", (r) => r.resolution, ""],
    ["kB/f", (r) => fmt(r.kbPerFrame), "n"],
    ["Mb/s", (r) => fmt(r.mbits, 2), "n"],
    ...(anyQuality ? [
      ["PSNR", (r) => fmt(r.psnr, 2), "n"],
      ["SSIM", (r) => fmt(r.ssim, 4), "n"],
    ] : []),
    ["buf s", (r) => fmt(r.buffered, 2), "n"],
    ["net ms", (r) => fmt(r.fetchMs, 0), ""],
    ["dec ms", (r) => fmt(r.decodeMs, 0), ""],
  ];

  const head = document.createElement("thead");
  const headRow = document.createElement("tr");
  for (const [label] of columns) {
    const th = document.createElement("th");
    th.textContent = label;
    headRow.appendChild(th);
  }
  head.appendChild(headRow);
  table.appendChild(head);

  const body = document.createElement("tbody");
  for (const row of rows) {
    const tr = document.createElement("tr");
    if (row.frozen) tr.className = "frozen";
    for (const [, read, kind] of columns) {
      const td = document.createElement("td");
      const value = row.live ? (read === columns[0][1] ? row.method : "live") : read(row);
      td.textContent = (value === null || value === undefined || value === "")
        ? "\u2013" : value;
      td.className = (value === null || value === undefined || value === "")
        ? "void" : kind;
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  table.appendChild(body);

  const totalBytes = rows.reduce((sum, row) => sum + row.bytes, 0);
  const totalMbits = rows.reduce((sum, row) => sum + (row.mbits || 0), 0);
  const foot = document.createElement("tfoot");
  const footRow = document.createElement("tr");
  const cells = [`${rows.length} panes`];
  if (anyLadder) cells.push("");
  cells.push("", "", fmt(totalMbits, 2));
  if (anyQuality) cells.push("", "");
  cells.push("", "", `${(totalBytes / 1e6).toFixed(1)} MB`);
  for (const text of cells) {
    const td = document.createElement("td");
    td.textContent = text;
    footRow.appendChild(td);
  }
  foot.appendChild(footRow);
  table.appendChild(foot);
}

function renderSessionTable() {
  const table = document.getElementById("sessionTable");
  table.innerHTML = "";
  const shown = app.shownAt || [];
  const achieved = shown.length > 1
    ? (shown.length - 1) / ((shown[shown.length - 1] - shown[0]) / 1000) : null;

  const rows = [
    ["mode", app.mode],
    ["frame", `${app.frame + 1} / ${frameCount()}`],
    ["fps", achieved === null ? "\u2013"
      : `${fmt(achieved)} / ${app.fps} target`],
  ];
  if (app.late) rows.push(["late advances", String(app.late)]);
  if (app.download) {
    const got = app.download;
    rows.push(["downloaded", got.complete
      ? `${got.done} / ${got.frames} frames`
      : `${got.done} / ${got.frames} (pane ${got.pane} of ${got.panes})`]);
    rows.push(["held", `${(paneBytes() / 1e6).toFixed(0)} MB`]);
    rows.push(["playing", got.complete
      ? (got.resident ? "from memory" : "streamed, too big to hold")
      : "downloading"]);
  }

  const laddered = app.panes.filter(
    (pane) => pane.source && rungsOf(pane.clip, app.fps).length > 1);
  if (laddered.length) {
    document.getElementById("adaptRow").hidden = false;
    rows.push(["link", meter.samples
      ? `${fmt(meter.bitsPerSecond / 1e6, 2)} Mbit/s`
      : "unmeasured"]);
    if (app.adapt && app.decision) {
      rows.push(["share/pane", `${fmt(app.decision.share / 1e6, 2)} Mbit/s`]);
      if (app.decision.frozen) {
        rows.push(["frozen", `${app.decision.frozen} / ${app.decision.ladders}`]);
      }
    } else if (!app.adapt) {
      rows.push(["adaptation", "pinned to default"]);
    }
    const switches = laddered.reduce(
      (sum, pane) => sum + (pane.source.stats.switches || 0), 0);
    rows.push(["rung switches", String(switches)]);
  }

  const active = app.panes.filter((pane) => pane.source && pane.source.snapshot);
  if (active.length) {
    const snaps = active.map((pane) => pane.source.snapshot());
    const pending = snaps.reduce((sum, snap) => sum + snap.pending, 0);
    rows.push(["in flight", String(pending)]);
    const modes = new Set(snaps.map((snap) => snap.mode));
    if (!(modes.size === 1 && modes.has("independent"))) {
      rows.push(["decode order", [...modes].join(",")]);
      rows.push(["replays", String(
        active.reduce((sum, pane) => sum + pane.source.stats.replays, 0))]);
    }
  }

  const body = document.createElement("tbody");
  for (const [key, value] of rows) {
    const tr = document.createElement("tr");
    const label = document.createElement("td");
    label.textContent = key;
    label.className = "name";
    const cell = document.createElement("td");
    cell.textContent = value;
    cell.className = "n";
    tr.append(label, cell);
    body.appendChild(tr);
  }
  table.appendChild(body);
}

/* Caveats as tags. A reader looking at a render needs the ones that change how
 * to read it -- that a camera was in the training set, that colour is baked at
 * one direction -- and needs them at a glance. The full sentences are still
 * available under `caveats`, because some of them genuinely need a sentence. */
const TAG_RULES = [
  [/training view/i, "training view", true],
  [/sh_degree 0|no view-dependent/i, "SH deg 0", true],
  [/colour baked|color baked/i, "baked colour", true],
  [/relative depth|ray-march steps/i, "depth (relative)", false],
  [/replay|rendered earlier/i, "replay", true],
  [/rendered on demand|decoded and drawn per frame/i, "live render", false],
  [/quantised|quantized/i, "quantised", true],
  [/sequential|residual over its predecessor/i, "sequential decode", false],
  [/no free camera|fixed viewpoint|cannot be steered/i, "fixed camera", false],
  [/reference, not a reconstruction/i, "reference", false],
];

function renderTags() {
  const host = document.getElementById("tags");
  host.innerHTML = "";
  const seen = new Map();
  for (const pane of app.panes) {
    for (const note of (pane.clip && pane.clip.notes) || []) {
      for (const [pattern, label, warn] of TAG_RULES) {
        if (pattern.test(note) && !seen.has(label)) seen.set(label, warn);
      }
    }
  }
  if (app.mode === "compare" && !rig()) seen.set("no rig for this subject", true);
  for (const [label, warn] of seen) {
    const tag = document.createElement("span");
    tag.className = warn ? "tag warn" : "tag";
    tag.textContent = label;
    host.appendChild(tag);
  }
}

function renderNotes() {
  const notes = document.getElementById("notes");
  notes.innerHTML = "";
  const lines = [];
  if (app.mode === "explore") {
    lines.push("free camera shared across every pane: differences are the reconstructions, not the viewpoint");
    const snapped = app.panes.filter((pane) => pane.clip && isPixels(pane.clip));
    const shell = shellOf(rig());
    if (snapped.length && shell) {
      lines.push(`${snapped.map((pane) => pane.method).join(", ")}: free`
        + ` viewpoint, but ray-marched on a GPU rather than in the browser, so`
        + ` the views were rendered in advance and the drag picks the nearest of`
        + ` ${shell.dirs.length} — ${shellSampling(shell)}`);
    }
  } else if (rig()) {
    const pose = rig().poses[app.station];
    lines.push(`rig camera ${app.station}${pose && pose.view_id !== null && pose.view_id !== undefined ? ` (captured view ${pose.view_id})` : " (interpolated)"}: every pane at this pose`);
  } else {
    lines.push("no capture rig in the bundle for this subject, so there is no shared camera to compare at");
  }
  for (const pane of app.panes) {
    for (const note of (pane.clip && pane.clip.notes) || []) {
      lines.push(`${pane.method}: ${note}`);
    }
  }
  document.getElementById("notesBlock").hidden = lines.length === 0;
  for (const line of lines) {
    const li = document.createElement("li");
    li.textContent = line;
    notes.appendChild(li);
  }
}

function refreshPanel() {
  renderPaneTable();
  renderSessionTable();
  renderTags();
  renderNotes();

  const help = document.getElementById("controlHelp");
  help.innerHTML = "";
  const items = app.mode === "explore"
    ? ["<kbd>drag</kbd> orbit \u00b7 <kbd>shift</kbd>+drag or right-drag pan",
       "<kbd>wheel</kbd> zoom \u00b7 <kbd>r</kbd> reset camera",
       "<kbd>space</kbd> play/pause \u00b7 <kbd>\u2190</kbd> <kbd>\u2192</kbd> step one frame"]
    : ["<kbd>,</kbd> <kbd>.</kbd> step the rig camera",
       "<kbd>space</kbd> play/pause \u00b7 <kbd>\u2190</kbd> <kbd>\u2192</kbd> step one frame",
       "<kbd>A|B</kbd> wipes between two panes; drag the handle"];
  for (const item of items) {
    const li = document.createElement("li");
    li.innerHTML = item;
    help.appendChild(li);
  }
}

function renderMethodList() {
  methodList.innerHTML = "";
  const entries = methodsFor(app.scene, app.mode);
  const usable = entries.filter((entry) => entry.usable).map((e) => e.method);
  if (!entries.length) {
    const note = document.createElement("p");
    note.className = "sub";
    note.textContent = "No clips for this scene.";
    methodList.appendChild(note);
    return;
  }
  for (const { method, usable: playable } of entries) {
    const row = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = playable && app.methods.includes(method);
    box.disabled = !playable;
    box.addEventListener("change", () => {
      app.methods = usable.filter(
        (candidate) => candidate === method ? box.checked : app.methods.includes(candidate));
      rebuildPanes();
      renderMethodList();
    });
    const text = document.createElement("span");
    text.textContent = method;
    if (!playable) text.style.color = "var(--dim)";
    row.append(box, text);

    const why = document.createElement("span");
    why.className = "why";
    if (!playable) {
      // The one case: a pixel method under a free camera. Say where it lives
      // rather than only that it does not live here.
      why.textContent = "compare only";
      why.title = "A photograph or a pre-rendered image exists only at the "
        + "camera it was made at, so a free camera has nothing to aim at it. "
        + "Switch to Compare.";
      why.style.color = "#d8a657";
    } else if (app.mode === "compare") {
      const here = app.index.clips.find(
        (c) => c.scene === app.scene && c.method === method
               && isPixels(c) && c.camera === app.station);
      const geometry = app.index.clips.find(
        (c) => c.scene === app.scene && c.method === method && hasGeometry(c));
      why.textContent = here ? "rendered here"
        : geometry ? "renders here" : "not at this camera";
    }
    if (why.textContent) row.appendChild(why);
    methodList.appendChild(row);
  }
}

function selectScene(scene) {
  app.scene = scene;
  // A scene whose every clip is live has nothing a free camera could show, so
  // landing on it in Explore would present an empty pane and a message about
  // Gaussians. Switching is more useful than explaining.
  const anyGeometry = app.index.clips.some(
    (clip) => clip.scene === scene && hasGeometry(clip));
  if (app.mode === "explore" && !anyGeometry) {
    setMode("compare");
    return;
  }
  // Only the usable ones, and only two: opening a subject should show
  // something immediately rather than downloading every method at once.
  const available = methodsFor(scene, app.mode)
    .filter((entry) => entry.usable).map((entry) => entry.method);
  app.methods = available.slice(0, 2);
  app.station = 0;
  const poses = rig() ? rig().poses.length : 0;
  scrubCamera.max = String(Math.max(poses - 1, 0));
  scrubCamera.value = "0";
  cameraRow.hidden = app.mode !== "compare";
  scrubCamera.disabled = poses === 0;
  cameraLabel.textContent = poses ? `1 / ${poses}` : "none";
  if (app.mode === "explore") {
    const clip = app.index.clips.find((c) => c.scene === scene && hasGeometry(c));
    const lower = (clip && clip.bounds_min) || [-1, -1, -1];
    const upper = (clip && clip.bounds_max) || [1, 1, 1];
    const centre = [0, 1, 2].map((i) => (lower[i] + upper[i]) / 2);
    const diagonal = Math.hypot(upper[0] - lower[0], upper[1] - lower[1], upper[2] - lower[2]) || 2;
    app.camera.reset(centre, app.camera.fitDistance(diagonal / 2, [panesEl.clientWidth || 960,
                                                                  panesEl.clientHeight || 700]));
  }
  renderMethodList();
  rebuildPanes();
}

function setMode(mode) {
  app.mode = mode;
  document.getElementById("modeExplore").setAttribute("aria-pressed", String(mode === "explore"));
  document.getElementById("modeCompare").setAttribute("aria-pressed", String(mode === "compare"));
  cameraRow.hidden = mode !== "compare";
  selectScene(app.scene);
}

async function showFrame(index) {
  const total = frameCount();
  app.frame = ((index % total) + total) % total;
  scrubFrame.value = String(app.frame);
  writeHash();
  if (allPanesLive()) {
    updateTransport();
  } else {
    frameLabel.textContent = `${app.frame + 1} / ${total}`;
  }
  try {
    // A frozen pane is skipped, not shown: it keeps whatever is on its canvas
    // while the others advance. That is the whole difference between a freeze
    // and a stall -- the rest of the view stays in motion.
    await Promise.all(app.panes
      .filter((pane) => !(pane.source && pane.source.frozen))
      .map((pane) => pane.show(app.frame)));
    /* Achieved frame rate, and how often an advance arrived late.
     *
     * The honest stall measure for this client: playback advances only once the
     * previous frame has actually been shown, so it never freezes mid-frame --
     * it runs slow instead. "Did it stall" is really "how far below the target
     * rate did it run", and a late count says whether that was steady or
     * bursty. */
    const now = performance.now();
    const shown = (app.shownAt = app.shownAt || []);
    if (shown.length && now - shown[shown.length - 1] > 1.5 * (1000 / app.fps)) {
      app.late = (app.late || 0) + 1;
    }
    shown.push(now);
    if (shown.length > 30) shown.shift();
    statusEl.hidden = true;
  } catch (error) {
    setStatus(String(error.message || error));
  }
}

/* The camera every splat pane is drawn from. In compare mode it is the rig
 * pose, with the rig's own vertical field of view, so a rendered pane and a
 * captured pane are the same photograph of different content. */
function basisFactory() {
  if (app.mode === "compare" && rig()) {
    const pose = rig().poses[app.station];
    const fovY = rig().fov_y;
    return (size) => ({
      eye: pose.position,
      right: pose.right,
      down: pose.down,
      forward: pose.forward,
      focal: [0.5 * size[1] / Math.tan(fovY / 2), 0.5 * size[1] / Math.tan(fovY / 2)],
    });
  }
  return (size) => app.camera.frame(size);
}

function tick(now) {
  requestAnimationFrame(tick);
  if (!app.panes.length) return;
  /* Advance on the buffer, not on a wall clock.
   *
   * This used to fire `showFrame` whenever 1/fps had elapsed and not wait for
   * it. `showFrame` is async -- a fetch and a parse, tens of milliseconds at
   * best and far more over a link -- so calls overlapped, each one moving
   * `app.frame`, and they resolved in whatever order they finished. The counter
   * raced ahead of the pictures and the panes showed whichever decode landed
   * last, which is not slow playback but wrong playback.
   *
   * So: at most one advance in flight, and the next interval is timed from when
   * the last frame was actually shown. A clip the machine can keep up with
   * plays at `fps`; one it cannot plays as fast as it can decode, in order,
   * which is the honest failure mode. `--fps` becomes a ceiling rather than a
   * promise. */
  if (app.playing && !app.advancing && now - app.lastAdvance >= 1000 / app.fps) {
    app.advancing = true;
    // Before the fetch, so a decision applies to the frame about to be asked
    // for rather than the one after it.
    chooseRungs();
    showFrame(app.frame + 1).finally(() => {
      app.advancing = false;
      app.lastAdvance = performance.now();
    });
  }
  const aspect = app.mode === "compare" && rig() ? rig().width / rig().height : 0;
  const basis = basisFactory();
  for (const pane of app.panes) pane.draw(basis, aspect);
}

/* Decide a rung for every pane, from what the link is delivering.
 *
 * Called from the playback loop rather than on a timer, so decisions happen at
 * a rate tied to what is being watched -- and stop when playback stops, which
 * a timer would not.
 *
 * `app.adapt` off pins every pane to the default rendition. That is not a
 * debug switch: comparing two methods usually means wanting both at their best
 * regardless of what the link can sustain, and letting the link decide would
 * silently make the comparison about bandwidth instead.
 */
/* Download every selected clip, then start playing.
 *
 * On demand rather than live: the server holds prepared content and the client
 * takes a copy. Until it is here, say so with a number -- a page that sits
 * blank while 63 MB arrives is indistinguishable from a page that is broken,
 * and that was the single most confusing thing about this viewer.
 *
 * Panes are downloaded in order rather than in parallel. One connection
 * saturates the link either way, and doing them in turn means the first pane
 * is playable while the rest arrive, instead of four half-finished ones.
 */
async function downloadSelection() {
  const panes = app.panes.filter((pane) => pane.source && !isLive(pane.clip));
  if (!panes.length) { app.download = null; return; }

  const token = ++app.downloadToken;
  const totals = panes.map((pane) => pane.source.length);
  const frames = totals.reduce((a, b) => a + b, 0);
  app.download = { done: 0, frames, bytes: 0, pane: 0, panes: panes.length,
                   complete: false, resident: true };
  let done = 0;

  for (let index = 0; index < panes.length; index++) {
    const pane = panes[index];
    if (token !== app.downloadToken) return;      // selection changed under us
    // The pane list was taken before the first await, and a pane can go away
    // during one -- clicking through subjects disposes panes, which sets their
    // source to null. Reaching into it then throws, and the catch below would
    // report a disposed pane as a decode failure onto DOM that is no longer on
    // the page. The clip check is the same guard against a pane that is still
    // here but has moved to another subject's clip: its old scheduler was
    // released, so there is nothing left to download.
    if (!pane.source || pane.source.abandoned) continue;
    app.download.pane = index + 1;
    let held = false;
    try {
      held = await pane.source.downloadAll((got, of, bytes) => {
        if (token !== app.downloadToken) return;
        app.download.done = done + got;
        app.download.bytes += 0;                  // bytes come from the totals below
        setStatus(`downloading ${app.download.done} / ${frames} frames`
          + ` · ${(paneBytes() / 1e6).toFixed(0)} MB`);
      });
    } catch (error) {
      /* Said in the pane, and the other panes carry on.
       *
       * This used to propagate out of `downloadSelection` as an unhandled
       * rejection: the pane stayed blank, nothing was logged where anyone
       * would look, and the page went on insisting it was fine. That is how a
       * decoder error reads as "this method is broken" -- which is what
       * happened when every Gaussian frame was handed the container's `.seq`
       * name instead of its own. A pane that cannot show its content has to
       * say why. */
      if (token !== app.downloadToken) return;
      pane._explain(`${pane.method} could not be decoded.`,
                    String(error && error.message || error));
      app.download.resident = false;
      done += totals[index];
      app.download.done = done;
      continue;
    }
    if (!held) app.download.resident = false;
    done += totals[index];
    app.download.done = done;
  }
  if (token !== app.downloadToken) return;
  app.download.complete = true;
  app.download.bytes = paneBytes();
  statusEl.hidden = true;
  refreshPanel();
}

/* Bytes fetched across every pane, from the schedulers themselves rather than
 * counted again here: one counter is one thing to get wrong. */
function paneBytes() {
  return app.panes.reduce(
    (sum, pane) => sum + (pane.source ? pane.source.stats.bytes : 0), 0);
}

function chooseRungs() {
  const panes = app.panes.filter((pane) => pane.source && !isLive(pane.clip));
  if (!panes.length) return;

  if (!app.adapt) {
    for (const pane of panes) { pane.source.useRung(null); pane.source.frozen = false; }
    app.decision = null;
    return;
  }
  const rate = meter.bitsPerSecond;
  if (!rate) return;                 // nothing measured yet; leave as-is

  const laddered = panes.filter((pane) => rungsOf(pane.clip, app.fps).length > 1);
  if (!laddered.length) { app.decision = null; return; }

  /* Deficit first. When the rate cannot carry every pane's cheapest rung,
   * freezing some so the rest play beats starving all of them: a frozen pane
   * holds its last frame while the others keep moving, and `streamer.playback`
   * measures that trade -- on a collapsing trace it turned 30 seconds of stall
   * into 56 of freeze, the same shortfall taken as a decision instead of a
   * failure.
   *
   * Frozen by fullest buffer, and stickily: a pane already frozen stays frozen
   * unless the rate recovers. Reconsidering from scratch each time would thaw
   * one pane and freeze another, and panes would visibly flicker. */
  const buffered = new Map(laddered.map(
    (pane) => [pane, bufferedSeconds(pane, app.frame, app.fps)]));
  const order = [...laddered].sort((a, b) => {
    const froze = (pane) => (pane.source.frozen ? 1 : 0);
    return froze(a) - froze(b) || buffered.get(a) - buffered.get(b);
  });
  const floor = (pane) => rungsOf(pane.clip, app.fps)[0].bitsPerSecond;
  const playing = [...order];
  while (playing.length
         && playing.reduce((sum, pane) => sum + floor(pane), 0) > rate) {
    playing.pop();
  }
  const frozen = new Set(laddered.filter((pane) => !playing.includes(pane)));

  const share = playing.length ? rate / playing.length : 0;
  let spent = 0;
  for (const pane of laddered) {
    pane.source.frozen = frozen.has(pane);
    const rungs = rungsOf(pane.clip, app.fps);
    if (frozen.has(pane)) continue;  // holds its last frame; nothing fetched
    const budget = bufferBudget(share, buffered.get(pane), app.targetBuffer);
    const rung = affordable(rungs, budget);
    pane.source.useRung(rung && rung.name === "default" ? null : rung);
    spent += rung ? rung.bitsPerSecond : 0;
  }
  app.decision = {
    rate, share, spent, panes: panes.length,
    ladders: laddered.length, frozen: frozen.size,
  };
}

function togglePlay() {
  app.playing = !app.playing;
  playPause.textContent = app.playing ? "❚❚" : "▶";
  app.lastAdvance = 0;
}

/* How far playback is behind the rate it was asked for. Reported rather than
 * hidden: a clip at 129 MB a second of decoded frames cannot play at 30 fps
 * over any link, and saying so is more useful than appearing to stutter. */
function playbackRate() {
  return app.shownAt && app.shownAt.length > 1
    ? 1000 * (app.shownAt.length - 1) /
      (app.shownAt[app.shownAt.length - 1] - app.shownAt[0])
    : null;
}

function setStation(value) {
  const poses = rig() ? rig().poses.length : 0;
  if (!poses) return;
  app.station = ((value % poses) + poses) % poses;
  scrubCamera.value = String(app.station);
  cameraLabel.textContent = `${app.station + 1} / ${poses}`;
  updateClips();
  renderMethodList();
}

function bindWipe(handle) {
  let dragging = false;
  const move = (event) => {
    if (!dragging) return;
    const rect = panesEl.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
    document.documentElement.style.setProperty("--wipe", `${fraction * 100}%`);
  };
  handle.addEventListener("pointerdown", (event) => {
    dragging = true;
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener("pointermove", move);
  handle.addEventListener("pointerup", (event) => {
    dragging = false;
    handle.releasePointerCapture(event.pointerId);
  });
}

function bindControls() {
  const adapt = document.getElementById("adapt");
  adapt.checked = app.adapt;
  adapt.addEventListener("change", () => {
    app.adapt = adapt.checked;
    // Applied immediately rather than at the next advance: the switch is most
    // useful while paused, comparing the same frame at two rungs.
    chooseRungs();
    meter.reset();          // the pinned rung's rate says nothing about the other
    refreshPanel();
  });

  let dragging = null;
  panesEl.addEventListener("contextmenu", (event) => event.preventDefault());
  panesEl.addEventListener("pointerdown", (event) => {
    if (app.mode !== "explore" || event.target.id === "wipeHandle") return;
    dragging = { x: event.clientX, y: event.clientY,
                 pan: event.shiftKey || event.button === 2 || event.button === 1 };
    panesEl.setPointerCapture(event.pointerId);
  });
  panesEl.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const dx = event.clientX - dragging.x, dy = event.clientY - dragging.y;
    dragging.x = event.clientX; dragging.y = event.clientY;
    const camera = app.camera;
    if (dragging.pan) {
      const size = [panesEl.clientWidth, panesEl.clientHeight];
      const basis = camera.frame(size);
      const perPixel = camera.distance / basis.focal[1];
      for (let i = 0; i < 3; i++) {
        camera.target[i] -= basis.right[i] * dx * perPixel + basis.down[i] * dy * perPixel;
      }
    } else {
      camera.yaw -= dx * 0.005;
      const limit = 85 * Math.PI / 180;
      camera.pitch = Math.max(-limit, Math.min(limit, camera.pitch + dy * 0.005));
      followCamera();
    }
  });
  panesEl.addEventListener("pointerup", (event) => {
    if (!dragging) return;
    dragging = null;
    panesEl.releasePointerCapture(event.pointerId);
  });
  panesEl.addEventListener("wheel", (event) => {
    if (app.mode !== "explore") return;
    event.preventDefault();
    app.camera.distance *= Math.exp(event.deltaY * 0.001);
  }, { passive: false });

  playPause.addEventListener("click", togglePlay);
  scrubFrame.addEventListener("input", () => {
    app.playing = false; playPause.textContent = "▶";
    showFrame(parseInt(scrubFrame.value, 10));
  });
  scrubCamera.addEventListener("input", () => setStation(parseInt(scrubCamera.value, 10)));
  sceneSelect.addEventListener("change", () => selectScene(sceneSelect.value));
  document.getElementById("modeExplore").addEventListener("click", () => setMode("explore"));
  document.getElementById("modeCompare").addEventListener("click", () => setMode("compare"));
  wipeToggle.addEventListener("click", () => {
    app.wipe = !app.wipe;
    wipeToggle.setAttribute("aria-pressed", String(app.wipe));
    rebuildPanes();
  });
  window.addEventListener("keydown", (event) => {
    if (event.target.tagName === "INPUT" || event.target.tagName === "SELECT") return;
    if (event.key === " ") { event.preventDefault(); togglePlay(); }
    else if (event.key === "ArrowRight") showFrame(app.frame + 1);
    else if (event.key === "ArrowLeft") showFrame(app.frame - 1);
    else if (event.key === "r" && app.mode === "explore") {
      app.camera.goHome();
      followCamera();               // home is a viewpoint too
    }
    else if (event.key === ".") setStation(app.station + 1);
    else if (event.key === ",") setStation(app.station - 1);
  });
}

/* The whole view state lives in the URL fragment, so a particular comparison --
 * this scene, these methods, this rig camera, this frame -- is a link someone
 * else can open. Read once at load, rewritten whenever the state changes. */
function readHash() {
  const out = {};
  for (const part of location.hash.replace(/^#/, "").split("&")) {
    if (!part) continue;
    const [key, value] = part.split("=");
    out[decodeURIComponent(key)] = decodeURIComponent(value || "");
  }
  return out;
}

function writeHash() {
  if (!app.scene) return;
  const parts = [
    `scene=${encodeURIComponent(app.scene)}`,
    `mode=${app.mode}`,
    `methods=${app.methods.map(encodeURIComponent).join(",")}`,
  ];
  if (app.mode === "compare") parts.push(`camera=${app.station}`);
  if (app.frame) parts.push(`frame=${app.frame}`);
  if (app.wipe) parts.push("wipe=1");
  const next = `#${parts.join("&")}`;
  if (location.hash !== next) history.replaceState(null, "", next);
}

async function main() {
  bindControls();
  let index;
  try {
    const response = await fetch("./view.json");
    if (!response.ok) throw new Error(`view.json: HTTP ${response.status}`);
    index = normalise(await response.json());
  } catch (error) {
    return fail(`Could not read the bundle index.\n${error.message || error}`);
  }
  app.index = index;
  app.scenes = index.scenes || {};
  app.fps = index.fps || 30;
  app.camera = new OrbitCamera();
  /* The bundle's title, or the platform's own name.
   *
   * The line under this used to print `index.source`, which is every input
   * path a bundle was built from joined together -- five absolute paths on
   * this machine, wrapped with `word-break: break-all` because they did not
   * fit. That is provenance, and it belongs where provenance is read: it is
   * still in the manifest, and each clip carries its own `detail.source` in
   * the per-pane notes. A header is for saying what this is. */
  const title = index.title || "Open4D Streaming Platform";
  document.getElementById("title").textContent = title;
  document.title = title;
  if (!index.clips || !index.clips.length) return fail("This bundle has no clips.");

  const canvas = document.createElement("canvas");
  if (!canvas.getContext("webgl2") && index.clips.some(hasGeometry)) {
    return fail("This browser could not start WebGL2, which every geometry clip needs.\n"
                + "Pre-rendered clips would still work; try a Chromium- or Firefox-based browser.");
  }

  for (const scene of scenesInBundle()) {
    const option = document.createElement("option");
    option.value = scene;
    option.textContent = scene;
    sceneSelect.appendChild(option);
  }
  // Compare needs a rig; without one in the bundle it has no camera to offer.
  const anyRig = Object.keys(app.scenes).length > 0;
  document.getElementById("modeCompare").disabled = !anyRig;
  if (!anyRig) document.getElementById("modeCompare").title =
    "no capture rig in this bundle — re-export with --corpus pointing at the ORBIT dataset";

  requestAnimationFrame(tick);
  const wanted = readHash();
  const scenes = scenesInBundle();
  app.scene = scenes.includes(wanted.scene) ? wanted.scene : scenes[0];
  sceneSelect.value = app.scene;
  if (wanted.wipe === "1") {
    app.wipe = true;
    wipeToggle.setAttribute("aria-pressed", "true");
  }
  setMode(wanted.mode === "compare" && anyRig ? "compare" : "explore");
  if (wanted.methods) {
    // Only the usable ones: a URL naming a captured method in Explore would
    // otherwise select something this mode cannot show.
    const available = methodsFor(app.scene, app.mode)
      .filter((entry) => entry.usable).map((entry) => entry.method);
    const asked = wanted.methods.split(",").filter((m) => available.includes(m));
    if (asked.length) {
      app.methods = asked;
      renderMethodList();
      rebuildPanes();
    }
  }
  if (wanted.camera) setStation(parseInt(wanted.camera, 10) || 0);
  if (wanted.frame) showFrame(parseInt(wanted.frame, 10) || 0);
}

main();
</script>

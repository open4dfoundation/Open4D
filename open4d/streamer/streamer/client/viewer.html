<!doctype html>
<meta charset="utf-8">
<title>Open4D Streaming Platform</title>
<!--
  The viewer `gs-tools view` serves. One page, no build step and no CDN: it is
  handed a `view.json` bundle (see gs_tools/io/bundle.py) and plays whichever
  representations it finds a renderer for -- see REPRESENTATIONS below, which
  mirrors `open4d.core.Representation`. Today that is 3DGS Gaussians under a
  free camera and pre-rendered pixels for anything that cannot be decoded here
  at all. Gaussian frames arrive as 3DGS PLY or as quantised `.splat`; both
  parse to one shape, so nothing below the parsers knows which it got.

  It has two modes, and the split is not cosmetic -- it is the boundary of what
  can honestly be compared:

  Explore   Free camera, Gaussian methods only, several at once in synced panes.
            Every pane shares one orbit camera, so the geometry differences are
            the only differences. A method that ships no Gaussians cannot appear
            here at all, which is the point: there is nothing to aim a free
            camera at.

  Compare   One camera path -- the scene's own capture rig, read from the corpus
            by gs_tools/cameras.py -- with camera and time scrubbed
            independently. Gaussian methods are rendered at the selected rig
            pose; image methods show what was rendered or captured there. This
            is the mode a volumetric method and a photograph can join, and the
            one where a difference between panes means something numeric.

  The splat path is a WebGL2 EWA splatter. Per Gaussian it builds the world 3D
  covariance on the CPU, projects it to a 2D covariance per frame on the GPU,
  and draws a 3-sigma quad in the covariance's own eigenbasis, so a fragment at
  quad coordinate c has alpha = opacity * exp(-|c|^2/2) with no further algebra.
  Gaussians are depth-sorted far-to-near on the CPU (a counting sort over 16-bit
  depth buckets) and blended premultiplied-over, which is what makes the result
  match a real 3DGS render rather than approximate it. Checked against
  diff_gaussian_rasterization at 62 dB PSNR.
-->
<style>
  :root { color-scheme: dark; --panel: #16181d; --edge: #2c313a; --text: #e6e8ec;
          --dim: #9aa3b2; --accent: #6ea8fe; --bg: #0b0c0f; --wipe: 50%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }
  #app { display: flex; height: 100%; }
  #stage { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #panes { flex: 1; min-height: 0; display: grid; gap: 2px; background: var(--edge); position: relative; }
  #panes.wipe { display: block; }
  .pane { position: relative; background: var(--bg); overflow: hidden; min-width: 0; }
  #panes.wipe .pane { position: absolute; inset: 0; }
  #panes.wipe .pane:nth-child(2) { clip-path: inset(0 0 0 var(--wipe)); }
  .pane canvas, .pane img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pane img { object-fit: contain; }
  .pane .label { position: absolute; top: 8px; left: 10px; z-index: 2; font-size: 11px;
                 letter-spacing: .06em; text-transform: uppercase; color: var(--text);
                 background: #0b0c0fbb; padding: 2px 7px; border-radius: 4px; }
  .pane .missing { position: absolute; inset: 0; display: grid; place-content: center;
                   text-align: center; padding: 24px; color: var(--dim); font-size: 12px;
                   gap: 6px; }
  .pane .missing .why { color: #d8a657; font-weight: 600; }
  #wipeHandle { position: absolute; top: 0; bottom: 0; left: var(--wipe); width: 2px;
                background: var(--accent); cursor: ew-resize; z-index: 3; }
  #wipeHandle::after { content: ""; position: absolute; top: 50%; left: -9px; width: 20px;
                       height: 20px; margin-top: -10px; border-radius: 50%;
                       background: var(--accent); box-shadow: 0 0 0 3px #0b0c0f88; }
  #side { width: 330px; flex: none; border-left: 1px solid var(--edge); background: var(--panel);
          padding: 14px 16px; overflow-y: auto; }
  /* Without a breakpoint a narrow window gave #side its full 330px and collapsed
     #stage to nothing -- and the stage is where the mode toggle, the scrubbers and
     the render itself live, so the viewer looked like a sidebar with no viewer in
     it. Below this width the two stack, stage first. */
  @media (max-width: 820px) {
    #app { flex-direction: column; }
    #stage { flex: 1 1 auto; min-height: 55vh; }
    #side { width: 100%; flex: 0 0 auto; max-height: 45vh;
            border-left: none; border-top: 1px solid var(--edge); }
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       margin: 18px 0 6px; font-weight: 600; }
  select, button { font: inherit; color: var(--text); background: #21252c; border: 1px solid var(--edge);
                   border-radius: 6px; padding: 5px 9px; }
  button:hover:not(:disabled), select:hover { border-color: #3d4552; }
  button:disabled { opacity: .4; cursor: default; }
  select { width: 100%; }
  .seg { display: flex; gap: 0; }
  .seg button { border-radius: 0; flex: 1; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #08111f; border-color: var(--accent); }
  .methods label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .methods input { accent-color: var(--accent); }
  .methods .why { color: var(--dim); font-size: 11px; margin-left: auto; }
  .scrubber { display: grid; grid-template-columns: 62px 1fr 66px; gap: 8px; align-items: center;
              padding: 7px 14px; }
  .scrubber label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .scrubber input { accent-color: var(--accent); }
  .scrubber .value { font-variant-numeric: tabular-nums; color: var(--dim); text-align: right; }
  #transport { border-top: 1px solid var(--edge); background: var(--panel); }
  #transportRow { display: flex; gap: 10px; align-items: center; padding: 8px 14px 4px; }
  #status { position: absolute; bottom: 8px; left: 10px; z-index: 4; font-variant-numeric: tabular-nums;
            color: var(--dim); background: #0b0c0fcc; padding: 3px 8px; border-radius: 5px; }
  #error { position: absolute; inset: 0; display: none; place-content: center; padding: 40px;
           text-align: center; color: #ff9b9b; white-space: pre-wrap; z-index: 5; }
  ul { margin: 4px 0 0; padding-left: 18px; }
  li { color: var(--dim); margin-bottom: 4px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 4px 0 0; }
  dt { color: var(--dim); } dd { margin: 0; font-variant-numeric: tabular-nums; }

  /* The metrics table. Monospace and tabular so columns of numbers line up and
     a value that changes does not shift the ones beside it -- a readout that
     jitters horizontally is unreadable while it updates. */
  table.metrics { width: 100%; border-collapse: collapse; margin: 4px 0 0;
                  font: 11px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
                  font-variant-numeric: tabular-nums; }
  table.metrics th { text-align: right; font-weight: 600; color: var(--dim);
                     padding: 0 0 3px 6px; border-bottom: 1px solid var(--edge);
                     white-space: nowrap; }
  table.metrics th:first-child, table.metrics td:first-child {
    text-align: left; padding-left: 0; }
  table.metrics td { text-align: right; padding: 2px 0 2px 6px; white-space: nowrap; }
  table.metrics tbody tr:hover { background: #1c2027; }
  table.metrics td.name { color: var(--text); max-width: 96px; overflow: hidden;
                          text-overflow: ellipsis; }
  table.metrics td.n { color: var(--text); }
  table.metrics td.void { color: #5b6472; }
  table.metrics tr.frozen td { color: #d8a657; }
  table.metrics tfoot td { border-top: 1px solid var(--edge); color: var(--dim);
                           padding-top: 3px; }

  /* Terse tags instead of sentences. A caveat a reader needs while looking at a
     render -- "SH deg 0", "training view" -- is a label, not a paragraph, and
     three paragraphs of them pushed the numbers off the screen. */
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 0; }
  .tag { font: 10px/1.6 ui-monospace, monospace; letter-spacing: .02em;
         background: #21252c; border: 1px solid var(--edge); border-radius: 3px;
         padding: 0 5px; color: var(--dim); white-space: nowrap; }
  .tag.warn { border-color: #6b5426; color: #d8a657; }
  .tag b { color: var(--text); font-weight: 600; }

  details { margin: 6px 0 0; }
  details > summary { cursor: pointer; color: var(--dim); font-size: 11px;
                      text-transform: uppercase; letter-spacing: .08em;
                      font-weight: 600; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "\25B8 "; color: var(--dim); }
  details[open] > summary::before { content: "\25BE "; }
  label.toggle { display: flex; align-items: center; gap: 7px; margin: 8px 0 0;
                 color: var(--dim); font-size: 11px; cursor: pointer; }
  label.toggle input { accent-color: var(--accent); }
  kbd { background: #21252c; border: 1px solid var(--edge); border-radius: 4px; padding: 0 4px;
        font: 11px ui-monospace, monospace; }
</style>

<div id="app">
  <div id="stage">
    <div id="panes"></div>
    <div id="status">loading…</div>
    <div id="error"></div>
    <div id="transport">
      <div id="transportRow">
        <button id="playPause" title="Space">▶</button>
        <div class="seg" style="flex:1">
          <button id="modeExplore" aria-pressed="true" title="Free camera, shared across panes">explore</button>
          <button id="modeCompare" aria-pressed="false" title="Every pane at one rig pose">compare</button>
        </div>
        <button id="wipeToggle" aria-pressed="false" title="A/B wipe between two panes">A|B</button>
      </div>
      <div class="scrubber">
        <label for="scrubFrame">frame</label>
        <input id="scrubFrame" type="range" min="0" max="0" value="0" step="1">
        <span class="value" id="frameLabel">– / –</span>
      </div>
      <div class="scrubber" id="cameraRow">
        <label for="scrubCamera">camera</label>
        <input id="scrubCamera" type="range" min="0" max="0" value="0" step="1">
        <span class="value" id="cameraLabel">– / –</span>
      </div>
    </div>
  </div>
  <div id="side">
    <h1 id="title">Open4D Streaming Platform</h1>

    <h2>subject</h2>
    <select id="sceneSelect"></select>

    <h2>methods</h2>
    <div class="methods" id="methodList"></div>

    <h2>per pane</h2>
    <table class="metrics" id="paneTable"></table>

    <h2>session</h2>
    <table class="metrics" id="sessionTable"></table>
    <label class="toggle" id="adaptRow" hidden>
      <input type="checkbox" id="adapt" checked> adapt to measured link
    </label>

    <div class="tags" id="tags"></div>

    <details id="notesBlock">
      <summary>caveats</summary>
      <ul id="notes"></ul>
    </details>

    <details>
      <summary>controls</summary>
      <ul id="controlHelp"></ul>
    </details>
  </div>
</div>

<script>
"use strict";

const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const panesEl = document.getElementById("panes");
const scrubFrame = document.getElementById("scrubFrame");
const scrubCamera = document.getElementById("scrubCamera");
const frameLabel = document.getElementById("frameLabel");
const cameraLabel = document.getElementById("cameraLabel");
const playPause = document.getElementById("playPause");
const sceneSelect = document.getElementById("sceneSelect");
const methodList = document.getElementById("methodList");
const cameraRow = document.getElementById("cameraRow");
const wipeToggle = document.getElementById("wipeToggle");

function fail(message) {
  errorEl.textContent = message;
  errorEl.style.display = "grid";
  statusEl.hidden = true;
}


/* --------------------------------------------------------------- shaders --- */
const VERTEX_SHADER = `#version 300 es
precision highp float;
precision highp int;

uniform sampler2D uData;      // RGBA32F, 3 texels per Gaussian
uniform sampler2D uColor;     // RGBA8, 1 texel per Gaussian
uniform int uDataWidth;
uniform int uColorWidth;
uniform vec3 uEye;
uniform vec3 uRight;
uniform vec3 uDown;
uniform vec3 uForward;
uniform vec2 uFocal;          // pixels
uniform vec2 uViewport;       // pixels

in vec2 aCorner;              // quad corner in [-3, 3], i.e. 3 sigma
in uint aIndex;               // Gaussian index, in far-to-near order

out vec2 vCorner;
out vec4 vColor;

vec4 fetchData(uint texel) {
  int index = int(texel);
  return texelFetch(uData, ivec2(index % uDataWidth, index / uDataWidth), 0);
}

void main() {
  uint base = aIndex * 3u;
  vec4 slot0 = fetchData(base);
  vec4 slot1 = fetchData(base + 1u);
  vec4 slot2 = fetchData(base + 2u);

  vec3 rel = slot0.xyz - uEye;
  vec3 cam = vec3(dot(rel, uRight), dot(rel, uDown), dot(rel, uForward));
  // Behind the camera, or so close that the projection Jacobian blows up.
  if (cam.z < 0.05) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }

  mat3 cov = mat3(
    vec3(slot1.x, slot1.y, slot1.z),
    vec3(slot1.y, slot1.w, slot2.x),
    vec3(slot1.z, slot2.x, slot2.y)
  );
  // Columns are the camera axes, so this maps camera -> world and its
  // transpose maps world -> camera.
  mat3 basis = mat3(uRight, uDown, uForward);
  mat3 worldToCam = transpose(basis);
  mat3 covCam = worldToCam * cov * basis;

  float inv = 1.0 / cam.z;
  mat3 jacobian = mat3(
    vec3(uFocal.x * inv, 0.0, 0.0),
    vec3(0.0, uFocal.y * inv, 0.0),
    vec3(-uFocal.x * cam.x * inv * inv, -uFocal.y * cam.y * inv * inv, 0.0)
  );
  mat3 projected = jacobian * covCam * transpose(jacobian);

  // The 0.3 px dilation is 3DGS's low-pass filter: without it a Gaussian
  // thinner than a pixel aliases into flicker as the camera moves.
  float a = projected[0][0] + 0.3;
  float b = projected[1][0];
  float c = projected[1][1] + 0.3;
  float mid = 0.5 * (a + c);
  float radius = sqrt(max(mid * mid - (a * c - b * b), 0.0));
  float major = mid + radius;
  float minor = mid - radius;
  if (minor <= 0.0) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }

  // Eigenvector for the major eigenvalue: (a - major) x + b y = 0.
  vec2 axis = abs(b) < 1e-12 ? (a >= c ? vec2(1.0, 0.0) : vec2(0.0, 1.0))
                             : normalize(vec2(b, major - a));
  vec2 majorAxis = min(sqrt(major), 512.0) * axis;
  vec2 minorAxis = min(sqrt(minor), 512.0) * vec2(-axis.y, axis.x);
  vec2 offsetPx = aCorner.x * majorAxis + aCorner.y * minorAxis;

  vec2 centrePx = vec2(uFocal.x * cam.x * inv, uFocal.y * cam.y * inv);
  // Image y runs down, NDC y runs up.
  vec2 toNdc = vec2(2.0 / uViewport.x, -2.0 / uViewport.y);
  gl_Position = vec4((centrePx + offsetPx) * toNdc, 0.0, 1.0);

  int ci = int(aIndex);
  vec4 rgb = texelFetch(uColor, ivec2(ci % uColorWidth, ci / uColorWidth), 0);
  vColor = vec4(rgb.rgb, slot0.w);
  vCorner = aCorner;
}
`;

const FRAGMENT_SHADER = `#version 300 es
precision highp float;
in vec2 vCorner;
in vec4 vColor;
out vec4 fragColor;
void main() {
  float squared = dot(vCorner, vCorner);
  if (squared > 9.0) discard;          // outside 3 sigma
  float alpha = vColor.a * exp(-0.5 * squared);
  if (alpha < 1.0 / 510.0) discard;
  fragColor = vec4(vColor.rgb * alpha, alpha);   // premultiplied
}
`;

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
  }
  return shader;
}

/* -------------------------------------------------------------- renderer --- */
class SplatRenderer {
  constructor(gl) {
    this.gl = gl;
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, VERTEX_SHADER));
    gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, FRAGMENT_SHADER));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || "program link failed");
    }
    this.program = program;
    this.uniform = {};
    for (const name of ["uData", "uColor", "uDataWidth", "uColorWidth", "uEye",
                        "uRight", "uDown", "uForward", "uFocal", "uViewport"]) {
      this.uniform[name] = gl.getUniformLocation(program, name);
    }

    this.corners = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.corners);
    // Triangle strip over a 3-sigma square.
    gl.bufferData(gl.ARRAY_BUFFER,
      new Float32Array([-3, -3, 3, -3, -3, 3, 3, 3]), gl.STATIC_DRAW);

    this.indexBuffer = gl.createBuffer();
    this.dataTexture = this.makeTexture(gl.RGBA32F, gl.FLOAT);
    this.colorTexture = this.makeTexture(gl.RGBA8, gl.UNSIGNED_BYTE);
    this.width = 2048;
    this.count = 0;
    this.order = null;
    this.depths = null;
    this.buckets = new Uint32Array(65536);
    this.starts = new Uint32Array(65536);
  }

  makeTexture(internalFormat, type) {
    const gl = this.gl;
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    texture._internalFormat = internalFormat;
    texture._type = type;
    return texture;
  }

  upload(frame) {
    const gl = this.gl;
    this.count = frame.count;
    this.positions = frame.positions;

    const dataTexels = frame.count * 3;
    const dataRows = Math.ceil(dataTexels / this.width);
    const padded = new Float32Array(this.width * dataRows * 4);
    padded.set(frame.data);
    gl.bindTexture(gl.TEXTURE_2D, this.dataTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.width, dataRows, 0,
                  gl.RGBA, gl.FLOAT, padded);

    const colorRows = Math.ceil(frame.count / this.width);
    const paddedColors = new Uint8Array(this.width * colorRows * 4);
    paddedColors.set(frame.colors);
    gl.bindTexture(gl.TEXTURE_2D, this.colorTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, this.width, colorRows, 0,
                  gl.RGBA, gl.UNSIGNED_BYTE, paddedColors);

    if (!this.order || this.order.length < frame.count) {
      this.order = new Uint32Array(frame.count);
      this.depths = new Float32Array(frame.count);
    }
    this.sortedFor = null;
  }

  /* Far-to-near order, by a counting sort over 16-bit depth buckets.
   * A comparison sort of half a million floats per frame is the one thing that
   * would make playback stutter; bucketing is O(n) and the quantisation error
   * is below what a swapped pair of overlapping splats can show. */
  sort(eye, forward) {
    const n = this.count;
    const positions = this.positions;
    const depths = this.depths;
    let low = Infinity, high = -Infinity;
    for (let i = 0; i < n; i++) {
      const d = (positions[i * 3] - eye[0]) * forward[0]
              + (positions[i * 3 + 1] - eye[1]) * forward[1]
              + (positions[i * 3 + 2] - eye[2]) * forward[2];
      depths[i] = d;
      if (d < low) low = d;
      if (d > high) high = d;
    }
    const buckets = this.buckets.fill(0);
    const scale = high > low ? 65535 / (high - low) : 0;
    const key = new Uint16Array(n);
    for (let i = 0; i < n; i++) {
      // Negated, so bucket 0 is the farthest and the sort comes out back-to-front.
      const bucket = 65535 - ((depths[i] - low) * scale) | 0;
      key[i] = bucket < 0 ? 0 : bucket > 65535 ? 65535 : bucket;
      buckets[key[i]]++;
    }
    const starts = this.starts;
    let running = 0;
    for (let b = 0; b < 65536; b++) { starts[b] = running; running += buckets[b]; }
    const order = this.order;
    for (let i = 0; i < n; i++) order[starts[key[i]]++] = i;

    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.indexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, order.subarray(0, n), gl.DYNAMIC_DRAW);
  }

  /* `rect` is where in the canvas to draw, `canvasSize` the whole thing.
   * They differ in compare mode: the splat is letterboxed to the capture rig's
   * aspect so it frames the subject exactly as the captured image beside it
   * does, and a difference between the two panes is then a difference in the
   * reconstruction rather than in the crop. */
  draw(camera, rect, canvasSize) {
    const gl = this.gl;
    gl.viewport(0, 0, canvasSize[0], canvasSize[1]);
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(0.043, 0.047, 0.059, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    // The letterboxed region is cleared to black, because that is what the
    // corpus captured against and what an image pane beside this one shows.
    // Matching it is what lets a silhouette be judged rather than guessed at.
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(rect[0], rect[1], rect[2], rect[3]);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.SCISSOR_TEST);
    if (!this.count) return;
    gl.viewport(rect[0], rect[1], rect[2], rect[3]);

    gl.useProgram(this.program);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.dataTexture);
    gl.uniform1i(this.uniform.uData, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.colorTexture);
    gl.uniform1i(this.uniform.uColor, 1);
    gl.uniform1i(this.uniform.uDataWidth, this.width);
    gl.uniform1i(this.uniform.uColorWidth, this.width);
    gl.uniform3fv(this.uniform.uEye, camera.eye);
    gl.uniform3fv(this.uniform.uRight, camera.right);
    gl.uniform3fv(this.uniform.uDown, camera.down);
    gl.uniform3fv(this.uniform.uForward, camera.forward);
    gl.uniform2f(this.uniform.uFocal, camera.focal[0], camera.focal[1]);
    gl.uniform2f(this.uniform.uViewport, rect[2], rect[3]);

    const corner = gl.getAttribLocation(this.program, "aCorner");
    gl.bindBuffer(gl.ARRAY_BUFFER, this.corners);
    gl.enableVertexAttribArray(corner);
    gl.vertexAttribPointer(corner, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(corner, 0);

    const index = gl.getAttribLocation(this.program, "aIndex");
    gl.bindBuffer(gl.ARRAY_BUFFER, this.indexBuffer);
    gl.enableVertexAttribArray(index);
    gl.vertexAttribIPointer(index, 1, gl.UNSIGNED_INT, 0, 0);
    gl.vertexAttribDivisor(index, 1);

    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.count);
  }
}

/* ---------------------------------------------------------------- camera --- */
const WORLD_UP = [0, 1, 0];

function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function normalize(v) {
  const n = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / n, v[1] / n, v[2] / n];
}

class OrbitCamera {
  constructor() { this.fovY = 50 * Math.PI / 180; this.reset([0, 0, 0], 4); }

  reset(target, distance) {
    this.target = target.slice();
    this.distance = distance;
    this.home = { target: target.slice(), distance };
    this.yaw = 0;
    this.pitch = 12 * Math.PI / 180;
  }

  goHome() {
    this.target = this.home.target.slice();
    this.distance = this.home.distance;
    this.yaw = 0;
    this.pitch = 12 * Math.PI / 180;
  }

  /* Distance at which a sphere of `radius` about the target just fits.
   * Whichever of the two half-angles is narrower is the binding one, so a wide
   * scene in a tall window frames as well as a standing figure in a wide one. */
  fitDistance(radius, viewport) {
    const halfY = this.fovY / 2;
    const aspect = Math.max(viewport[0], 1) / Math.max(viewport[1], 1);
    const halfX = Math.atan(aspect * Math.tan(halfY));
    return (radius / Math.sin(Math.min(halfX, halfY))) * 1.05;
  }

  frame(viewport) {
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const eye = [
      this.target[0] + this.distance * Math.sin(this.yaw) * cp,
      this.target[1] + this.distance * sp,
      this.target[2] + this.distance * Math.cos(this.yaw) * cp,
    ];
    const forward = normalize([this.target[0] - eye[0], this.target[1] - eye[1], this.target[2] - eye[2]]);
    // right = forward x up, down = forward x right: an orthonormal (right, down,
    // forward) triple in which world +Y ends up as screen-up.
    const right = normalize(cross(forward, WORLD_UP));
    const down = normalize(cross(forward, right));
    const fy = 0.5 * viewport[1] / Math.tan(this.fovY / 2);
    return { eye, right, down, forward, focal: [fy, fy] };
  }
}


/* --------------------------------------------------- mesh / point shaders ---
 * Same camera math as the splat path -- eye plus a (right, down, forward) basis
 * and a focal length in pixels -- so a mesh pane and a splat pane of the same
 * scene agree geometrically. What differs is that this writes a real depth and
 * runs the depth test: triangles occlude, where splats are blended in sorted
 * order and never do. */
const MESH_VERTEX_SHADER = `#version 300 es
precision highp float;

uniform vec3 uEye;
uniform vec3 uRight;
uniform vec3 uDown;
uniform vec3 uForward;
uniform vec2 uFocal;
uniform vec2 uViewport;
uniform vec2 uDepthRange;   // near, far
uniform float uPointSize;

in vec3 aPosition;
in vec4 aColor;

out vec3 vWorld;
out vec4 vColor;

void main() {
  vWorld = aPosition;
  vColor = aColor;
  vec3 p = aPosition - uEye;
  vec3 cam = vec3(dot(p, uRight), dot(p, uDown), dot(p, uForward));
  float near = uDepthRange.x, far = uDepthRange.y;
  if (cam.z < near) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }

  // The perspective divide rides in w, so interpolation stays perspective
  // correct and the depth buffer gets the usual hyperbolic z.
  vec2 px = vec2(uFocal.x * cam.x, uFocal.y * cam.y);
  vec2 toNdc = vec2(2.0 / uViewport.x, -2.0 / uViewport.y);
  float clipZ = (cam.z * (far + near) - 2.0 * far * near) / (far - near);
  gl_Position = vec4(px * toNdc, clipZ, cam.z);
  gl_PointSize = uPointSize;
}
`;

const MESH_FRAGMENT_SHADER = `#version 300 es
precision highp float;

uniform vec3 uEye;
uniform int uMode;          // 0 = triangles, 1 = points
uniform float uAmbient;

in vec3 vWorld;
in vec4 vColor;
out vec4 fragColor;

void main() {
  vec3 toEye = normalize(uEye - vWorld);
  vec3 normal;
  if (uMode == 1) {
    // A point has no surface to differentiate, so it is shaded as a small
    // sphere: the disc's own coordinates stand in for a normal, which reads as
    // round rather than as a flat chip.
    vec2 disc = gl_PointCoord * 2.0 - 1.0;
    float squared = dot(disc, disc);
    if (squared > 1.0) discard;
    normal = normalize(vec3(disc.x, -disc.y, sqrt(max(1.0 - squared, 0.0))));
  } else {
    // Flat shading from screen-space derivatives. No CPU normals and none in
    // the file: Open4D's PLY writer refuses to store them, and a normal derived
    // here is correct for whatever geometry actually arrived.
    normal = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
    if (dot(normal, toEye) < 0.0) normal = -normal;
  }
  float lambert = uAmbient + (1.0 - uAmbient) * max(dot(normal, toEye), 0.0);
  fragColor = vec4(vColor.rgb * lambert, 1.0);
}
`;

/* Triangles and points, sharing one program. Same interface as SplatRenderer --
 * upload / sort / draw -- so a Pane does not know which it is holding; `sort`
 * is a no-op here because the depth buffer does that job. */
class MeshRenderer {
  constructor(gl, mode) {
    this.gl = gl;
    this.mode = mode === "points" ? 1 : 0;
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, MESH_VERTEX_SHADER));
    gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, MESH_FRAGMENT_SHADER));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || "program link failed");
    }
    this.program = program;
    this.uniform = {};
    for (const name of ["uEye", "uRight", "uDown", "uForward", "uFocal",
                        "uViewport", "uDepthRange", "uPointSize", "uMode",
                        "uAmbient"]) {
      this.uniform[name] = gl.getUniformLocation(program, name);
    }
    this.positionBuffer = gl.createBuffer();
    this.colorBuffer = gl.createBuffer();
    this.indexBuffer = gl.createBuffer();
    this.count = 0;
    this.indexCount = 0;
    this.bounds = null;
  }

  upload(parsed) {
    const gl = this.gl;
    this.count = parsed.count;
    this.bounds = parsed.bounds;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, parsed.positions, gl.DYNAMIC_DRAW);

    // A mesh with no colour is drawn in the same near-white the Qt sequence
    // viewer uses, so the two do not disagree about what an uncoloured mesh
    // looks like.
    const colors = parsed.colors || (() => {
      const flat = new Uint8Array(parsed.count * 4);
      for (let i = 0; i < parsed.count; i++) {
        flat[i * 4] = 242; flat[i * 4 + 1] = 242; flat[i * 4 + 2] = 247;
        flat[i * 4 + 3] = 255;
      }
      return flat;
    })();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, colors, gl.DYNAMIC_DRAW);

    this.indexCount = parsed.indices ? parsed.indices.length : 0;
    if (this.indexCount) {
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, parsed.indices, gl.DYNAMIC_DRAW);
    }
  }

  /* Nothing to do: the depth buffer resolves occlusion, which is the whole
   * reason a mesh does not need the far-to-near ordering a splat does. */
  sort() {}

  /* Near and far from the frame's own bounding box, so a scene of any scale
   * gets usable depth precision instead of a guessed constant. */
  _depthRange(eye) {
    if (!this.bounds) return [0.01, 100.0];
    const [lower, upper] = this.bounds;
    let near = Infinity, far = 0;
    for (let corner = 0; corner < 8; corner++) {
      const point = [
        (corner & 1) ? upper[0] : lower[0],
        (corner & 2) ? upper[1] : lower[1],
        (corner & 4) ? upper[2] : lower[2],
      ];
      const distance = Math.hypot(point[0] - eye[0], point[1] - eye[1], point[2] - eye[2]);
      near = Math.min(near, distance);
      far = Math.max(far, distance);
    }
    // The eye can be inside the box, so the near plane cannot simply be the
    // closest corner.
    return [Math.max(near * 0.5, far * 1e-4, 1e-4), far * 2 + 1e-3];
  }

  draw(camera, rect, canvasSize) {
    const gl = this.gl;
    gl.viewport(0, 0, canvasSize[0], canvasSize[1]);
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(0.043, 0.047, 0.059, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (!this.count) return;

    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(rect[0], rect[1], rect[2], rect[3]);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.disable(gl.SCISSOR_TEST);
    gl.viewport(rect[0], rect[1], rect[2], rect[3]);

    gl.useProgram(this.program);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.BLEND);

    const position = gl.getAttribLocation(this.program, "aPosition");
    gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 3, gl.FLOAT, false, 0, 0);

    const color = gl.getAttribLocation(this.program, "aColor");
    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
    gl.enableVertexAttribArray(color);
    gl.vertexAttribPointer(color, 4, gl.UNSIGNED_BYTE, true, 0, 0);

    const depth = this._depthRange(camera.eye);
    gl.uniform3fv(this.uniform.uEye, camera.eye);
    gl.uniform3fv(this.uniform.uRight, camera.right);
    gl.uniform3fv(this.uniform.uDown, camera.down);
    gl.uniform3fv(this.uniform.uForward, camera.forward);
    gl.uniform2f(this.uniform.uFocal, camera.focal[0], camera.focal[1]);
    gl.uniform2f(this.uniform.uViewport, rect[2], rect[3]);
    gl.uniform2f(this.uniform.uDepthRange, depth[0], depth[1]);
    gl.uniform1f(this.uniform.uPointSize, 3.0);
    gl.uniform1i(this.uniform.uMode, this.mode);
    gl.uniform1f(this.uniform.uAmbient, 0.32);

    if (this.mode === 0 && this.indexCount) {
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
      gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_INT, 0);
    } else {
      // A mesh clip whose frames carry no faces still has vertices worth
      // showing, so it falls through to points rather than drawing nothing.
      gl.uniform1i(this.uniform.uMode, 1);
      gl.drawArrays(gl.POINTS, 0, this.count);
    }
    gl.disable(gl.DEPTH_TEST);
  }
}

/* ---------------------------------------------------- representations ---
 * What a decoded frame *is*, mirroring `open4d.core.Representation`. A
 * representation decides which source parses it, which surface shows it, and
 * whether a free camera is meaningful -- so adding one is an entry here plus a
 * renderer, not a new branch in every function that touches a clip.
 *
 * `geometry` is core's `Representation.has_geometry`, and decides whether a free
 * camera is meaningful: pixels carry none, so such a pane shows whatever camera
 * the renderer chose and its controls say so.
 *
 * Every representation core defines is registered here. Being in this table is
 * still the separate question of whether playback is possible at all, which is
 * what a clip naming an unregistered representation runs into -- it is reported
 * as unplayable rather than rendering a blank pane, and that is what the next
 * representation to arrive here without a renderer will get.
 */
const REPRESENTATIONS = {
  mesh: {
    geometry: true,
    surface: "canvas",
    decode: decodeFrame("mesh"),
    cacheSize: 6,
    renderer: (gl) => new MeshRenderer(gl, "mesh"),
  },
  points: {
    geometry: true,
    surface: "canvas",
    decode: decodeFrame("points"),
    cacheSize: 6,
    renderer: (gl) => new MeshRenderer(gl, "points"),
  },
  gaussians: {
    geometry: true,
    surface: "canvas",
    decode: decodeFrame("gaussians"),
    cacheSize: 6,
    renderer: (gl) => new SplatRenderer(gl),
  },
  pixels: {
    geometry: false,
    surface: "image",
    // Not the worker: an <img> needs the main thread, and a browser already
    // decodes an image off it, so there is nothing to move.
    decode: decodeImage,
    // Pixels decode to an <img>, which is cheap next to a parsed vertex buffer,
    // so a longer window costs little and covers a faster scrub.
    cacheSize: 16,
  },
};


/* view.json v1 called these `kind`. Bundles already on disk are worth keeping
 * readable, so the field is migrated on load rather than requiring a re-export. */
const LEGACY_KINDS = { splats: "gaussians", images: "pixels" };

function spec(clip) { return clip ? REPRESENTATIONS[clip.representation] : undefined; }
function playable(clip) { return spec(clip) !== undefined; }
function hasGeometry(clip) { const s = spec(clip); return s !== undefined && s.geometry; }
function isPixels(clip) { const s = spec(clip); return s !== undefined && !s.geometry; }
/* A clip rendered as it is watched: a URL instead of a frame list, so there is
 * no scheduler, no cache and nothing to scrub. See streamer/live.py. */
function isLive(clip) { return !!(clip && clip.stream); }
/* What a streamed pane should call itself. The transport is the same either
 * way; what differs is whether anything is being computed while you watch, and
 * calling a replay "live" is a claim the software does not support. */
function streamLabel(clip) {
  return clip && clip.stream && clip.stream.origin === "replay" ? "replay" : "live";
}

/* ---------------------------------------------------------------- decoding ---
 * Geometry is parsed in a worker (client/worker.js), because parsing is the one
 * expensive synchronous step in playback -- 16 to 32 ms a frame on this
 * repository's content -- and on the main thread every one of those is a missed
 * frame for *every* pane, not just the one decoding.
 *
 * One worker, not a pool. Decoding is serialised through it, which is enough to
 * unblock the main thread and is the whole win; a pool would add throughput and
 * a copy of the 286 kB Draco module per worker, and there is no measurement yet
 * saying the queue is the bottleneck rather than the network.
 *
 * Buffers go in and come back transferred, so nothing large is copied. That does
 * mean the request buffer is neutered afterwards, which is correct here -- the
 * Scheduler has no use for the bytes once they are parsed -- and would be a bug
 * for any caller that wanted to keep them.
 */
class WorkerDecoder {
  constructor(url = "client/worker.js") {
    this.url = url;
    this.worker = null;
    this.pending = new Map();
    this.nextId = 1;
  }

  _start() {
    if (this.worker) return this.worker;
    this.worker = new Worker(this.url);
    this.worker.onmessage = (event) => {
      const { id, parsed, error } = event.data;
      const settle = this.pending.get(id);
      if (!settle) return;
      this.pending.delete(id);
      if (error) settle.reject(new Error(error));
      else settle.resolve(parsed);
    };
    this.worker.onerror = (event) => {
      // A worker that fails to start fails every request, and silently unless
      // this rejects them: the page would sit at "loading" with no reason.
      const reason = new Error(
        `decode worker failed: ${event.message || "could not start " + this.url}`);
      for (const settle of this.pending.values()) settle.reject(reason);
      this.pending.clear();
    };
    return this.worker;
  }

  decode(representation, buffer, url) {
    const worker = this._start();
    const id = this.nextId++;
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject });
      worker.postMessage({ id, representation, url, buffer }, [buffer]);
    });
  }
}

const decoder = new WorkerDecoder();

/* What a representation hands the Scheduler: same signature as before, so
 * nothing downstream knows the parse moved off this thread. */
function decodeFrame(representation) {
  return (buffer, url) => decoder.decode(representation, buffer, url);
}

/* ---------------------------------------------------------- one file a clip ---
 * A clip packed as a single container: a header naming the frames, then their
 * bytes end to end. See streamer/sequence.py for the layout.
 *
 * One request instead of thirty. On loopback that changes nothing, which is
 * why per-frame fetching survived so long; over a 20 ms link thirty frames is
 * thirty round trips, 600 ms of latency before anything plays. And for a free
 * camera the sequence is the only sensible unit anyway -- a frame that has
 * been thrown away cannot be redrawn from a new angle, so the whole thing has
 * to be held regardless of how it was asked for.
 */
/* A frame's suffix, by the same rule `worker.js` uses to choose its codec.
 * Transcribed rather than shared because the worker is a separate script, and
 * held to the original by `streamer_tests/test_client_parsers.py`. */
function suffixOf(url) {
  const path = String(url).split("?", 1)[0];
  const dot = path.lastIndexOf(".");
  return dot < 0 ? "" : path.slice(dot).toLowerCase();
}

const SEQ_MAGIC = "O4DSEQ\0\0";
//: magic(8) + version(4) + count(4) + suffix length(4)
const SEQ_PREAMBLE = 20;

/* The header of a container, from its first bytes. Parsed separately from the
 * body so a download that has only started can already say how many frames are
 * coming, which is what a progress count needs. */
function readSequenceHeader(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length < SEQ_PREAMBLE) throw new Error("sequence header truncated");
  let magic = "";
  for (let i = 0; i < 8; i++) magic += String.fromCharCode(bytes[i]);
  if (magic !== SEQ_MAGIC) throw new Error("not a sequence container");
  const view = new DataView(buffer);
  const version = view.getUint32(8, true);
  if (version !== 1) throw new Error(`sequence version ${version} is not 1`);
  const count = view.getUint32(12, true);
  const suffixLength = view.getUint32(16, true);
  let suffix = "";
  for (let i = 0; i < suffixLength; i++) {
    suffix += String.fromCharCode(bytes[SEQ_PREAMBLE + i]);
  }
  const table = SEQ_PREAMBLE + suffixLength;
  if (bytes.length < table + 8 * count) throw new Error("sequence table truncated");
  const entries = [];
  for (let i = 0; i < count; i++) {
    entries.push({
      offset: view.getUint32(table + 8 * i, true),
      length: view.getUint32(table + 8 * i + 4, true),
    });
  }
  return { suffix, entries };
}

/* One frame's bytes, as its own ArrayBuffer.
 *
 * Sliced rather than viewed: the decode worker takes ownership of what it is
 * given, and handing it a view into the container would transfer the whole
 * container on the first frame and leave the rest unreachable. */
function sequenceFrame(buffer, header, index) {
  const entry = header.entries[index];
  return buffer.slice(entry.offset, entry.offset + entry.length);
}

/* ------------------------------------------------------------- adaptation ---
 * Three pieces: measure what the link delivers, read the ladder a clip
 * carries, and pick a rung per pane.
 *
 * The rule here is deliberately *not* the one `streamer.policy` implements.
 * That one maximises total weighted quality under a budget, which is right for
 * a player -- and wrong for a comparison, because the way to maximise a sum is
 * to make the panes unequal, spending on whichever gains most per byte. A
 * viewer whose whole purpose is judging two methods against each other must
 * not decide that one of them gets the bandwidth.
 *
 * So the budget is split evenly and each pane takes the best rung its share
 * affords. Equal shares, equal treatment, and the comparison stays honest.
 * `policy.choose` is still what answers "what would an optimising client do",
 * from Python, where it can be measured -- and it is not transcribed here,
 * which also means there is no second implementation of it to drift.
 */

class RateMeter {
  /* What the link is actually delivering, as an exponentially weighted mean.
   *
   * Measured from this client's own fetches rather than told: a browser cannot
   * see the server's configured capacity, and a client that trusted a number
   * it was handed would not be estimating anything. Weighted by bytes, so a
   * 33 kB frame counts for more than a 3 kB one -- an unweighted mean over
   * mixed sizes is dominated by whichever rung happens to be small.
   *
   * Only samples above `minBytes` count. A cache hit or a 304 completes in
   * microseconds and would read as a gigabit link, which is exactly the
   * over-estimate that then overshoots the real one.
   */
  constructor({ halfLife = 8, minBytes = 2048 } = {}) {
    this.halfLife = halfLife;          // samples, not seconds
    this.minBytes = minBytes;
    this.bitsPerSecond = 0;
    this.samples = 0;
    this.bytes = 0;
  }

  record(bytes, seconds) {
    if (bytes < this.minBytes || seconds <= 0) return;
    const rate = (bytes * 8) / seconds;
    this.samples += 1;
    this.bytes += bytes;
    if (this.samples === 1) { this.bitsPerSecond = rate; return; }
    const alpha = 1 - Math.pow(0.5, 1 / this.halfLife);
    this.bitsPerSecond += alpha * (rate - this.bitsPerSecond);
  }

  reset() { this.bitsPerSecond = 0; this.samples = 0; this.bytes = 0; }
}

const meter = new RateMeter();

/* A clip's renditions, cheapest first: the default plus whatever variants the
 * manifest carries. The default's size is `detail.bytes_per_frame`, which
 * `streamer.metrics --write` records -- a variant states its own size, but the
 * default's is only on disk, so without that a client can compare the rungs it
 * might move to and not the one it is on. */
function rungsOf(clip, fps) {
  if (!clip || !clip.frames || !clip.frames.length) return [];
  const detail = clip.detail || {};
  const rungs = [];
  if (detail.bytes_per_frame) {
    rungs.push({
      name: "default", frames: clip.frames,
      bitsPerSecond: detail.bytes_per_frame * 8 * fps,
      quality: detail.quality || {},
    });
  }
  for (const variant of clip.variants || []) {
    if (!variant.frames || !variant.frames.length) continue;
    rungs.push({
      name: variant.name, frames: variant.frames,
      bitsPerSecond: (variant.bytes / variant.frames.length) * 8 * fps,
      quality: variant.quality || {},
    });
  }
  return rungs.sort((a, b) => a.bitsPerSecond - b.bitsPerSecond);
}

/* The budget to spend, given the rate and how full this pane's buffer is.
 *
 * Rate alone is a lagging average, so a client that trusts it keeps buying the
 * rung the link *used* to afford and drains its buffer doing so. Occupancy is
 * the state that says whether the last few decisions were affordable.
 *
 * Clamped to [0.5, 1.5] of the estimate: unclamped, an empty buffer would pick
 * the floor and never climb out, and a full one would overshoot the link and
 * empty itself. Mirrors `streamer.playback.buffer_budget`, where the same rule
 * is measured -- worth 0.7 dB there, which is honest about how much it buys. */
function bufferBudget(rate, seconds, target) {
  if (target <= 0) return rate;
  return rate * Math.max(0.5, Math.min(1.5, seconds / target));
}

/* Seconds of decoded playback a pane has ahead of the frame being shown.
 *
 * Read off the scheduler's cache rather than tracked separately: the cache
 * *is* the buffer, and a second counter would be a second thing to get wrong.
 * Only frames ahead of the playhead count -- ones behind it are cached for a
 * scrub backwards and buy no time. */
function bufferedSeconds(pane, frame, fps) {
  if (!pane.source || !pane.source.cache) return 0;
  let ahead = 0;
  for (const index of pane.source.cache.keys()) if (index >= frame) ahead += 1;
  return ahead / fps;
}

/* The best rung a share affords, or the cheapest when nothing does.
 *
 * Falling back to the cheapest rather than showing nothing: a pane that has
 * gone blank tells a viewer less than a pane that is visibly coarse, and the
 * frames are on disk either way -- this is a bundle, not a live encoder, so
 * the only cost of overrunning is that it arrives late. */
function affordable(rungs, share) {
  if (!rungs.length) return null;
  let chosen = rungs[0];
  for (const rung of rungs) if (rung.bitsPerSecond <= share) chosen = rung;
  return chosen;
}

/* ------------------------------------------------------------- scheduling ---
 * When a frame can only be decoded after another one, requesting it and hoping
 * is wrong. `open4d.core.Dependency` is where that is declared -- a codec's
 * frames may need the group's key frame first (`gop`, as in Vega's
 * group-of-volumes), or its decode stream may not rewind at all (`sequential`,
 * as in ReRF) -- and a manifest carries the declaration per clip.
 *
 * This is that model's client half. `chain` is a transcription of
 * Dependency.chain, and being a transcription is a liability: two
 * implementations of one rule in two languages drift. So it is held to the
 * Python one by a test that runs both over the same cases
 * (streamer_tests/test_scheduler.py). Change one, and that test tells you about
 * the other.
 *
 * Every clip this repository writes today is independent, because every
 * exporter decodes before it writes. The gop and sequential paths are therefore
 * tested rather than exercised; they are what a producer serving a bitstream as
 * its frames would need, and building them after such a producer existed would
 * mean changing the client at the same time as trusting a new encoder.
 */
const INDEPENDENT = { mode: "independent", keyFrames: [] };

function dependencyOf(clip) {
  const raw = clip && clip.dependency;
  if (!raw) return INDEPENDENT;
  return { mode: raw.mode, keyFrames: raw.key_frames || [] };
}

/* The frames to decode, in order, to make `index` available -- see
 * Dependency.chain for why a backward seek in a sequential stream comes back as
 * a full replay rather than a step. `decoded` is where the decoder currently
 * sits, or null. */
function chain(dependency, index, decoded = null) {
  if (index < 0) throw new Error("index must be nonnegative");
  if (dependency.mode === "independent") return [index];
  if (decoded === index) return [];

  let start;
  if (dependency.mode === "gop") {
    const keys = dependency.keyFrames.filter((key) => key <= index);
    if (!keys.length) throw new Error(`no key frame at or before ${index}`);
    start = keys[keys.length - 1];
    if (decoded !== null && start <= decoded && decoded < index) start = decoded + 1;
  } else {
    start = decoded !== null && decoded < index ? decoded + 1 : 0;
  }
  const frames = [];
  for (let i = start; i <= index; i++) frames.push(i);
  return frames;
}

/* One cache, one prefetch policy, one place that honours the dependency chain.
 *
 * Before this the two clip sources each kept their own: different look-ahead
 * (two frames against four), and only one of them evicted -- the image path
 * grew without bound, so scrubbing a long clip kept every frame it had ever
 * shown. Hoisting it fixes that and is most of why this exists today, given
 * that nothing yet declares a dependency to honour.
 */
class Scheduler {
  constructor(clip, root, decode,
              { cacheSize = 6, lookAhead = 3, meter = null } = {}) {
    this.clip = clip;
    this.root = root;
    this.decode = decode;
    // Passed in rather than reached for as a page global. A scheduler that
    // read one could not be exercised outside a page -- and this one is, by
    // `streamer_tests/test_scheduler.py`, which runs it as shipped under Node.
    this.meter = meter;
    this.dependency = dependencyOf(clip);
    this.cacheSize = Math.max(1, cacheSize);
    this.lookAhead = lookAhead;
    this.cache = new Map();          // index -> decoded frame, insertion-ordered
    this.pending = new Map();        // index -> in-flight promise
    this.decoded = null;             // where a stateful decoder currently sits
    this.rung = null;                // chosen rendition, or null for the default
    this.resident = false;           // whole clip downloaded and held?
    this.abandoned = false;          // pane moved on; stop fetching
    this._packing = null;            // in-flight container download, if any
    //: Bytes this pane may hold. A Gaussian frame decodes to roughly 50 bytes
    //: a Gaussian, so 200 MB is about sixty frames of this content -- enough
    //: for a short clip, and short of what would take the tab down.
    this.byteBudget = 200e6;
    this.stats = { decodes: 0, bytes: 0, hits: 0, misses: 0, replays: 0,
                   // Milliseconds, exponentially smoothed, and kept apart:
                   // fetch and decode fail for different reasons and have
                   // different fixes -- a slow fetch is the link, a slow decode
                   // is this machine -- so one readout for both would send a
                   // reader to the wrong place.
                   fetchMs: 0, decodeMs: 0 };
  }

  get length() { return this.clip.frames.length; }

  /* The frame list in force. Every rendition shares the clip's timeline -- the
   * manifest refuses one that does not -- so an index means the same instant
   * whichever rung is playing, and switching mid-clip cannot jump in time. */
  get frames() {
    return this.rung && this.rung.frames ? this.rung.frames : this.clip.frames;
  }

  /* Move to a different rendition.
   *
   * Cached frames are *kept*. They hold the same content at a different
   * quality, so a frame already decoded is still the right picture for its
   * index; dropping the cache would re-fetch what is already in hand and stall
   * playback at exactly the moment the link is under pressure. The new rung
   * applies to frames not yet fetched, which is where it can still help.
   */
  /* The container this clip is packed into, or null if its frames are
   * separate files. Mirrors `frames`: a rung that ships its own container uses
   * that one, and a rung with its own frame list but no container falls back to
   * fetching them singly rather than reading the *base* clip's container --
   * which holds the right frames at the wrong quality. */
  get sequence() {
    if (this.rung && this.rung.sequence) return this.rung.sequence;
    if (this.rung && this.rung.frames) return null;
    return this.clip.sequence || null;
  }

  useRung(rung) {
    const before = this.rung ? this.rung.name : null;
    const after = rung ? rung.name : null;
    if (before === after) return false;
    this.rung = rung;
    this.stats.switches = (this.stats.switches || 0) + 1;
    return true;
  }

  /* A decoded frame may hold a resource the browser will not reclaim on its own
   * -- an image decoded from a blob keeps that blob alive through its object
   * URL. Evicting the frame has to let it go, or a long scrub leaks every frame
   * it ever showed, which is the bug the old unbounded image cache had in a
   * different form. */
  static release(value) {
    if (value && value.objectUrl) {
      URL.revokeObjectURL(value.objectUrl);
      value.objectUrl = null;
    }
  }

  _touch(index, value) {
    // Nothing is cached after the pane has gone. A decode already in flight
    // when `release` ran resolves afterwards and would re-populate a cache
    // that was just cleared -- and for an image frame that also strands a blob
    // URL, because the revoke pass has already been and gone. Guarded here
    // rather than at each call site: this is the only way into the cache.
    if (this.abandoned) {
      Scheduler.release(value);
      return;
    }
    // Insertion-ordered Map as an LRU: re-inserting moves a key to the end, so
    // the oldest is always the first key.
    this.cache.delete(index);
    this.cache.set(index, value);
    while (this.cache.size > this.cacheSize) {
      const oldest = this.cache.keys().next().value;
      Scheduler.release(this.cache.get(oldest));
      this.cache.delete(oldest);
    }
  }

  /* Drop everything, releasing each frame. Called when a pane changes clip or
   * goes away: the scheduler is replaced, and whatever it still held would
   * otherwise never be reclaimed. */
  release() {
    this.abandoned = true;
    this.resident = false;
    for (const value of this.cache.values()) Scheduler.release(value);
    this.cache.clear();
    this.pending.clear();
  }

  async _decodeOne(index) {
    if (this.cache.has(index)) return this.cache.get(index);
    if (this.pending.has(index)) return this.pending.get(index);
    const url = this.root + this.frames[index];
    const began = performance.now();
    const task = fetch(url).then(async (response) => {
      if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
      const buffer = await response.arrayBuffer();
      // Timed to the last byte, and reported before decoding: the decode is
      // this machine's problem, and folding it in would make a slow GPU look
      // like a slow link -- which is the error that then picks a lower rung
      // and does not help.
      if (this.meter) {
        this.meter.record(buffer.byteLength, (performance.now() - began) / 1000);
      }
      const fetched = performance.now();
      // The response's own Content-Type, which the server takes from the
      // representation registry -- so an image is decoded as the type it was
      // served as rather than by leaving a browser to sniff a typeless blob.
      const parsed = await this.decode(buffer, url, response.headers
        ? response.headers.get("Content-Type") : null);
      this.pending.delete(index);
      this.stats.decodes += 1;
      this.stats.bytes += buffer.byteLength;
      const smooth = (was, now) => (was ? was + 0.25 * (now - was) : now);
      this.stats.fetchMs = smooth(this.stats.fetchMs, fetched - began);
      this.stats.decodeMs = smooth(this.stats.decodeMs, performance.now() - fetched);
      this._touch(index, parsed);
      return parsed;
    }).catch((error) => { this.pending.delete(index); throw error; });
    this.pending.set(index, task);
    return task;
  }

  /* The frame at `index`, decoding whatever has to come first. */
  async seek(index) {
    if (this.cache.has(index)) {
      this.stats.hits += 1;
      const value = this.cache.get(index);
      this._touch(index, value);
      return value;
    }
    this.stats.misses += 1;
    // A packed clip has no per-frame files to fetch: packing deletes them, so
    // the container is the only place the frame exists. Held as one promise so
    // a pane that starts playing before the download was asked for joins the
    // one in flight rather than starting a second copy of a 63 MB transfer.
    if (this.sequence) {
      if (!this._packing) {
        this._packing = this.downloadAll(null)
          .finally(() => { this._packing = null; });
      }
      await this._packing;
      if (this.cache.has(index)) {
        const value = this.cache.get(index);
        this._touch(index, value);
        return value;
      }
      // Only reachable when the container was refused as too big to hold. The
      // frame files may still be there -- packing can keep them -- so fall
      // through and ask for one, which either works or 404s honestly.
    }
    const plan = chain(this.dependency, index, this.decoded);
    if (plan.length > 1) this.stats.replays += 1;
    let last = this.cache.get(index);
    for (const step of plan) {
      last = await this._decodeOne(step);
      if (this.dependency.mode !== "independent") this.decoded = step;
    }
    return last;
  }

  /* Fetch the whole clip, reporting progress, and keep it.
   *
   * This is the on-demand shape, and it is the right one for a free camera.
   * A streaming player fetches a few frames ahead and throws them away behind
   * the playhead, because it only ever needs the frame it is showing. A viewer
   * that can be spun around needs the frame's *geometry* resident to redraw it
   * from a new angle -- so the frame has to stay, and if it has to stay there
   * is no reason to have fetched it late.
   *
   * So: download, then play from memory. Playback after the first pass is
   * exact -- no fetch in the loop, no stall, and the camera is free the whole
   * time. What was a bandwidth problem becomes a wait at the start, which is a
   * thing a person understands and a progress bar can show.
   *
   * Bounded by bytes, not frames. Thirty Gaussian frames decode to about
   * 100 MB and four panes of that is most of a tab's budget, so a clip too big
   * to hold falls back to the sliding window it had before rather than
   * exhausting memory and taking the page down with it.
   */
  async downloadAll(onProgress) {
    const total = this.length;
    if (!total) return true;
    // Already held. Worth checking since this is called again whenever the pane
    // set changes -- and re-entering it would re-fetch a 63 MB container that
    // is sitting in memory, which is what following the camera onto a ring
    // station started doing.
    if (this.resident) {
      if (onProgress) onProgress(total, total, this.stats.bytes, true);
      return true;
    }
    const packed = this.sequence;
    if (packed) return this._downloadPacked(packed, onProgress);
    const budget = this.byteBudget;
    let bytes = 0;
    this.cacheSize = Math.max(this.cacheSize, total);
    for (let index = 0; index < total; index++) {
      if (this.abandoned) return false;
      await this._decodeOne(index);
      bytes = this.stats.bytes;
      if (bytes > budget) {
        // Too big to hold. Shrink back to a window and let playback stream it.
        this.cacheSize = 6;
        this.resident = false;
        if (onProgress) onProgress(index + 1, total, bytes, false);
        return false;
      }
      if (onProgress) onProgress(index + 1, total, bytes, true);
    }
    this.resident = true;
    return true;
  }

  /* Fetch a clip packed as one file, then decode it out of memory.
   *
   * The same outcome as the loop above and a different transfer: one request
   * rather than one per frame. Over a link that is the whole difference --
   * thirty frames is thirty round trips, and a 20 ms connection spends 600 ms
   * of pure latency before the first pixel. On loopback it changes nothing,
   * which is exactly why the per-frame path looked fine for so long.
   *
   * Progress is reported in two phases: estimated from bytes while the
   * container arrives, then exactly per frame as it is decoded. A reader sees
   * one number that climbs and cannot tell where the phases meet, which is
   * what they want; a bar pinned at zero through a 63 MB transfer is not.
   */
  async _downloadPacked(packed, onProgress) {
    const total = this.length;
    const url = this.root + packed.url;
    const expected = packed.bytes || 0;
    if (expected > this.byteBudget) {
      // Refused from the manifest, before a byte is fetched. The per-frame
      // path can only notice once it is already over budget, having paid for
      // the frames that took it there.
      this.cacheSize = 6;
      this.resident = false;
      if (onProgress) onProgress(0, total, 0, false);
      return false;
    }
    // Raised to fit before anything is decoded. A clip held under a smaller
    // cache evicts the frames it just decoded, and the next seek has nowhere to
    // go but back to the container -- so a "resident" clip would re-download
    // itself once per frame, which is how this was found.
    this.cacheSize = Math.max(this.cacheSize, total);
    const began = performance.now();
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
    const buffer = await this._readPacked(response, expected, total, onProgress);
    if (!buffer) return false;                  // pane moved on mid-transfer
    // One rate sample for the whole container, which beats any the per-frame
    // path took: a transfer this long has left slow start behind, so it
    // measures the link rather than the ramp onto it.
    if (this.meter) {
      this.meter.record(buffer.byteLength, (performance.now() - began) / 1000);
    }
    const fetched = performance.now();
    this.stats.bytes += buffer.byteLength;
    const header = readSequenceHeader(buffer);
    if (header.entries.length !== total) {
      throw new Error(`${url}: holds ${header.entries.length} frames,`
        + ` clip lists ${total}`);
    }
    // The frame list survives packing, and this is one reason it has to: a
    // frame is decoded by the codec its *own* name selects. Handing the
    // container's name to the decode instead is a `.seq` suffix in a table of
    // `.ply` and `.splat`, which is how every Gaussian pane went blank -- and
    // silently, because pixels are decoded from the media type on the main
    // thread and were unaffected, so it looked like one method being broken
    // rather than one code path.
    const names = this.frames;
    if (suffixOf(names[0]) !== `.${header.suffix}`) {
      throw new Error(`${url}: holds .${header.suffix} frames, clip lists`
        + ` ${suffixOf(names[0])} -- one of them would be decoded wrongly`);
    }
    // From the manifest, not a response header: the container is served as
    // octet-stream because the frames inside it are what have a type.
    const mediaType = packed.media_type || null;
    for (let index = 0; index < total; index++) {
      if (this.abandoned) return false;
      const frame = sequenceFrame(buffer, header, index);
      this._touch(index, await this.decode(frame, this.root + names[index],
                                           mediaType));
      this.stats.decodes += 1;
      if (onProgress) onProgress(index + 1, total, this.stats.bytes, true);
    }
    this.stats.fetchMs = fetched - began;
    this.stats.decodeMs = (performance.now() - fetched) / total;
    this.resident = true;
    return true;
  }

  /* The container's bytes, reporting progress as they arrive.
   *
   * Read through the body stream rather than `arrayBuffer()` so there is
   * something to report at all: `arrayBuffer()` resolves once, at the end, and
   * a single-request download would otherwise show no progress whatsoever --
   * strictly worse to watch than the thirty requests it replaces. Falls back to
   * `arrayBuffer()` where there is no stream to read, which is what the test
   * doubles give it.
   */
  async _readPacked(response, expected, total, onProgress) {
    if (!response.body || !response.body.getReader) {
      return response.arrayBuffer();
    }
    const reader = response.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (this.abandoned) { reader.cancel().catch(() => {}); return null; }
      chunks.push(value);
      got += value.byteLength;
      if (onProgress && expected) {
        // Bytes shown as frames, because frames are the unit the caller counts
        // and the two phases have to share one scale to make a bar that only
        // ever goes forward. Never the last frame: that one is claimed by the
        // decode loop, so a download at 100% cannot look finished while the
        // frames it holds are still being parsed.
        const reached = Math.min(total - 1, Math.floor((got / expected) * total));
        onProgress(reached, total, got, true);
      }
    }
    const buffer = new Uint8Array(got);
    let at = 0;
    for (const chunk of chunks) { buffer.set(chunk, at); at += chunk.byteLength; }
    return buffer.buffer;
  }

  /* Look ahead along the direction playback actually moves. Only the frames a
   * forward step would need are fetched, which for a dependent clip is the next
   * few in the chain rather than an arbitrary window. */
  prefetch(index) {
    for (let ahead = 1; ahead <= this.lookAhead; ahead++) {
      const next = (index + ahead) % this.length;
      if (this.cache.has(next) || this.pending.has(next)) continue;
      if (this.dependency.mode === "independent") {
        this._decodeOne(next).catch(() => {});
      } else if (next === index + ahead) {
        // Not across the loop point: restarting a dependent stream to prefetch
        // frame 0 would evict the frames being played to get there.
        this._decodeOne(next).catch(() => {});
      }
    }
  }

  snapshot() {
    return {
      ...this.stats,
      cached: this.cache.size,
      pending: this.pending.size,
      mode: this.dependency.mode,
      rung: this.rung ? this.rung.name : "default",
      frozen: !!this.frozen,
    };
  }
}

/* The decoders a Scheduler drives turn bytes into something a renderer takes
 * and nothing else: no caching, no look-ahead, no idea what frame it is. That
 * all moved to the Scheduler, so the paths share one policy instead of
 * disagreeing about it.
 *
 * A parsed geometry frame is roughly 50 bytes a Gaussian, so a handful is tens
 * of megabytes and the whole sequence is not -- hence the small cache each
 * representation asks for rather than an unbounded one. */


/* Pixels arrive as an <img> rather than an array, because that is what the
 * surface takes. Decoded through a blob URL so the fetch, and therefore the
 * byte count and the cache, work the same way as every other representation --
 * setting `img.src` to the frame URL would put the transfer somewhere the
 * scheduler cannot see. */
function decodeImage(buffer, url, mediaType) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([buffer], mediaType ? { type: mediaType } : undefined);
    const objectUrl = URL.createObjectURL(blob);
    const image = new Image();
    // The URL stays alive for as long as this frame is cached, and is revoked
    // when the Scheduler evicts it (see `release`). Revoking it here on load
    // looks tidy and is wrong: a decoded frame's `src` is what a pane assigns to
    // its own <img>, so a revoked URL leaves the pane showing nothing at all --
    // silently, because assigning a dead blob URL is not an error.
    image.objectUrl = objectUrl;
    image.onload = () => resolve(image);
    image.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error(`could not decode ${url}`));
    };
    image.src = objectUrl;
  });
}

/* ------------------------------------------------------------------ panes ---
 * One pane per method. A pane owns whichever surface its clip needs -- a WebGL
 * canvas with its own renderer for splats, an <img> for a rendered or captured
 * sequence -- and is told what to show; it never decides what to compare with
 * what. Separate contexts rather than one canvas with scissored viewports
 * because half the panes are not canvases at all.
 */
class Pane {
  constructor(method) {
    this.method = method;
    this.host = document.createElement("div");
    this.host.className = "pane";
    this.label = document.createElement("div");
    this.label.className = "label";
    this.label.textContent = method;
    this.host.appendChild(this.label);
    this.clip = null;
    this.source = null;
    this.renderer = null;
    this.rendererKind = null;
    this.gl = null;
    this.canvas = null;
    this.image = null;
    this.loaded = -1;
    this.sortKey = "";
  }

  /* Why this pane is empty, on the pane itself.
   *
   * On the pane and not in the sidebar: a reader looking at four panes and one
   * blank needs the reason where the blank is. `headline` is the fact,
   * `remedy` is what to do -- separated because for a live stream the remedy
   * is on another machine, and a reader who cannot act on it should at least
   * not think the page is broken. */
  _explain(headline, remedy) {
    if (this.missing) this.missing.remove();
    this.missing = document.createElement("div");
    this.missing.className = "missing";
    const strong = document.createElement("div");
    strong.className = "why";
    strong.textContent = headline;
    const rest = document.createElement("div");
    rest.textContent = remedy;
    this.missing.append(strong, rest);
    this.host.appendChild(this.missing);
  }

  _surface(which, makeRenderer) {
    if (which === "canvas" && !this.canvas) {
      this.canvas = document.createElement("canvas");
      this.host.appendChild(this.canvas);
      const gl = this.canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: true });
      if (!gl) throw new Error("WebGL2 unavailable");
      this.gl = gl;
    }
    // The renderer is per representation, and a pane's representation changes
    // when its clip does -- so it is rebuilt when the kind of renderer needed
    // changes, on the one canvas rather than a new context per switch.
    if (which === "canvas" && makeRenderer && this.rendererKind !== makeRenderer.kind) {
      this.renderer = makeRenderer(this.gl);
      this.rendererKind = makeRenderer.kind;
    }
    if (which === "image" && !this.image) {
      this.image = document.createElement("img");
      this.image.alt = "";
      this.host.appendChild(this.image);
    }
    if (this.canvas) this.canvas.hidden = which !== "canvas";
    if (this.image) this.image.hidden = which !== "image";
  }

  setClip(clip) {
    if (this.source && this.source.release) this.source.release();
    this.clip = clip;
    this.loaded = -1;
    this.sortKey = "";
    if (this.missing) { this.missing.remove(); this.missing = null; }
    if (!clip) {
      if (this.canvas) this.canvas.hidden = true;
      if (this.image) this.image.hidden = true;
      this.source = null;
      // Otherwise the label keeps naming the camera of the clip that was here
      // before, which is the one thing a pane saying "nothing here" must not do.
      this.label.textContent = this.method;
      this._explain(
        `${this.method} has nothing at this camera.`,
        "Only a representation with geometry can be rendered anywhere; "
        + "pre-rendered pixels exist only where they were made.");
      return;
    }
    const kind = spec(clip);
    if (isLive(clip)) {
      // No scheduler: the browser owns the connection, and multipart replacement
      // is a browser feature. Set once -- reassigning src restarts the stream.
      this._surface("image", null);
      this.source = null;
      /* A live pane depends on a renderer this page does not control, and those
       * die: the box reboots, the process is killed, the GPU is wanted for
       * something else. When that happens the proxy answers 502 and an <img>
       * shows nothing at all -- so the subject looked simply absent, with the
       * page insisting everything was fine. Say what is wrong and what would
       * fix it, because the fix is on another machine. */
      this.image.onerror = () => {
        if (this.clip !== clip) return;        // a later clip owns this pane now
        this._explain(
          `${this.method} is a live stream and its renderer is not answering.`,
          `The bundle proxies ${(clip.detail && clip.detail.upstream)
            || clip.stream.url} — start that renderer and reload.`);
      };
      this.image.onload = () => {
        if (this.clip === clip && this.missing) {
          this.missing.remove();
          this.missing = null;
        }
      };
      this.image.src = clip.stream.url;
      this.loaded = 0;
      // Through the same labeller as every other pane, so there is one place
      // that decides how a pane names what it holds.
      this.label.textContent = `${this.method} · ${describeSource(clip)}`;
      return;
    }
    const make = kind.renderer;
    if (make) make.kind = clip.representation;
    this._surface(kind.surface, make);
    this.source = new Scheduler(clip, "./", kind.decode, {
      cacheSize: kind.cacheSize, meter,
    });
    this.label.textContent = `${this.method} · ${describeSource(clip)}`;
  }

  /* A canvas dropped from the DOM keeps its WebGL context until the browser
   * decides otherwise, and browsers cap how many exist at once -- so a pane
   * that goes away has to say so, or a few method changes silently exhaust the
   * budget and the surviving canvases start losing their contexts. */
  dispose() {
    if (this.source && this.source.release) this.source.release();
    this.source = null;
    if (this.gl) {
      const lose = this.gl.getExtension("WEBGL_lose_context");
      if (lose) lose.loseContext();
    }
    this.renderer = null;
    this.gl = null;
    this.host.remove();
  }

  get length() { return this.source ? this.source.length : 0; }

  async show(frame) {
    if (isLive(this.clip)) return;   // the stream advances itself
    if (!this.source) return;
    const index = Math.min(frame, this.source.length - 1);
    // seek, not fetch: for a clip that declares a dependency this decodes
    // whatever has to come first, in order.
    const decoded = await this.source.seek(index);
    if (isPixels(this.clip)) {
      this.image.src = decoded.src;
    } else {
      this.renderer.upload(decoded);
      this.sortKey = "";
    }
    this.loaded = index;
    this.source.prefetch(index);
  }

  /* Largest rect of the given aspect centred in the canvas, in device pixels.
   * Compare mode letterboxes splats to the rig's aspect so a rendered pane and
   * a captured pane frame the subject identically -- without it the two are
   * cropped differently and every visual difference is suspect. */
  static fit(width, height, aspect) {
    if (!aspect) return [0, 0, width, height];
    let w = width, h = Math.round(width / aspect);
    if (h > height) { h = height; w = Math.round(height * aspect); }
    return [Math.round((width - w) / 2), Math.round((height - h) / 2), w, h];
  }

  draw(basisFor, aspect) {
    if (!this.renderer || !this.canvas || this.canvas.hidden || this.loaded < 0) return;
    const rect = this.canvas.getBoundingClientRect();
    const scale = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(rect.width * scale));
    const height = Math.max(1, Math.round(rect.height * scale));
    if (this.canvas.width !== width || this.canvas.height !== height) {
      this.canvas.width = width;
      this.canvas.height = height;
      this.sortKey = "";
    }
    const box = Pane.fit(width, height, aspect);
    const camera = basisFor([box[2], box[3]]);
    const key = `${this.loaded}|${camera.eye.map((v) => v.toFixed(4))}`
              + `|${camera.forward.map((v) => v.toFixed(4))}|${box.join(",")}`;
    if (key !== this.sortKey) {
      this.renderer.sort(camera.eye, camera.forward);
      this.sortKey = key;
    }
    this.renderer.draw(camera, box, [width, height]);
  }
}

/* ---------------------------------------------------------------- session --- */
const app = {
  index: null, scenes: {}, scene: null, mode: "explore", frame: 0, station: 0,
  methods: [], panes: [], playing: false, lastAdvance: 0, advancing: false,
  fps: 30, wipe: false,
  // Adapt to the measured link by default. A bundle whose clips have one
  // rendition each is unaffected, so this costs nothing where there is no
  // ladder -- and where there is one, the default should be the behaviour the
  // ladder was built for.
  adapt: true, decision: null,
  // On demand: the client takes a copy of prepared content and plays it from
  // memory. `downloadToken` invalidates a download in flight when the
  // selection changes, so a slow clip cannot finish into a pane that has since
  // moved on.
  download: null, downloadToken: 0,
  // Seconds of decoded playback to aim to keep ahead. Small, because a pane
  // caches a handful of frames rather than seconds of them: the cache is the
  // buffer, and a Gaussian frame is megabytes.
  targetBuffer: 0.15,
};

function setStatus(text) { statusEl.textContent = text; statusEl.hidden = false; }

/* Clips carry `scene` and `method`; a bundle written before they did, or one
 * holding something with no subject, is folded into a single pseudo-scene so
 * one code path covers both rather than two that drift. */
function normalise(index) {
  const unplayable = new Set();
  for (const clip of index.clips) {
    if (!clip.scene) clip.scene = "(ungrouped)";
    if (!clip.method) clip.method = clip.name;
    if (!clip.representation) clip.representation = LEGACY_KINDS[clip.kind] || clip.kind;
    if (!playable(clip)) unplayable.add(clip.representation);
  }
  // Named rather than silently dropped: "nothing appeared" is indistinguishable
  // from a broken bundle, and the fix (a renderer for that representation) is
  // not something a user can guess at.
  if (unplayable.size) {
    console.warn(
      `no renderer for representation(s): ${[...unplayable].join(", ")}; `
      + "those clips are hidden");
  }
  index.clips = index.clips.filter(playable);
  return index;
}

function scenesInBundle() {
  const seen = [];
  for (const clip of app.index.clips) if (!seen.includes(clip.scene)) seen.push(clip.scene);
  return seen;
}

/* Every method for a scene, and whether this mode can show it.
 *
 * Listed rather than filtered. Explore is a free camera and a photograph has

# Pins pytest's rootdir inside this module, for the same reason the Vega and NeVo
# baselines do: without it pytest finds Open4D's root pyproject.toml, resolves
# this suite's package name upward through open4d/, and applies addopts and a
# strict marker list this tree never declared.
[pytest]
testpaths = gs_tools_tests
markers =
    cpu: needs no GPU

# Pins pytest's rootdir inside this baseline. Without it, pytest finds Open4D's
# root pyproject.toml instead, resolves this suite's package name upward through
# open4d/, and imports the Open4D package -- which needs Python 3.10+ and fails
# here on the baseline's own interpreter. It also keeps Open4D's addopts and
# strict marker list from applying to a tree that never declared them.
[pytest]
testpaths = vega_tests

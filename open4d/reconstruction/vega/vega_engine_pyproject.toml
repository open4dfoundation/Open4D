[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vega"
version = "0.1.0"
description = "Research prototype implementing the encoding + rendering-pipeline algorithms from the Vega MobiCom'25 paper"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["vega*"]

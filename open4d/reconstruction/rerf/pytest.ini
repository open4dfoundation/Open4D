# Pins pytest's rootdir inside this baseline. Without it, pytest finds Open4D's
# root pyproject.toml, resolves this suite's package name upward through
# open4d/, and imports the Open4D package -- which needs Python 3.10+ and fails
# on the Python 3.8 interpreter ReRF's entropy coder requires.
[pytest]
testpaths = rerf_stream_tests

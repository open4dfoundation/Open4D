<!doctype html>
<meta charset="utf-8">
<title>gs-tools view</title>
<!--
  The viewer `gs-tools view` serves. One page, no build step and no CDN: it is
  handed a `view.json` bundle (see gs_tools/io/bundle.py) and plays whichever
  representations it finds a renderer for -- see REPRESENTATIONS below, which
  mirrors `open4d.core.Representation`. Today that is 3DGS Gaussians under a
  free camera and pre-rendered pixels for anything that cannot be decoded here
  at all. Gaussian frames arrive as 3DGS PLY or as quantised `.splat`; both
  parse to one shape, so nothing below the parsers knows which it got.

  It has two modes, and the split is not cosmetic -- it is the boundary of what
  can honestly be compared:

  Explore   Free camera, Gaussian methods only, several at once in synced panes.
            Every pane shares one orbit camera, so the geometry differences are
            the only differences. A method that ships no Gaussians cannot appear
            here at all, which is the point: there is nothing to aim a free
            camera at.

  Compare   One camera path -- the scene's own capture rig, read from the corpus
            by gs_tools/cameras.py -- with camera and time scrubbed
            independently. Gaussian methods are rendered at the selected rig
            pose; image methods show what was rendered or captured there. This
            is the mode a volumetric method and a photograph can join, and the
            one where a difference between panes means something numeric.

  The splat path is a WebGL2 EWA splatter. Per Gaussian it builds the world 3D
  covariance on the CPU, projects it to a 2D covariance per frame on the GPU,
  and draws a 3-sigma quad in the covariance's own eigenbasis, so a fragment at
  quad coordinate c has alpha = opacity * exp(-|c|^2/2) with no further algebra.
  Gaussians are depth-sorted far-to-near on the CPU (a counting sort over 16-bit
  depth buckets) and blended premultiplied-over, which is what makes the result
  match a real 3DGS render rather than approximate it. Checked against
  diff_gaussian_rasterization at 62 dB PSNR.
-->
<style>
  :root { color-scheme: dark; --panel: #16181d; --edge: #2c313a; --text: #e6e8ec;
          --dim: #9aa3b2; --accent: #6ea8fe; --bg: #0b0c0f; --wipe: 50%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  [hidden] { display: none !important; }
  #app { display: flex; height: 100%; }
  #stage { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #panes { flex: 1; min-height: 0; display: grid; gap: 2px; background: var(--edge); position: relative; }
  #panes.wipe { display: block; }
  .pane { position: relative; background: var(--bg); overflow: hidden; min-width: 0; }
  #panes.wipe .pane { position: absolute; inset: 0; }
  #panes.wipe .pane:nth-child(2) { clip-path: inset(0 0 0 var(--wipe)); }
  .pane canvas, .pane img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pane img { object-fit: contain; }
  .pane .label { position: absolute; top: 8px; left: 10px; z-index: 2; font-size: 11px;
                 letter-spacing: .06em; text-transform: uppercase; color: var(--text);
                 background: #0b0c0fbb; padding: 2px 7px; border-radius: 4px; }
  .pane .missing { position: absolute; inset: 0; display: grid; place-content: center;
                   text-align: center; padding: 24px; color: var(--dim); font-size: 12px; }
  #wipeHandle { position: absolute; top: 0; bottom: 0; left: var(--wipe); width: 2px;
                background: var(--accent); cursor: ew-resize; z-index: 3; }
  #wipeHandle::after { content: ""; position: absolute; top: 50%; left: -9px; width: 20px;
                       height: 20px; margin-top: -10px; border-radius: 50%;
                       background: var(--accent); box-shadow: 0 0 0 3px #0b0c0f88; }
  #side { width: 330px; flex: none; border-left: 1px solid var(--edge); background: var(--panel);
          padding: 14px 16px; overflow-y: auto; }
  /* Without a breakpoint a narrow window gave #side its full 330px and collapsed
     #stage to nothing -- and the stage is where the mode toggle, the scrubbers and
     the render itself live, so the viewer looked like a sidebar with no viewer in
     it. Below this width the two stack, stage first. */

    #app { flex-direction: column; }
    #stage { flex: 1 1 auto; min-height: 55vh; }
    #side { width: 100%; flex: 0 0 auto; max-height: 45vh;
            border-left: none; border-top: 1px solid var(--edge); }
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);

  select, button { font: inherit; color: var(--text); background: #21252c; border: 1px solid var(--edge);

  .seg button[aria-pressed="true"] { background: var(--accent); color: #08111f; border-color: var(--accent); }
  .methods label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }

  .scrubber { display: grid; grid-template-columns: 62px 1fr 66px; gap: 8px; align-items: center;

  .scrubber input { accent-color: var(--accent); }
  .scrubber .value { font-variant-numeric: tabular-nums; color: var(--dim); text-align: right; }
  #transport { border-top: 1px solid var(--edge); background: var(--panel); }

  ul { margin: 4px 0 0; padding-left: 18px; }

  kbd { background: #21252c; border: 1px solid var(--edge); border-radius: 4px; padding: 0 4px;
        font: 11px ui-monospace, monospace; }
</style>

<div id="app">
  <div id="stage">
    <div id="panes"></div>
    <div id="status">loading…</div>
    <div id="error"></div>
    <div id="transport">
      <div id="transportRow">
        <button id="playPause" title="Space">▶</button>
        <div class="seg" style="flex:1">
          <button id="modeExplore" aria-pressed="true">Explore — free camera</button>
          <button id="modeCompare" aria-pressed="false">Compare — rig camera</button>
        </div>

      </div>
      <div class="scrubber">
        <label for="scrubFrame">frame</label>
        <input id="scrubFrame" type="range" min="0" max="0" value="0" step="1">
        <span class="value" id="frameLabel">– / –</span>
      </div>
      <div class="scrubber" id="cameraRow">
        <label for="scrubCamera">camera</label>
        <input id="scrubCamera" type="range" min="0" max="0" value="0" step="1">
        <span class="value" id="cameraLabel">– / –</span>
      </div>
    </div>
  </div>
  <div id="side">
    <h1 id="title">gs-tools view</h1>
    <p class="sub" id="source"></p>
    <h2>scene</h2>
    <select id="sceneSelect"></select>
    <h2>methods</h2>
    <div class="methods" id="methodList"></div>
    <h2 id="notesHeading">notes</h2>
    <ul id="notes"></ul>
    <h2>stats</h2>
    <dl id="stats"></dl>
    <h2>controls</h2>
    <ul id="controlHelp"></ul>
  </div>
</div>

<script>
"use strict";

const SH_C0 = 0.28209479177387814;
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const panesEl = document.getElementById("panes");
const scrubFrame = document.getElementById("scrubFrame");
const scrubCamera = document.getElementById("scrubCamera");
const frameLabel = document.getElementById("frameLabel");
const cameraLabel = document.getElementById("cameraLabel");
const playPause = document.getElementById("playPause");
const sceneSelect = document.getElementById("sceneSelect");
const methodList = document.getElementById("methodList");
const cameraRow = document.getElementById("cameraRow");
const wipeToggle = document.getElementById("wipeToggle");

function fail(message) {
  errorEl.textContent = message;
  errorEl.style.display = "grid";
  statusEl.hidden = true;
}

/* ------------------------------------------------------------------ PLY ---
 * The 3DGS PLY: a binary_little_endian vertex element of float32 properties
 * named x y z, nx ny nz, f_dc_*, f_rest_*, opacity, scale_*, rot_*. Values are
 * raw, so opacity is a logit, scale a log, and rot an unnormalised quaternion.
 * f_rest is ignored: a view-dependent band cannot be evaluated without knowing
 * the direction the exporter baked colour from, and the exports this viewer is
 * built for are degree 0 anyway.
 */
function parsePly(buffer) {
  const bytes = new Uint8Array(buffer);
  const limit = Math.min(bytes.length, 1 << 16);
  const head = new TextDecoder("ascii").decode(bytes.subarray(0, limit));
  const marker = head.indexOf("end_header");
  if (marker < 0) throw new Error("not a PLY: no end_header in the first 64 KiB");
  const dataStart = head.indexOf("\n", marker) + 1;
  const lines = head.slice(0, marker).split("\n").map((line) => line.trim());

  if (!lines.some((line) => line.startsWith("format binary_little_endian"))) {
    throw new Error("only binary_little_endian PLY is supported");
  }
  let count = 0, inVertex = false;
  const names = [];
  for (const line of lines) {
    if (line.startsWith("element ")) {
      const parts = line.split(/\s+/);
      inVertex = parts[1] === "vertex";
      if (inVertex) count = parseInt(parts[2], 10);
    } else if (line.startsWith("property ") && inVertex) {
      names.push(line.split(/\s+/)[2]);
    }
  }
  if (!count) throw new Error("PLY declares no vertices");

  const stride = names.length;
  // Copied rather than viewed in place: the header length is whatever it is, so
  // `dataStart` is rarely a multiple of 4 and a Float32Array cannot be created
  // at an unaligned offset.
  const table = new Float32Array(buffer.slice(dataStart, dataStart + count * stride * 4));
  const at = {};
  names.forEach((name, index) => { at[name] = index; });
  for (const need of ["x", "y", "z", "opacity", "scale_0", "rot_0", "f_dc_0"]) {
    if (at[need] === undefined) throw new Error(`PLY is missing property ${need}`);
  }

  // Three RGBA32F texels per Gaussian: (xyz, opacity), (c00 c01 c02 c11),
  // (c12 c22 _ _). Colour rides in a separate RGBA8 texture so neither has to
  // be bit-packed.
  const data = new Float32Array(count * 12);
  const colors = new Uint8Array(count * 4);
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const row = i * stride;
    const px = table[row + at.x], py = table[row + at.y], pz = table[row + at.z];
    positions[i * 3] = px; positions[i * 3 + 1] = py; positions[i * 3 + 2] = pz;

    const sx = Math.exp(table[row + at.scale_0]);
    const sy = Math.exp(table[row + at.scale_1]);
    const sz = Math.exp(table[row + at.scale_2]);

    let qw = table[row + at.rot_0], qx = table[row + at.rot_1];
    let qy = table[row + at.rot_2], qz = table[row + at.rot_3];
    const norm = Math.hypot(qw, qx, qy, qz) || 1;
    qw /= norm; qx /= norm; qy /= norm; qz /= norm;

    // 3DGS's build_rotation, with (w, x, y, z) as stored.
    const r00 = 1 - 2 * (qy * qy + qz * qz), r01 = 2 * (qx * qy - qw * qz), r02 = 2 * (qx * qz + qw * qy);
    const r10 = 2 * (qx * qy + qw * qz), r11 = 1 - 2 * (qx * qx + qz * qz), r12 = 2 * (qy * qz - qw * qx);
    const r20 = 2 * (qx * qz - qw * qy), r21 = 2 * (qy * qz + qw * qx), r22 = 1 - 2 * (qx * qx + qy * qy);

    // Sigma = (R diag(s)) (R diag(s))^T, upper triangle only.
    const m00 = r00 * sx, m01 = r01 * sy, m02 = r02 * sz;
    const m10 = r10 * sx, m11 = r11 * sy, m12 = r12 * sz;
    const m20 = r20 * sx, m21 = r21 * sy, m22 = r22 * sz;

    const base = i * 12;
    data[base] = px; data[base + 1] = py; data[base + 2] = pz;
    data[base + 3] = 1 / (1 + Math.exp(-table[row + at.opacity]));
    data[base + 4] = m00 * m00 + m01 * m01 + m02 * m02;
    data[base + 5] = m00 * m10 + m01 * m11 + m02 * m12;
    data[base + 6] = m00 * m20 + m01 * m21 + m02 * m22;
    data[base + 7] = m10 * m10 + m11 * m11 + m12 * m12;
    data[base + 8] = m10 * m20 + m11 * m21 + m12 * m22;
    data[base + 9] = m20 * m20 + m21 * m21 + m22 * m22;

    for (let c = 0; c < 3; c++) {
      const value = 0.5 + SH_C0 * table[row + at["f_dc_" + c]];
      colors[i * 4 + c] = Math.max(0, Math.min(255, Math.round(value * 255)));
    }
    colors[i * 4 + 3] = 255;
  }
  return { count, data, colors, positions };
}

/* --------------------------------------------------------------- shaders --- */
const VERTEX_SHADER = `#version 300 es
precision highp float;
precision highp int;

uniform sampler2D uData;      // RGBA32F, 3 texels per Gaussian
uniform sampler2D uColor;     // RGBA8, 1 texel per Gaussian
uniform int uDataWidth;
uniform int uColorWidth;
uniform vec3 uEye;
uniform vec3 uRight;
uniform vec3 uDown;
uniform vec3 uForward;
uniform vec2 uFocal;          // pixels
uniform vec2 uViewport;       // pixels

in vec2 aCorner;              // quad corner in [-3, 3], i.e. 3 sigma
in uint aIndex;               // Gaussian index, in far-to-near order

out vec2 vCorner;
out vec4 vColor;

vec4 fetchData(uint texel) {
  int index = int(texel);
  return texelFetch(uData, ivec2(index % uDataWidth, index / uDataWidth), 0);
}

void main() {
  uint base = aIndex * 3u;
  vec4 slot0 = fetchData(base);
  vec4 slot1 = fetchData(base + 1u);
  vec4 slot2 = fetchData(base + 2u);

  vec3 rel = slot0.xyz - uEye;
  vec3 cam = vec3(dot(rel, uRight), dot(rel, uDown), dot(rel, uForward));
  // Behind the camera, or so close that the projection Jacobian blows up.
  if (cam.z < 0.05) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }

  mat3 cov = mat3(
    vec3(slot1.x, slot1.y, slot1.z),
    vec3(slot1.y, slot1.w, slot2.x),
    vec3(slot1.z, slot2.x, slot2.y)
  );
  // Columns are the camera axes, so this maps camera -> world and its
  // transpose maps world -> camera.
  mat3 basis = mat3(uRight, uDown, uForward);
  mat3 worldToCam = transpose(basis);
  mat3 covCam = worldToCam * cov * basis;

  float inv = 1.0 / cam.z;
  mat3 jacobian = mat3(
    vec3(uFocal.x * inv, 0.0, 0.0),
    vec3(0.0, uFocal.y * inv, 0.0),
    vec3(-uFocal.x * cam.x * inv * inv, -uFocal.y * cam.y * inv * inv, 0.0)
  );
  mat3 projected = jacobian * covCam * transpose(jacobian);

  // The 0.3 px dilation is 3DGS's low-pass filter: without it a Gaussian
  // thinner than a pixel aliases into flicker as the camera moves.
  float a = projected[0][0] + 0.3;
  float b = projected[1][0];
  float c = projected[1][1] + 0.3;
  float mid = 0.5 * (a + c);
  float radius = sqrt(max(mid * mid - (a * c - b * b), 0.0));
  float major = mid + radius;
  float minor = mid - radius;
  if (minor <= 0.0) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }

  // Eigenvector for the major eigenvalue: (a - major) x + b y = 0.
  vec2 axis = abs(b) < 1e-12 ? (a >= c ? vec2(1.0, 0.0) : vec2(0.0, 1.0))
                             : normalize(vec2(b, major - a));
  vec2 majorAxis = min(sqrt(major), 512.0) * axis;
  vec2 minorAxis = min(sqrt(minor), 512.0) * vec2(-axis.y, axis.x);
  vec2 offsetPx = aCorner.x * majorAxis + aCorner.y * minorAxis;

  vec2 centrePx = vec2(uFocal.x * cam.x * inv, uFocal.y * cam.y * inv);
  // Image y runs down, NDC y runs up.
  vec2 toNdc = vec2(2.0 / uViewport.x, -2.0 / uViewport.y);
  gl_Position = vec4((centrePx + offsetPx) * toNdc, 0.0, 1.0);

  int ci = int(aIndex);
  vec4 rgb = texelFetch(uColor, ivec2(ci % uColorWidth, ci / uColorWidth), 0);
  vColor = vec4(rgb.rgb, slot0.w);
  vCorner = aCorner;
}
`;

const FRAGMENT_SHADER = `#version 300 es
precision highp float;
in vec2 vCorner;
in vec4 vColor;
out vec4 fragColor;
void main() {
  float squared = dot(vCorner, vCorner);
  if (squared > 9.0) discard;          // outside 3 sigma
  float alpha = vColor.a * exp(-0.5 * squared);
  if (alpha < 1.0 / 510.0) discard;
  fragColor = vec4(vColor.rgb * alpha, alpha);   // premultiplied
}
`;

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader) || "shader compile failed");
  }
  return shader;
}

/* -------------------------------------------------------------- renderer --- */
class SplatRenderer {
  constructor(gl) {
    this.gl = gl;
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, VERTEX_SHADER));
    gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, FRAGMENT_SHADER));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || "program link failed");
    }
    this.program = program;
    this.uniform = {};
    for (const name of ["uData", "uColor", "uDataWidth", "uColorWidth", "uEye",
                        "uRight", "uDown", "uForward", "uFocal", "uViewport"]) {
      this.uniform[name] = gl.getUniformLocation(program, name);
    }

    this.corners = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.corners);
    // Triangle strip over a 3-sigma square.
    gl.bufferData(gl.ARRAY_BUFFER,
      new Float32Array([-3, -3, 3, -3, -3, 3, 3, 3]), gl.STATIC_DRAW);

    this.indexBuffer = gl.createBuffer();
    this.dataTexture = this.makeTexture(gl.RGBA32F, gl.FLOAT);
    this.colorTexture = this.makeTexture(gl.RGBA8, gl.UNSIGNED_BYTE);
    this.width = 2048;
    this.count = 0;
    this.order = null;
    this.depths = null;
    this.buckets = new Uint32Array(65536);
    this.starts = new Uint32Array(65536);
  }

  makeTexture(internalFormat, type) {
    const gl = this.gl;
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    texture._internalFormat = internalFormat;
    texture._type = type;
    return texture;
  }

  upload(frame) {
    const gl = this.gl;
    this.count = frame.count;
    this.positions = frame.positions;

    const dataTexels = frame.count * 3;
    const dataRows = Math.ceil(dataTexels / this.width);
    const padded = new Float32Array(this.width * dataRows * 4);
    padded.set(frame.data);
    gl.bindTexture(gl.TEXTURE_2D, this.dataTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, this.width, dataRows, 0,
                  gl.RGBA, gl.FLOAT, padded);

    const colorRows = Math.ceil(frame.count / this.width);
    const paddedColors = new Uint8Array(this.width * colorRows * 4);
    paddedColors.set(frame.colors);
    gl.bindTexture(gl.TEXTURE_2D, this.colorTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, this.width, colorRows, 0,
                  gl.RGBA, gl.UNSIGNED_BYTE, paddedColors);

    if (!this.order || this.order.length < frame.count) {
      this.order = new Uint32Array(frame.count);
      this.depths = new Float32Array(frame.count);
    }
    this.sortedFor = null;
  }

  /* Far-to-near order, by a counting sort over 16-bit depth buckets.
   * A comparison sort of half a million floats per frame is the one thing that
   * would make playback stutter; bucketing is O(n) and the quantisation error
   * is below what a swapped pair of overlapping splats can show. */
  sort(eye, forward) {
    const n = this.count;
    const positions = this.positions;
    const depths = this.depths;
    let low = Infinity, high = -Infinity;
    for (let i = 0; i < n; i++) {
      const d = (positions[i * 3] - eye[0]) * forward[0]
              + (positions[i * 3 + 1] - eye[1]) * forward[1]
              + (positions[i * 3 + 2] - eye[2]) * forward[2];
      depths[i] = d;
      if (d < low) low = d;
      if (d > high) high = d;
    }
    const buckets = this.buckets.fill(0);
    const scale = high > low ? 65535 / (high - low) : 0;
    const key = new Uint16Array(n);
    for (let i = 0; i < n; i++) {
      // Negated, so bucket 0 is the farthest and the sort comes out back-to-front.
      const bucket = 65535 - ((depths[i] - low) * scale) | 0;
      key[i] = bucket < 0 ? 0 : bucket > 65535 ? 65535 : bucket;
      buckets[key[i]]++;
    }
    const starts = this.starts;
    let running = 0;
    for (let b = 0; b < 65536; b++) { starts[b] = running; running += buckets[b]; }
    const order = this.order;
    for (let i = 0; i < n; i++) order[starts[key[i]]++] = i;

    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.indexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, order.subarray(0, n), gl.DYNAMIC_DRAW);
  }

  /* `rect` is where in the canvas to draw, `canvasSize` the whole thing.
   * They differ in compare mode: the splat is letterboxed to the capture rig's
   * aspect so it frames the subject exactly as the captured image beside it
   * does, and a difference between the two panes is then a difference in the
   * reconstruction rather than in the crop. */
  draw(camera, rect, canvasSize) {
    const gl = this.gl;
    gl.viewport(0, 0, canvasSize[0], canvasSize[1]);
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(0.043, 0.047, 0.059, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    // The letterboxed region is cleared to black, because that is what the
    // corpus captured against and what an image pane beside this one shows.
    // Matching it is what lets a silhouette be judged rather than guessed at.
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(rect[0], rect[1], rect[2], rect[3]);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.SCISSOR_TEST);
    if (!this.count) return;
    gl.viewport(rect[0], rect[1], rect[2], rect[3]);

    gl.useProgram(this.program);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.dataTexture);
    gl.uniform1i(this.uniform.uData, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.colorTexture);
    gl.uniform1i(this.uniform.uColor, 1);
    gl.uniform1i(this.uniform.uDataWidth, this.width);
    gl.uniform1i(this.uniform.uColorWidth, this.width);
    gl.uniform3fv(this.uniform.uEye, camera.eye);
    gl.uniform3fv(this.uniform.uRight, camera.right);
    gl.uniform3fv(this.uniform.uDown, camera.down);
    gl.uniform3fv(this.uniform.uForward, camera.forward);
    gl.uniform2f(this.uniform.uFocal, camera.focal[0], camera.focal[1]);
    gl.uniform2f(this.uniform.uViewport, rect[2], rect[3]);

    const corner = gl.getAttribLocation(this.program, "aCorner");
    gl.bindBuffer(gl.ARRAY_BUFFER, this.corners);
    gl.enableVertexAttribArray(corner);
    gl.vertexAttribPointer(corner, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(corner, 0);

    const index = gl.getAttribLocation(this.program, "aIndex");
    gl.bindBuffer(gl.ARRAY_BUFFER, this.indexBuffer);
    gl.enableVertexAttribArray(index);
    gl.vertexAttribIPointer(index, 1, gl.UNSIGNED_INT, 0, 0);
    gl.vertexAttribDivisor(index, 1);

    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.count);
  }
}

/* ---------------------------------------------------------------- camera --- */
const WORLD_UP = [0, 1, 0];

function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function normalize(v) {
  const n = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / n, v[1] / n, v[2] / n];
}

class OrbitCamera {
  constructor() { this.fovY = 50 * Math.PI / 180; this.reset([0, 0, 0], 4); }

  reset(target, distance) {
    this.target = target.slice();
    this.distance = distance;
    this.home = { target: target.slice(), distance };
    this.yaw = 0;
    this.pitch = 12 * Math.PI / 180;
  }

  goHome() {
    this.target = this.home.target.slice();
    this.distance = this.home.distance;
    this.yaw = 0;
    this.pitch = 12 * Math.PI / 180;
  }

  /* Distance at which a sphere of `radius` about the target just fits.
   * Whichever of the two half-angles is narrower is the binding one, so a wide
   * scene in a tall window frames as well as a standing figure in a wide one. */
  fitDistance(radius, viewport) {
    const halfY = this.fovY / 2;
    const aspect = Math.max(viewport[0], 1) / Math.max(viewport[1], 1);
    const halfX = Math.atan(aspect * Math.tan(halfY));
    return (radius / Math.sin(Math.min(halfX, halfY))) * 1.05;
  }

  frame(viewport) {
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const eye = [
      this.target[0] + this.distance * Math.sin(this.yaw) * cp,
      this.target[1] + this.distance * sp,
      this.target[2] + this.distance * Math.cos(this.yaw) * cp,
    ];
    const forward = normalize([this.target[0] - eye[0], this.target[1] - eye[1], this.target[2] - eye[2]]);
    // right = forward x up, down = forward x right: an orthonormal (right, down,
    // forward) triple in which world +Y ends up as screen-up.
    const right = normalize(cross(forward, WORLD_UP));
    const down = normalize(cross(forward, right));
    const fy = 0.5 * viewport[1] / Math.tan(this.fovY / 2);
    return { eye, right, down, forward, focal: [fy, fy] };
  }
}

/* ------------------------------------------------------------------ clips --- */
/* One frame of `.splat`: 32 bytes per Gaussian, the quantised delivery form
 * (see gs_tools/io/splat.py for the byte layout and what it costs).
 *
 * The values are stored ALREADY ACTIVATED, unlike a PLY -- scales are
 * world-space standard deviations, opacity is in [0, 1], the quaternion is
 * unit. So this applies no exp, no sigmoid and no normalise, and the one bug to
 * watch for is doing so anyway: it renders as fog, exactly as writing activated
 * values into a PLY does. Returns the same shape parsePly does, so nothing
 * downstream can tell which format a frame arrived in. */
function parseSplat(buffer) {
  const SPLAT_BYTES = 32;
  if (buffer.byteLength % SPLAT_BYTES) {
    throw new Error(`not a .splat: ${buffer.byteLength} bytes is not a multiple of 32`);
  }
  const count = buffer.byteLength / SPLAT_BYTES;
  if (!count) throw new Error(".splat frame is empty");
  const bytes = new Uint8Array(buffer);
  // Copied, not viewed: byteOffset 0 is aligned here, but a Float32Array view
  // over the same buffer would still need a stride this layout does not have.
  const floats = new Float32Array(buffer);

  const data = new Float32Array(count * 12);
  const colors = new Uint8Array(count * 4);
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const f = i * 8;          // 8 float32 slots per record
    const b = i * SPLAT_BYTES;
    const px = floats[f], py = floats[f + 1], pz = floats[f + 2];
    positions[i * 3] = px; positions[i * 3 + 1] = py; positions[i * 3 + 2] = pz;

    const sx = floats[f + 3], sy = floats[f + 4], sz = floats[f + 5];

    // Renormalised: the quantisation is not symmetric, so q = 1 encodes as 256,
    // clamps to 255 and arrives as 0.992. Skipping this scales every Gaussian by
    // ~1.6% -- small enough to look fine and still be wrong.
    let qw = (bytes[b + 28] - 128) / 128;
    let qx = (bytes[b + 29] - 128) / 128;
    let qy = (bytes[b + 30] - 128) / 128;
    let qz = (bytes[b + 31] - 128) / 128;
    const norm = Math.hypot(qw, qx, qy, qz) || 1;
    qw /= norm; qx /= norm; qy /= norm; qz /= norm;

    const r00 = 1 - 2 * (qy * qy + qz * qz), r01 = 2 * (qx * qy - qw * qz), r02 = 2 * (qx * qz + qw * qy);
    const r10 = 2 * (qx * qy + qw * qz), r11 = 1 - 2 * (qx * qx + qz * qz), r12 = 2 * (qy * qz - qw * qx);
    const r20 = 2 * (qx * qz - qw * qy), r21 = 2 * (qy * qz + qw * qx), r22 = 1 - 2 * (qx * qx + qy * qy);

    const m00 = r00 * sx, m01 = r01 * sy, m02 = r02 * sz;
    const m10 = r10 * sx, m11 = r11 * sy, m12 = r12 * sz;
    const m20 = r20 * sx, m21 = r21 * sy, m22 = r22 * sz;

    const base = i * 12;
    data[base] = px; data[base + 1] = py; data[base + 2] = pz;
    data[base + 3] = bytes[b + 27] / 255;       // opacity, already activated
    data[base + 4] = m00 * m00 + m01 * m01 + m02 * m02;
    data[base + 5] = m00 * m10 + m01 * m11 + m02 * m12;
    data[base + 6] = m00 * m20 + m01 * m21 + m02 * m22;
    data[base + 7] = m10 * m10 + m11 * m11 + m12 * m12;
    data[base + 8] = m10 * m20 + m11 * m21 + m12 * m22;
    data[base + 9] = m20 * m20 + m21 * m21 + m22 * m22;

    colors[i * 4] = bytes[b + 24];              // RGB, not an SH coefficient
    colors[i * 4 + 1] = bytes[b + 25];
    colors[i * 4 + 2] = bytes[b + 26];
    colors[i * 4 + 3] = 255;
  }
  return { count, data, colors, positions };
}

/* A mesh or point-cloud frame, as `open4d.io.write_sequence` writes it: a
 * binary_little_endian PLY with a vertex element and, for a mesh, a face
 * element of `list uchar int vertex_indices`.
 *
 * A general-enough PLY reader rather than the fixed-stride one parsePly uses,
 * because these headers genuinely vary: colour is float in Open4D's canon (see
 * open4d.core.dtypes) but uchar in most files from elsewhere, and a face list
 * is variable-length, so neither element has a stride known up front.
 *
 * Normals are not read. Open4D's PLY writer refuses to store them, and the
 * renderer derives a face normal from screen-space derivatives instead, which
 * works for any mesh regardless of what its producer chose to carry. */
function parseMeshPly(buffer) {
  const bytes = new Uint8Array(buffer);
  const limit = Math.min(bytes.length, 1 << 16);
  const head = new TextDecoder("ascii").decode(bytes.subarray(0, limit));
  const marker = head.indexOf("end_header");
  if (marker < 0) throw new Error("not a PLY: no end_header in the first 64 KiB");
  const dataStart = head.indexOf("\n", marker) + 1;
  const lines = head.slice(0, marker).split("\n").map((line) => line.trim());
  if (!lines.some((line) => line.startsWith("format binary_little_endian"))) {
    throw new Error("only binary_little_endian PLY is supported");
  }

  const SIZES = { char: 1, int8: 1, uchar: 1, uint8: 1, short: 2, int16: 2,
                  ushort: 2, uint16: 2, int: 4, int32: 4, uint: 4, uint32: 4,
                  float: 4, float32: 4, double: 8, float64: 8 };
  const elements = [];
  for (const line of lines) {
    const parts = line.split(/\s+/);
    if (parts[0] === "element") {
      elements.push({ name: parts[1], count: parseInt(parts[2], 10), properties: [] });
    } else if (parts[0] === "property" && elements.length) {
      const element = elements[elements.length - 1];
      if (parts[1] === "list") {
        element.properties.push({ list: true, countType: parts[2], type: parts[3], name: parts[4] });
      } else {
        element.properties.push({ list: false, type: parts[1], name: parts[2] });
      }
    }
  }

  const view = new DataView(buffer);
  let offset = dataStart;
  const read = (type) => {
    switch (type) {
      case "char": case "int8": return view.getInt8(offset++);
      case "uchar": case "uint8": return view.getUint8(offset++);
      case "short": case "int16": { const v = view.getInt16(offset, true); offset += 2; return v; }
      case "ushort": case "uint16": { const v = view.getUint16(offset, true); offset += 2; return v; }
      case "int": case "int32": { const v = view.getInt32(offset, true); offset += 4; return v; }
      case "uint": case "uint32": { const v = view.getUint32(offset, true); offset += 4; return v; }
      case "float": case "float32": { const v = view.getFloat32(offset, true); offset += 4; return v; }
      case "double": case "float64": { const v = view.getFloat64(offset, true); offset += 8; return v; }
      default: throw new Error(`unsupported PLY property type ${type}`);
    }
  };

  let count = 0;
  let positions = null, colors = null;
  const faces = [];

  for (const element of elements) {
    if (element.name === "vertex") {
      count = element.count;
      const names = element.properties.map((property) => property.name);
      if (!["x", "y", "z"].every((need) => names.includes(need))) {
        throw new Error("PLY vertex element has no x/y/z");
      }
      // Colour is float in [0, 1] when Open4D wrote it and uchar in [0, 255]
      // when most other tools did; the property type says which.
      const colourNames = names.includes("red") ? ["red", "green", "blue"]
                        : names.includes("r") ? ["r", "g", "b"] : null;
      const colourType = colourNames
        ? element.properties.find((property) => property.name === colourNames[0]).type
        : null;
      const byteScale = colourType && SIZES[colourType] === 1 ? 1 : 255;
      positions = new Float32Array(count * 3);
      if (colourNames) colors = new Uint8Array(count * 4);
      for (let i = 0; i < count; i++) {
        const row = {};
        for (const property of element.properties) {
          if (property.list) {
            const n = read(property.countType);
            for (let k = 0; k < n; k++) read(property.type);
          } else {
            row[property.name] = read(property.type);
          }
        }
        positions[i * 3] = row.x; positions[i * 3 + 1] = row.y; positions[i * 3 + 2] = row.z;
        if (colourNames) {
          for (let c = 0; c < 3; c++) {
            const value = row[colourNames[c]] * byteScale;
            colors[i * 4 + c] = Math.max(0, Math.min(255, Math.round(value)));
          }
          colors[i * 4 + 3] = 255;
        }
      }
    } else {
      for (let i = 0; i < element.count; i++) {
        for (const property of element.properties) {
          if (property.list) {
            const n = read(property.countType);
            const indices = [];
            for (let k = 0; k < n; k++) indices.push(read(property.type));
            // Triangle fan, so a quad or an n-gon renders rather than being
            // dropped. Open4D only writes triangles; other producers do not.
            for (let k = 2; k < indices.length; k++) {
              faces.push(indices[0], indices[k - 1], indices[k]);
            }
          } else {
            read(property.type);
          }
        }
      }
    }
  }

  if (!count) throw new Error("PLY declares no vertices");
  const indices = faces.length ? new Uint32Array(faces) : null;

  const lower = [Infinity, Infinity, Infinity];
  const upper = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < count; i++) {
    for (let c = 0; c < 3; c++) {
      const value = positions[i * 3 + c];
      if (value < lower[c]) lower[c] = value;
      if (value > upper[c]) upper[c] = value;
    }
  }
  return { count, positions, colors, indices, bounds: [lower, upper] };
}

/* ------------------------------------------------------------------ draco ---
 * A compressed mesh frame, decoded here rather than on the server.
 *
 * This is the first format in this client that is actually a *compression* of
 * geometry rather than an interchange dump of it: measured on the basketball
 * sequence, 761 kB of PLY becomes 59 kB of Draco at 14-bit quantisation, which
 * is 1.8 MB/s at 30 fps instead of 23. That is the difference between a link
 * and a LAN, and it is why this exists.
 *
 * Two costs, both real and both bounded. Position is quantised -- at 14 bits the
 * worst vertex moved 0.0046% of the model's diagonal on that sequence -- and
 * duplicate vertices are merged, so the decoded point count is lower than the
 * encoder was given (20,672 -> 19,747 there, because the source OBJ splits
 * vertices at seams). Neither changes what the surface looks like; both mean a
 * `.drc` frame is a delivery form and the PLY stays the source of truth.
 *
 * The decoder is Google's, vendored under client/vendor/draco and served from
 * this origin -- never a CDN, which is what keeps the page free of external
 * dependencies. It is a WASM module, so loading is asynchronous and happens once
 * on first use: `Scheduler.decode` is awaited, which is what makes an async
 * decoder possible at all here.
 */
const DRACO_PATH = "client/vendor/draco";
let dracoModule = null;

function loadDraco() {
  if (dracoModule) return dracoModule;
  dracoModule = (async () => {
    // Injected rather than imported: the wrapper is an Emscripten UMD bundle,
    // not an ES module, so it publishes DracoDecoderModule as a global.
    if (!self.DracoDecoderModule) {
      await new Promise((resolve, reject) => {
        const tag = document.createElement("script");
        tag.src = `${DRACO_PATH}/draco_wasm_wrapper.js`;
        tag.onload = resolve;
        tag.onerror = () => reject(new Error(
          `could not load ${tag.src} — the server serves this from the client `
          + `package, so a 404 here means a stale or partial install`));
        document.head.appendChild(tag);
      });
    }
    const wasmBinary = await (await fetch(`${DRACO_PATH}/draco_decoder.wasm`))
      .arrayBuffer();
    return self.DracoDecoderModule({ wasmBinary });
  })();
  return dracoModule;
}

/* One Draco frame, in the shape parseMeshPly returns so the renderer cannot
 * tell which format a frame arrived in. */
async function parseDraco(buffer) {
  const draco = await loadDraco();
  const decoder = new draco.Decoder();
  const input = new draco.DecoderBuffer();
  input.Init(new Int8Array(buffer), buffer.byteLength);

  let mesh = null;
  try {
    if (decoder.GetEncodedGeometryType(input) !== draco.TRIANGULAR_MESH) {
      throw new Error("not a Draco triangular mesh");
    }
    mesh = new draco.Mesh();
    const status = decoder.DecodeBufferToMesh(input, mesh);
    if (!status.ok()) throw new Error(status.error_msg());

    const count = mesh.num_points();
    const faces = mesh.num_faces();

    const positions = new Float32Array(count * 3);
    const attribute = decoder.GetAttribute(
      mesh, decoder.GetAttributeId(mesh, draco.POSITION));
    const values = new draco.DracoFloat32Array();
    decoder.GetAttributeFloatForAllPoints(mesh, attribute, values);
    for (let i = 0; i < count * 3; i++) positions[i] = values.GetValue(i);
    draco.destroy(values);

    // Through the heap rather than GetFaceFromMesh per face: 39k calls across
    // the WASM boundary is most of the decode time on this content.
    const bytes = faces * 3 * 4;
    const pointer = draco._malloc(bytes);
    decoder.GetTrianglesUInt32Array(mesh, bytes, pointer);
    const indices = new Uint32Array(draco.HEAPF32.buffer, pointer, faces * 3).slice();
    draco._free(pointer);

    let colors = null;
    const colourId = decoder.GetAttributeId(mesh, draco.COLOR);
    if (colourId >= 0) {
      const colourAttribute = decoder.GetAttribute(mesh, colourId);
      const raw = new draco.DracoFloat32Array();
      decoder.GetAttributeFloatForAllPoints(mesh, colourAttribute, raw);
      const channels = colourAttribute.num_components();
      colors = new Uint8Array(count * 4);
      for (let i = 0; i < count; i++) {
        for (let c = 0; c < 3; c++) {
          const value = raw.GetValue(i * channels + Math.min(c, channels - 1));
          // Draco keeps whatever range it was given; Open4D's canon is [0, 1].
          colors[i * 4 + c] = Math.max(0, Math.min(255, Math.round(
            value <= 1.0001 ? value * 255 : value)));
        }
        colors[i * 4 + 3] = 255;
      }
      draco.destroy(raw);
    }

    const lower = [Infinity, Infinity, Infinity];
    const upper = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < count; i++) {
      for (let c = 0; c < 3; c++) {
        const value = positions[i * 3 + c];
        if (value < lower[c]) lower[c] = value;
        if (value > upper[c]) upper[c] = value;
      }
    }
    return { count, positions, colors, indices, bounds: [lower, upper] };
  } finally {
    if (mesh) draco.destroy(mesh);
    draco.destroy(input);
    draco.destroy(decoder);
  }
}

/* --------------------------------------------------- mesh / point shaders ---
 * Same camera math as the splat path -- eye plus a (right, down, forward) basis
 * and a focal length in pixels -- so a mesh pane and a splat pane of the same
 * scene agree geometrically. What differs is that this writes a real depth and
 * runs the depth test: triangles occlude, where splats are blended in sorted
 * order and never do. */
const MESH_VERTEX_SHADER = `#version 300 es
precision highp float;

uniform vec3 uEye;
uniform vec3 uRight;
uniform vec3 uDown;
uniform vec3 uForward;
uniform vec2 uFocal;
uniform vec2 uViewport;
uniform vec2 uDepthRange;   // near, far
uniform float uPointSize;

in vec3 aPosition;
in vec4 aColor;

out vec3 vWorld;
out vec4 vColor;

void main() {
  vWorld = aPosition;
  vColor = aColor;
  vec3 p = aPosition - uEye;
  vec3 cam = vec3(dot(p, uRight), dot(p, uDown), dot(p, uForward));
  float near = uDepthRange.x, far = uDepthRange.y;
  if (cam.z < near) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }

  // The perspective divide rides in w, so interpolation stays perspective
  // correct and the depth buffer gets the usual hyperbolic z.
  vec2 px = vec2(uFocal.x * cam.x, uFocal.y * cam.y);
  vec2 toNdc = vec2(2.0 / uViewport.x, -2.0 / uViewport.y);
  float clipZ = (cam.z * (far + near) - 2.0 * far * near) / (far - near);
  gl_Position = vec4(px * toNdc, clipZ, cam.z);
  gl_PointSize = uPointSize;
}
`;

const MESH_FRAGMENT_SHADER = `#version 300 es
precision highp float;

uniform vec3 uEye;
uniform int uMode;          // 0 = triangles, 1 = points
uniform float uAmbient;

in vec3 vWorld;
in vec4 vColor;
out vec4 fragColor;

void main() {
  vec3 toEye = normalize(uEye - vWorld);
  vec3 normal;
  if (uMode == 1) {
    // A point has no surface to differentiate, so it is shaded as a small
    // sphere: the disc's own coordinates stand in for a normal, which reads as
    // round rather than as a flat chip.
    vec2 disc = gl_PointCoord * 2.0 - 1.0;
    float squared = dot(disc, disc);
    if (squared > 1.0) discard;
    normal = normalize(vec3(disc.x, -disc.y, sqrt(max(1.0 - squared, 0.0))));
  } else {
    // Flat shading from screen-space derivatives. No CPU normals and none in
    // the file: Open4D's PLY writer refuses to store them, and a normal derived
    // here is correct for whatever geometry actually arrived.
    normal = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
    if (dot(normal, toEye) < 0.0) normal = -normal;
  }
  float lambert = uAmbient + (1.0 - uAmbient) * max(dot(normal, toEye), 0.0);
  fragColor = vec4(vColor.rgb * lambert, 1.0);
}
`;

/* Triangles and points, sharing one program. Same interface as SplatRenderer --
 * upload / sort / draw -- so a Pane does not know which it is holding; `sort`
 * is a no-op here because the depth buffer does that job. */
class MeshRenderer {
  constructor(gl, mode) {
    this.gl = gl;
    this.mode = mode === "points" ? 1 : 0;
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, MESH_VERTEX_SHADER));
    gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, MESH_FRAGMENT_SHADER));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || "program link failed");
    }
    this.program = program;
    this.uniform = {};
    for (const name of ["uEye", "uRight", "uDown", "uForward", "uFocal",
                        "uViewport", "uDepthRange", "uPointSize", "uMode",
                        "uAmbient"]) {
      this.uniform[name] = gl.getUniformLocation(program, name);
    }
    this.positionBuffer = gl.createBuffer();
    this.colorBuffer = gl.createBuffer();
    this.indexBuffer = gl.createBuffer();
    this.count = 0;
    this.indexCount = 0;
    this.bounds = null;
  }

  upload(parsed) {
    const gl = this.gl;
    this.count = parsed.count;
    this.bounds = parsed.bounds;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, parsed.positions, gl.DYNAMIC_DRAW);

    // A mesh with no colour is drawn in the same near-white the Qt sequence
    // viewer uses, so the two do not disagree about what an uncoloured mesh
    // looks like.
    const colors = parsed.colors || (() => {
      const flat = new Uint8Array(parsed.count * 4);
      for (let i = 0; i < parsed.count; i++) {
        flat[i * 4] = 242; flat[i * 4 + 1] = 242; flat[i * 4 + 2] = 247;
        flat[i * 4 + 3] = 255;
      }
      return flat;
    })();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, colors, gl.DYNAMIC_DRAW);

    this.indexCount = parsed.indices ? parsed.indices.length : 0;
    if (this.indexCount) {
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, parsed.indices, gl.DYNAMIC_DRAW);
    }
  }

  /* Nothing to do: the depth buffer resolves occlusion, which is the whole
   * reason a mesh does not need the far-to-near ordering a splat does. */
  sort() {}

  /* Near and far from the frame's own bounding box, so a scene of any scale
   * gets usable depth precision instead of a guessed constant. */
  _depthRange(eye) {
    if (!this.bounds) return [0.01, 100.0];
    const [lower, upper] = this.bounds;
    let near = Infinity, far = 0;
    for (let corner = 0; corner < 8; corner++) {
      const point = [
        (corner & 1) ? upper[0] : lower[0],
        (corner & 2) ? upper[1] : lower[1],
        (corner & 4) ? upper[2] : lower[2],
      ];
      const distance = Math.hypot(point[0] - eye[0], point[1] - eye[1], point[2] - eye[2]);
      near = Math.min(near, distance);
      far = Math.max(far, distance);
    }
    // The eye can be inside the box, so the near plane cannot simply be the
    // closest corner.
    return [Math.max(near * 0.5, far * 1e-4, 1e-4), far * 2 + 1e-3];
  }

  draw(camera, rect, canvasSize) {
    const gl = this.gl;
    gl.viewport(0, 0, canvasSize[0], canvasSize[1]);
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(0.043, 0.047, 0.059, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (!this.count) return;

    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(rect[0], rect[1], rect[2], rect[3]);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.disable(gl.SCISSOR_TEST);
    gl.viewport(rect[0], rect[1], rect[2], rect[3]);

    gl.useProgram(this.program);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.BLEND);

    const position = gl.getAttribLocation(this.program, "aPosition");
    gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 3, gl.FLOAT, false, 0, 0);

    const color = gl.getAttribLocation(this.program, "aColor");
    gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuffer);
    gl.enableVertexAttribArray(color);
    gl.vertexAttribPointer(color, 4, gl.UNSIGNED_BYTE, true, 0, 0);

    const depth = this._depthRange(camera.eye);
    gl.uniform3fv(this.uniform.uEye, camera.eye);
    gl.uniform3fv(this.uniform.uRight, camera.right);
    gl.uniform3fv(this.uniform.uDown, camera.down);
    gl.uniform3fv(this.uniform.uForward, camera.forward);
    gl.uniform2f(this.uniform.uFocal, camera.focal[0], camera.focal[1]);
    gl.uniform2f(this.uniform.uViewport, rect[2], rect[3]);
    gl.uniform2f(this.uniform.uDepthRange, depth[0], depth[1]);
    gl.uniform1f(this.uniform.uPointSize, 3.0);
    gl.uniform1i(this.uniform.uMode, this.mode);
    gl.uniform1f(this.uniform.uAmbient, 0.32);

    if (this.mode === 0 && this.indexCount) {
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
      gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_INT, 0);
    } else {
      // A mesh clip whose frames carry no faces still has vertices worth
      // showing, so it falls through to points rather than drawing nothing.
      gl.uniform1i(this.uniform.uMode, 1);
      gl.drawArrays(gl.POINTS, 0, this.count);
    }
    gl.disable(gl.DEPTH_TEST);
  }
}

/* ---------------------------------------------------- representations ---
 * What a decoded frame *is*, mirroring `open4d.core.Representation`. A
 * representation decides which source parses it, which surface shows it, and
 * whether a free camera is meaningful -- so adding one is an entry here plus a
 * renderer, not a new branch in every function that touches a clip.
 *
 * `geometry` is core's `Representation.has_geometry`. Note the two are not the
 * same question as "can this be played here": `mesh` and `points` have geometry
 * in core but have no browser renderer yet, so they are deliberately absent and
 * a clip declaring one is reported as unplayable rather than rendering blank.
 */
const REPRESENTATIONS = {
  mesh: {
    geometry: true,
    surface: "canvas",
    decode: decodeGeometry(parseGeometryFrame),
    cacheSize: 6,
    renderer: (gl) => new MeshRenderer(gl, "mesh"),
  },
  points: {
    geometry: true,
    surface: "canvas",
    decode: decodeGeometry(parseGeometryFrame),
    cacheSize: 6,
    renderer: (gl) => new MeshRenderer(gl, "points"),
  },
  gaussians: {
    geometry: true,
    surface: "canvas",
    decode: decodeGeometry(parseGaussianFrame),
    cacheSize: 6,
    renderer: (gl) => new SplatRenderer(gl),
  },
  pixels: {
    geometry: false,
    surface: "image",
    decode: decodeImage,
    // Pixels decode to an <img>, which is cheap next to a parsed vertex buffer,
    // so a longer window costs little and covers a faster scrub.
    cacheSize: 16,
  },
};

/* A Gaussian frame arrives as 3DGS PLY or as quantised .splat; both parse to
 * one shape, so nothing below here knows which it got. */
function parseGaussianFrame(buffer, url) {
  return url.toLowerCase().endsWith(".splat") ? parseSplat(buffer) : parsePly(buffer);
}

/* A mesh or point frame arrives as PLY or as Draco. Same shape out. */
function parseGeometryFrame(buffer, url) {
  return url.toLowerCase().endsWith(".drc") ? parseDraco(buffer) : parseMeshPly(buffer);
}

/* view.json v1 called these `kind`. Bundles already on disk are worth keeping
 * readable, so the field is migrated on load rather than requiring a re-export. */
const LEGACY_KINDS = { splats: "gaussians", images: "pixels" };

function spec(clip) { return clip ? REPRESENTATIONS[clip.representation] : undefined; }
function playable(clip) { return spec(clip) !== undefined; }
function hasGeometry(clip) { const s = spec(clip); return s !== undefined && s.geometry; }
function isPixels(clip) { const s = spec(clip); return s !== undefined && !s.geometry; }
/* A clip rendered as it is watched: a URL instead of a frame list, so there is
 * no scheduler, no cache and nothing to scrub. See streamer/live.py. */
function isLive(clip) { return !!(clip && clip.stream); }
/* What a streamed pane should call itself. The transport is the same either
 * way; what differs is whether anything is being computed while you watch, and
 * calling a replay "live" is a claim the software does not support. */
function streamLabel(clip) {
  return clip && clip.stream && clip.stream.origin === "replay" ? "replay" : "live";
}

/* ------------------------------------------------------------- scheduling ---
 * When a frame can only be decoded after another one, requesting it and hoping
 * is wrong. `open4d.core.Dependency` is where that is declared -- a codec's
 * frames may need the group's key frame first (`gop`, as in Vega's
 * group-of-volumes), or its decode stream may not rewind at all (`sequential`,
 * as in ReRF) -- and a manifest carries the declaration per clip.
 *
 * This is that model's client half. `chain` is a transcription of
 * Dependency.chain, and being a transcription is a liability: two
 * implementations of one rule in two languages drift. So it is held to the
 * Python one by a test that runs both over the same cases
 * (streamer_tests/test_scheduler.py). Change one, and that test tells you about
 * the other.
 *
 * Every clip this repository writes today is independent, because every
 * exporter decodes before it writes. The gop and sequential paths are therefore
 * tested rather than exercised; they are what a producer serving a bitstream as
 * its frames would need, and building them after such a producer existed would
 * mean changing the client at the same time as trusting a new encoder.
 */
const INDEPENDENT = { mode: "independent", keyFrames: [] };

function dependencyOf(clip) {
  const raw = clip && clip.dependency;
  if (!raw) return INDEPENDENT;
  return { mode: raw.mode, keyFrames: raw.key_frames || [] };
}

/* The frames to decode, in order, to make `index` available -- see
 * Dependency.chain for why a backward seek in a sequential stream comes back as
 * a full replay rather than a step. `decoded` is where the decoder currently
 * sits, or null. */
function chain(dependency, index, decoded = null) {
  if (index < 0) throw new Error("index must be nonnegative");
  if (dependency.mode === "independent") return [index];
  if (decoded === index) return [];

  let start;
  if (dependency.mode === "gop") {
    const keys = dependency.keyFrames.filter((key) => key <= index);
    if (!keys.length) throw new Error(`no key frame at or before ${index}`);
    start = keys[keys.length - 1];
    if (decoded !== null && start <= decoded && decoded < index) start = decoded + 1;
  } else {
    start = decoded !== null && decoded < index ? decoded + 1 : 0;
  }
  const frames = [];
  for (let i = start; i <= index; i++) frames.push(i);
  return frames;
}

/* One cache, one prefetch policy, one place that honours the dependency chain.
 *
 * Before this the two clip sources each kept their own: different look-ahead
 * (two frames against four), and only one of them evicted -- the image path
 * grew without bound, so scrubbing a long clip kept every frame it had ever
 * shown. Hoisting it fixes that and is most of why this exists today, given
 * that nothing yet declares a dependency to honour.
 */
class Scheduler {
  constructor(clip, root, decode, { cacheSize = 6, lookAhead = 3 } = {}) {
    this.clip = clip;
    this.root = root;
    this.decode = decode;
    this.dependency = dependencyOf(clip);
    this.cacheSize = Math.max(1, cacheSize);
    this.lookAhead = lookAhead;
    this.cache = new Map();          // index -> decoded frame, insertion-ordered
    this.pending = new Map();        // index -> in-flight promise
    this.decoded = null;             // where a stateful decoder currently sits
    this.stats = { decodes: 0, bytes: 0, hits: 0, misses: 0, replays: 0 };
  }

  get length() { return this.clip.frames.length; }

  /* A decoded frame may hold a resource the browser will not reclaim on its own
   * -- an image decoded from a blob keeps that blob alive through its object
   * URL. Evicting the frame has to let it go, or a long scrub leaks every frame
   * it ever showed, which is the bug the old unbounded image cache had in a
   * different form. */
  static release(value) {
    if (value && value.objectUrl) {
      URL.revokeObjectURL(value.objectUrl);
      value.objectUrl = null;
    }
  }

  _touch(index, value) {
    // Insertion-ordered Map as an LRU: re-inserting moves a key to the end, so
    // the oldest is always the first key.
    this.cache.delete(index);
    this.cache.set(index, value);
    while (this.cache.size > this.cacheSize) {
      const oldest = this.cache.keys().next().value;
      Scheduler.release(this.cache.get(oldest));
      this.cache.delete(oldest);
    }
  }

  /* Drop everything, releasing each frame. Called when a pane changes clip or
   * goes away: the scheduler is replaced, and whatever it still held would
   * otherwise never be reclaimed. */
  release() {
    for (const value of this.cache.values()) Scheduler.release(value);
    this.cache.clear();
    this.pending.clear();
  }

  async _decodeOne(index) {
    if (this.cache.has(index)) return this.cache.get(index);
    if (this.pending.has(index)) return this.pending.get(index);
    const url = this.root + this.clip.frames[index];
    const task = fetch(url).then(async (response) => {
      if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
      const buffer = await response.arrayBuffer();
      // The response's own Content-Type, which the server takes from the
      // representation registry -- so an image is decoded as the type it was
      // served as rather than by leaving a browser to sniff a typeless blob.
      const parsed = await this.decode(buffer, url, response.headers
        ? response.headers.get("Content-Type") : null);
      this.pending.delete(index);
      this.stats.decodes += 1;
      this.stats.bytes += buffer.byteLength;
      this._touch(index, parsed);
      return parsed;
    }).catch((error) => { this.pending.delete(index); throw error; });
    this.pending.set(index, task);
    return task;
  }

  /* The frame at `index`, decoding whatever has to come first. */
  async seek(index) {
    if (this.cache.has(index)) {
      this.stats.hits += 1;
      const value = this.cache.get(index);
      this._touch(index, value);
      return value;
    }
    this.stats.misses += 1;
    const plan = chain(this.dependency, index, this.decoded);
    if (plan.length > 1) this.stats.replays += 1;
    let last = this.cache.get(index);
    for (const step of plan) {
      last = await this._decodeOne(step);
      if (this.dependency.mode !== "independent") this.decoded = step;
    }
    return last;
  }

  /* Look ahead along the direction playback actually moves. Only the frames a
   * forward step would need are fetched, which for a dependent clip is the next
   * few in the chain rather than an arbitrary window. */
  prefetch(index) {
    for (let ahead = 1; ahead <= this.lookAhead; ahead++) {
      const next = (index + ahead) % this.length;
      if (this.cache.has(next) || this.pending.has(next)) continue;
      if (this.dependency.mode === "independent") {
        this._decodeOne(next).catch(() => {});
      } else if (next === index + ahead) {
        // Not across the loop point: restarting a dependent stream to prefetch
        // frame 0 would evict the frames being played to get there.
        this._decodeOne(next).catch(() => {});
      }
    }
  }

  snapshot() {
    return {
      ...this.stats,
      cached: this.cache.size,
      pending: this.pending.size,
      mode: this.dependency.mode,
    };
  }
}

/* The decoders a Scheduler drives. Each turns bytes into something a renderer
 * takes and nothing else: no caching, no look-ahead, no idea what frame it is.
 * That all moved to the Scheduler, so the two paths share one policy instead of
 * disagreeing about it.
 *
 * A parsed geometry frame is roughly 50 bytes a Gaussian, so a handful is tens
 * of megabytes and the whole sequence is not -- hence the small cache the
 * representation asks for rather than an unbounded one. */
function decodeGeometry(parse) {
  return (buffer, url) => parse(buffer, url);
}


/* Pixels arrive as an <img> rather than an array, because that is what the
 * surface takes. Decoded through a blob URL so the fetch, and therefore the
 * byte count and the cache, work the same way as every other representation --
 * setting `img.src` to the frame URL would put the transfer somewhere the
 * scheduler cannot see. */
function decodeImage(buffer, url, mediaType) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([buffer], mediaType ? { type: mediaType } : undefined);
    const objectUrl = URL.createObjectURL(blob);
    const image = new Image();
    // The URL stays alive for as long as this frame is cached, and is revoked
    // when the Scheduler evicts it (see `release`). Revoking it here on load
    // looks tidy and is wrong: a decoded frame's `src` is what a pane assigns to
    // its own <img>, so a revoked URL leaves the pane showing nothing at all --
    // silently, because assigning a dead blob URL is not an error.
    image.objectUrl = objectUrl;
    image.onload = () => resolve(image);
    image.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error(`could not decode ${url}`));
    };
    image.src = objectUrl;
  });
}

/* ------------------------------------------------------------------ panes ---
 * One pane per method. A pane owns whichever surface its clip needs -- a WebGL
 * canvas with its own renderer for splats, an <img> for a rendered or captured
 * sequence -- and is told what to show; it never decides what to compare with
 * what. Separate contexts rather than one canvas with scissored viewports
 * because half the panes are not canvases at all.
 */
class Pane {
  constructor(method) {
    this.method = method;
    this.host = document.createElement("div");
    this.host.className = "pane";
    this.label = document.createElement("div");
    this.label.className = "label";
    this.label.textContent = method;
    this.host.appendChild(this.label);
    this.clip = null;
    this.source = null;
    this.renderer = null;
    this.rendererKind = null;
    this.gl = null;
    this.canvas = null;
    this.image = null;
    this.loaded = -1;
    this.sortKey = "";
  }

  _surface(which, makeRenderer) {
    if (which === "canvas" && !this.canvas) {
      this.canvas = document.createElement("canvas");
      this.host.appendChild(this.canvas);
      const gl = this.canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: true });
      if (!gl) throw new Error("WebGL2 unavailable");
      this.gl = gl;
    }
    // The renderer is per representation, and a pane's representation changes
    // when its clip does -- so it is rebuilt when the kind of renderer needed
    // changes, on the one canvas rather than a new context per switch.
    if (which === "canvas" && makeRenderer && this.rendererKind !== makeRenderer.kind) {
      this.renderer = makeRenderer(this.gl);
      this.rendererKind = makeRenderer.kind;
    }
    if (which === "image" && !this.image) {
      this.image = document.createElement("img");
      this.image.alt = "";
      this.host.appendChild(this.image);
    }
    if (this.canvas) this.canvas.hidden = which !== "canvas";
    if (this.image) this.image.hidden = which !== "image";
  }

  setClip(clip) {
    if (this.source && this.source.release) this.source.release();
    this.clip = clip;
    this.loaded = -1;
    this.sortKey = "";
    if (this.missing) { this.missing.remove(); this.missing = null; }
    if (!clip) {
      if (this.canvas) this.canvas.hidden = true;
      if (this.image) this.image.hidden = true;
      this.source = null;
      // Otherwise the label keeps naming the camera of the clip that was here
      // before, which is the one thing a pane saying "nothing here" must not do.
      this.label.textContent = this.method;
      this.missing = document.createElement("div");
      this.missing.className = "missing";
      this.missing.textContent =
        `${this.method} has nothing at this camera.\nOnly a representation with geometry `
        + `can be rendered anywhere; pre-rendered pixels exist only where they were made.`;
      this.host.appendChild(this.missing);
      return;
    }
    const kind = spec(clip);
    if (isLive(clip)) {
      // No scheduler: the browser owns the connection, and multipart replacement
      // is a browser feature. Set once -- reassigning src restarts the stream.
      this._surface("image", null);
      this.source = null;
      this.image.src = clip.stream.url;
      this.loaded = 0;
      this.label.textContent = `${this.method} · ${streamLabel(clip)}`;
      return;
    }
    const make = kind.renderer;
    if (make) make.kind = clip.representation;
    this._surface(kind.surface, make);
    this.source = new Scheduler(clip, "./", kind.decode, {
      cacheSize: kind.cacheSize,
    });
    this.label.textContent = clip.camera === null || clip.camera === undefined
      ? this.method : `${this.method} · cam ${clip.camera}`;
  }

  /* A canvas dropped from the DOM keeps its WebGL context until the browser
   * decides otherwise, and browsers cap how many exist at once -- so a pane
   * that goes away has to say so, or a few method changes silently exhaust the
   * budget and the surviving canvases start losing their contexts. */
  dispose() {
    if (this.source && this.source.release) this.source.release();
    this.source = null;
    if (this.gl) {
      const lose = this.gl.getExtension("WEBGL_lose_context");
      if (lose) lose.loseContext();
    }
    this.renderer = null;
    this.gl = null;
    this.host.remove();
  }

  get length() { return this.source ? this.source.length : 0; }

  async show(frame) {
    if (isLive(this.clip)) return;   // the stream advances itself
    if (!this.source) return;
    const index = Math.min(frame, this.source.length - 1);
    // seek, not fetch: for a clip that declares a dependency this decodes
    // whatever has to come first, in order.
    const decoded = await this.source.seek(index);
    if (isPixels(this.clip)) {
      this.image.src = decoded.src;
    } else {
      this.renderer.upload(decoded);
      this.sortKey = "";
    }
    this.loaded = index;
    this.source.prefetch(index);
  }

  /* Largest rect of the given aspect centred in the canvas, in device pixels.
   * Compare mode letterboxes splats to the rig's aspect so a rendered pane and
   * a captured pane frame the subject identically -- without it the two are
   * cropped differently and every visual difference is suspect. */
  static fit(width, height, aspect) {
    if (!aspect) return [0, 0, width, height];
    let w = width, h = Math.round(width / aspect);
    if (h > height) { h = height; w = Math.round(height * aspect); }
    return [Math.round((width - w) / 2), Math.round((height - h) / 2), w, h];
  }

  draw(basisFor, aspect) {
    if (!this.renderer || !this.canvas || this.canvas.hidden || this.loaded < 0) return;
    const rect = this.canvas.getBoundingClientRect();
    const scale = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(rect.width * scale));
    const height = Math.max(1, Math.round(rect.height * scale));
    if (this.canvas.width !== width || this.canvas.height !== height) {
      this.canvas.width = width;
      this.canvas.height = height;
      this.sortKey = "";
    }
    const box = Pane.fit(width, height, aspect);
    const camera = basisFor([box[2], box[3]]);
    const key = `${this.loaded}|${camera.eye.map((v) => v.toFixed(4))}`
              + `|${camera.forward.map((v) => v.toFixed(4))}|${box.join(",")}`;
    if (key !== this.sortKey) {
      this.renderer.sort(camera.eye, camera.forward);
      this.sortKey = key;
    }
    this.renderer.draw(camera, box, [width, height]);
  }
}

/* ---------------------------------------------------------------- session --- */
const app = {
  index: null, scenes: {}, scene: null, mode: "explore", frame: 0, station: 0,
  methods: [], panes: [], playing: false, lastAdvance: 0, advancing: false,
  fps: 30, wipe: false,
};

function setStatus(text) { statusEl.textContent = text; statusEl.hidden = false; }

/* Clips carry `scene` and `method`; a bundle written before they did, or one
 * holding something with no subject, is folded into a single pseudo-scene so
 * one code path covers both rather than two that drift. */
function normalise(index) {
  const unplayable = new Set();
  for (const clip of index.clips) {
    if (!clip.scene) clip.scene = "(ungrouped)";
    if (!clip.method) clip.method = clip.name;
    if (!clip.representation) clip.representation = LEGACY_KINDS[clip.kind] || clip.kind;
    if (!playable(clip)) unplayable.add(clip.representation);
  }
  // Named rather than silently dropped: "nothing appeared" is indistinguishable
  // from a broken bundle, and the fix (a renderer for that representation) is
  // not something a user can guess at.
  if (unplayable.size) {
    console.warn(
      `no renderer for representation(s): ${[...unplayable].join(", ")}; `
      + "those clips are hidden");
  }
  index.clips = index.clips.filter(playable);
  return index;
}

function scenesInBundle() {
  const seen = [];
  for (const clip of app.index.clips) if (!seen.includes(clip.scene)) seen.push(clip.scene);
  return seen;
}

function methodsFor(scene, mode) {
  const seen = [];
  for (const clip of app.index.clips) {
    if (clip.scene !== scene) continue;
    // Explore is a free camera, so only a representation with geometry qualifies.
    if (mode === "explore" && !hasGeometry(clip)) continue;
    if (!seen.includes(clip.method)) seen.push(clip.method);
  }
  return seen;
}

function rig() { return app.scenes[app.scene] || null; }

function clipFor(method) {
  const all = app.index.clips.filter((c) => c.scene === app.scene && c.method === method);
  if (app.mode === "explore") return all.find(hasGeometry) || null;
  // Compare: an image only exists at the station it was made at; Gaussians can
  // be rendered at any of them, so they are the fallback rather than the first
  // choice -- a real render beats a re-render of the same thing.
  // A live clip is resolved whatever the station: it renders its own camera, and
  // lives in its own scene precisely so that this cannot put it beside a rig
  // pose and imply they match.
  return all.find((c) => isPixels(c) && c.camera === app.station)
      || all.find(isLive)
      || all.find(hasGeometry)
      || null;
}

function frameCount() {
  // A live pane has no length and must not shorten the clip beside it; if every
  // pane is live there is nothing to scrub and the transport bar says so.
  const lengths = app.panes
    .filter((pane) => !isLive(pane.clip))
    .map((pane) => pane.length || 1);
  return lengths.length ? Math.max(1, ...lengths) : 1;
}

function allPanesLive() {
  return app.panes.length > 0 && app.panes.every((pane) => isLive(pane.clip));
}

/* A live scene has no timeline. Disabling the controls rather than leaving them
 * inert is the difference between "there is nothing to scrub here" and "the
 * scrubber is broken". */
function updateTransport() {
  const live = allPanesLive();
  scrubFrame.disabled = live;
  playPause.disabled = live;
  if (live) {
    app.playing = false;
    playPause.textContent = "▶";
    // Names what the panes actually are. All-replay reads "replay"; a mix says
    // so rather than picking the flattering one.
    const kinds = [...new Set(app.panes.map((pane) => streamLabel(pane.clip)))];
    frameLabel.textContent = kinds.join(" + ");
  }
}

/* Re-point every pane at the clip it should now be showing, without touching
 * the panes themselves. This is what a camera step does: same methods, same
 * renderers, different source -- so stepping through the rig costs a clip
 * lookup rather than a WebGL context per station. */
function updateClips() {
  for (const pane of app.panes) {
    try {
      pane.setClip(clipFor(pane.method));
    } catch (error) {
      return fail(`Could not start a renderer for ${pane.method}: ${error.message || error}`);
    }
  }
  scrubFrame.max = String(frameCount() - 1);
  app.frame = Math.min(app.frame, frameCount() - 1);
  updateTransport();
  refreshPanel();
  writeHash();
  showFrame(app.frame);
}

function rebuildPanes() {
  const existing = new Map(app.panes.map((pane) => [pane.method, pane]));
  app.panes = [];
  for (const method of app.methods) {
    const pane = existing.get(method) || new Pane(method);
    existing.delete(method);
    try {
      pane.setClip(clipFor(method));
    } catch (error) {
      return fail(`Could not start a renderer for ${method}: ${error.message || error}`);
    }
    app.panes.push(pane);
  }
  for (const pane of existing.values()) pane.dispose();
  // Reappend in order; moving an existing node does not recreate its context.
  for (const pane of app.panes) panesEl.appendChild(pane.host);
  const handle = document.getElementById("wipeHandle");
  if (handle) handle.remove();
  const wipeable = app.wipe && app.panes.length === 2;
  panesEl.classList.toggle("wipe", wipeable);
  panesEl.style.gridTemplateColumns = wipeable ? "" : `repeat(${Math.max(app.panes.length, 1)}, 1fr)`;
  if (wipeable) {
    const handle = document.createElement("div");
    handle.id = "wipeHandle";
    panesEl.appendChild(handle);
    bindWipe(handle);
  }
  scrubFrame.max = String(frameCount() - 1);
  app.frame = Math.min(app.frame, frameCount() - 1);
  updateTransport();
  refreshPanel();
  writeHash();
  showFrame(app.frame);
}

function refreshPanel() {
  const notes = document.getElementById("notes");
  notes.innerHTML = "";
  const lines = [];
  if (app.mode === "explore") {
    lines.push("free camera, shared across every pane — differences you see are the reconstructions, not the viewpoint");
  } else if (rig()) {
    const pose = rig().poses[app.station];
    lines.push(`rig camera ${app.station}${pose && pose.view_id !== null ? ` (captured view ${pose.view_id})` : " (interpolated)"} — every pane is at this exact pose`);
  } else {
    lines.push("this scene has no capture rig in the bundle, so there is no shared camera to compare at");
  }
  for (const pane of app.panes) {
    for (const note of (pane.clip && pane.clip.notes) || []) lines.push(`${pane.method}: ${note}`);
  }
  for (const line of lines) {
    const li = document.createElement("li");
    li.textContent = line;
    notes.appendChild(li);
  }

  const stats = document.getElementById("stats");
  stats.innerHTML = "";
  const rows = [["mode", app.mode], ["panes", app.panes.length], ["frames", frameCount()]];
  for (const pane of app.panes) {
    if (pane.clip && pane.clip.counts && pane.clip.counts.length) {
      const noun = pane.clip.representation === "gaussians" ? "gaussians" : "vertices";
      rows.push([`${pane.method} ${noun}`,
                 Math.round(pane.clip.counts.reduce((a, b) => a + b, 0) / pane.clip.counts.length).toLocaleString()]);
    }
  }
  // What the scheduler actually did. Summed across panes, because the question
  // is whether playback is keeping up, not which pane is behind.
  const active = app.panes.filter((pane) => pane.source && pane.source.snapshot);
  if (active.length) {
    const totals = active.reduce((sum, pane) => {
      const snap = pane.source.snapshot();
      return {
        cached: sum.cached + snap.cached,
        pending: sum.pending + snap.pending,
        decodes: sum.decodes + snap.decodes,
        bytes: sum.bytes + snap.bytes,
        replays: sum.replays + snap.replays,
      };
    }, { cached: 0, pending: 0, decodes: 0, bytes: 0, replays: 0 });
    rows.push(["buffered", `${totals.cached} frames`
      + (totals.pending ? ` (+${totals.pending} in flight)` : "")]);
    rows.push(["decoded", `${totals.decodes} frames · `
      + `${(totals.bytes / 1e6).toFixed(1)} MB`]);
    const modes = new Set(active.map((pane) => pane.source.snapshot().mode));
    if (!(modes.size === 1 && modes.has("independent"))) {
      // Only worth the row when something is not independent: a replay count of
      // zero on an independent clip says nothing.
      rows.push(["decode order", [...modes].join(", ")]);
      rows.push(["replays", String(totals.replays)]);
    }
  }
  for (const [key, value] of rows) {
    const dt = document.createElement("dt"); dt.textContent = key;
    const dd = document.createElement("dd"); dd.textContent = value;
    stats.append(dt, dd);
  }

  const help = document.getElementById("controlHelp");
  help.innerHTML = "";
  const items = app.mode === "explore"
    ? ["<kbd>drag</kbd> orbit · <kbd>shift</kbd>+drag or right-drag pan",
       "<kbd>wheel</kbd> zoom · <kbd>r</kbd> reset camera",
       "<kbd>space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step one frame"]
    : ["<kbd>,</kbd> <kbd>.</kbd> step the rig camera",
       "<kbd>space</kbd> play/pause · <kbd>←</kbd> <kbd>→</kbd> step one frame",
       "<kbd>A|B</kbd> wipes between two panes; drag the handle"];
  for (const item of items) {
    const li = document.createElement("li");
    li.innerHTML = item;
    help.appendChild(li);
  }
}

function renderMethodList() {
  methodList.innerHTML = "";
  const available = methodsFor(app.scene, app.mode);
  if (!available.length) {
    const note = document.createElement("p");
    note.className = "sub";
    note.textContent = app.mode === "explore"
      ? "No method for this scene ships Gaussians, so there is nothing a free camera can show. Switch to Compare."
      : "No clips for this scene.";
    methodList.appendChild(note);
    return;
  }
  for (const method of available) {
    const row = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = app.methods.includes(method);
    box.addEventListener("change", () => {
      app.methods = available.filter(
        (candidate) => candidate === method ? box.checked : app.methods.includes(candidate));
      rebuildPanes();
      renderMethodList();
    });
    const text = document.createElement("span");
    text.textContent = method;
    row.append(box, text);
    if (app.mode === "compare") {
      const why = document.createElement("span");
      why.className = "why";
      const clip = app.index.clips.find(
        (c) => c.scene === app.scene && c.method === method
               && isPixels(c) && c.camera === app.station);
      const splat = app.index.clips.find(
        (c) => c.scene === app.scene && c.method === method && hasGeometry(c));
      why.textContent = clip ? "rendered here" : splat ? "renders here" : "not at this camera";
      row.appendChild(why);
    }
    methodList.appendChild(row);
  }
}

function selectScene(scene) {
  app.scene = scene;
  // A scene whose every clip is live has nothing a free camera could show, so
  // landing on it in Explore would present an empty pane and a message about
  // Gaussians. Switching is more useful than explaining.
  const anyGeometry = app.index.clips.some(
    (clip) => clip.scene === scene && hasGeometry(clip));
  if (app.mode === "explore" && !anyGeometry) {
    setMode("compare");
    return;
  }
  const available = methodsFor(scene, app.mode);
  app.methods = available.slice(0, 2);
  app.station = 0;
  const poses = rig() ? rig().poses.length : 0;
  scrubCamera.max = String(Math.max(poses - 1, 0));
  scrubCamera.value = "0";
  cameraRow.hidden = app.mode !== "compare";
  scrubCamera.disabled = poses === 0;
  cameraLabel.textContent = poses ? `1 / ${poses}` : "none";
  if (app.mode === "explore") {
    const clip = app.index.clips.find((c) => c.scene === scene && hasGeometry(c));
    const lower = (clip && clip.bounds_min) || [-1, -1, -1];
    const upper = (clip && clip.bounds_max) || [1, 1, 1];
    const centre = [0, 1, 2].map((i) => (lower[i] + upper[i]) / 2);
    const diagonal = Math.hypot(upper[0] - lower[0], upper[1] - lower[1], upper[2] - lower[2]) || 2;
    app.camera.reset(centre, app.camera.fitDistance(diagonal / 2, [panesEl.clientWidth || 960,
                                                                  panesEl.clientHeight || 700]));
  }
  renderMethodList();
  rebuildPanes();
}

function setMode(mode) {
  app.mode = mode;
  document.getElementById("modeExplore").setAttribute("aria-pressed", String(mode === "explore"));
  document.getElementById("modeCompare").setAttribute("aria-pressed", String(mode === "compare"));
  cameraRow.hidden = mode !== "compare";
  selectScene(app.scene);
}

async function showFrame(index) {
  const total = frameCount();
  app.frame = ((index % total) + total) % total;
  scrubFrame.value = String(app.frame);
  writeHash();
  if (allPanesLive()) {
    updateTransport();
  } else {
    frameLabel.textContent = `${app.frame + 1} / ${total}`;
  }
  try {
    await Promise.all(app.panes.map((pane) => pane.show(app.frame)));
    (app.shownAt = app.shownAt || []).push(performance.now());
    if (app.shownAt.length > 30) app.shownAt.shift();
    statusEl.hidden = true;
  } catch (error) {
    setStatus(String(error.message || error));
  }
}

/* The camera every splat pane is drawn from. In compare mode it is the rig

 * pose, with the rig's own vertical field of view, so a rendered pane and a
 * captured pane are the same photograph of different content. */
function basisFactory() {
  if (app.mode === "compare" && rig()) {
    const pose = rig().poses[app.station];
    const fovY = rig().fov_y;
    return (size) => ({
      eye: pose.position,
      right: pose.right,
      down: pose.down,
      forward: pose.forward,
      focal: [0.5 * size[1] / Math.tan(fovY / 2), 0.5 * size[1] / Math.tan(fovY / 2)],
    });
  }
  return (size) => app.camera.frame(size);
}

function tick(now) {
  requestAnimationFrame(tick);
  if (!app.panes.length) return;
  /* Advance on the buffer, not on a wall clock.
   *
   * This used to fire `showFrame` whenever 1/fps had elapsed and not wait for
   * it. `showFrame` is async -- a fetch and a parse, tens of milliseconds at
   * best and far more over a link -- so calls overlapped, each one moving
   * `app.frame`, and they resolved in whatever order they finished. The counter
   * raced ahead of the pictures and the panes showed whichever decode landed
   * last, which is not slow playback but wrong playback.
   *
   * So: at most one advance in flight, and the next interval is timed from when
   * the last frame was actually shown. A clip the machine can keep up with
   * plays at `fps`; one it cannot plays as fast as it can decode, in order,
   * which is the honest failure mode. `--fps` becomes a ceiling rather than a
   * promise. */
  if (app.playing && !app.advancing && now - app.lastAdvance >= 1000 / app.fps) {
    app.advancing = true;
    showFrame(app.frame + 1).finally(() => {
      app.advancing = false;
      app.lastAdvance = performance.now();
    });
  }
  const aspect = app.mode === "compare" && rig() ? rig().width / rig().height : 0;
  const basis = basisFactory();
  for (const pane of app.panes) pane.draw(basis, aspect);
}

function togglePlay() {
  app.playing = !app.playing;
  playPause.textContent = app.playing ? "❚❚" : "▶";
  app.lastAdvance = 0;
}

/* How far playback is behind the rate it was asked for. Reported rather than
 * hidden: a clip at 129 MB a second of decoded frames cannot play at 30 fps
 * over any link, and saying so is more useful than appearing to stutter. */
function playbackRate() {
  return app.shownAt && app.shownAt.length > 1
    ? 1000 * (app.shownAt.length - 1) /
      (app.shownAt[app.shownAt.length - 1] - app.shownAt[0])
    : null;
}

function setStation(value) {
  const poses = rig() ? rig().poses.length : 0;
  if (!poses) return;
  app.station = ((value % poses) + poses) % poses;
  scrubCamera.value = String(app.station);
  cameraLabel.textContent = `${app.station + 1} / ${poses}`;
  updateClips();
  renderMethodList();
}

function bindWipe(handle) {
  let dragging = false;
  const move = (event) => {
    if (!dragging) return;
    const rect = panesEl.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
    document.documentElement.style.setProperty("--wipe", `${fraction * 100}%`);
  };
  handle.addEventListener("pointerdown", (event) => {
    dragging = true;
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener("pointermove", move);
  handle.addEventListener("pointerup", (event) => {
    dragging = false;
    handle.releasePointerCapture(event.pointerId);
  });
}

function bindControls() {
  let dragging = null;
  panesEl.addEventListener("contextmenu", (event) => event.preventDefault());
  panesEl.addEventListener("pointerdown", (event) => {
    if (app.mode !== "explore" || event.target.id === "wipeHandle") return;
    dragging = { x: event.clientX, y: event.clientY,
                 pan: event.shiftKey || event.button === 2 || event.button === 1 };
    panesEl.setPointerCapture(event.pointerId);
  });
  panesEl.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const dx = event.clientX - dragging.x, dy = event.clientY - dragging.y;
    dragging.x = event.clientX; dragging.y = event.clientY;
    const camera = app.camera;
    if (dragging.pan) {
      const size = [panesEl.clientWidth, panesEl.clientHeight];
      const basis = camera.frame(size);
      const perPixel = camera.distance / basis.focal[1];
      for (let i = 0; i < 3; i++) {
        camera.target[i] -= basis.right[i] * dx * perPixel + basis.down[i] * dy * perPixel;
      }
    } else {
      camera.yaw -= dx * 0.005;
      const limit = 85 * Math.PI / 180;
      camera.pitch = Math.max(-limit, Math.min(limit, camera.pitch + dy * 0.005));
    }
  });
  panesEl.addEventListener("pointerup", (event) => {
    if (!dragging) return;
    dragging = null;
    panesEl.releasePointerCapture(event.pointerId);
  });
  panesEl.addEventListener("wheel", (event) => {
    if (app.mode !== "explore") return;
    event.preventDefault();
    app.camera.distance *= Math.exp(event.deltaY * 0.001);
  }, { passive: false });

  playPause.addEventListener("click", togglePlay);
  scrubFrame.addEventListener("input", () => {
    app.playing = false; playPause.textContent = "▶";
    showFrame(parseInt(scrubFrame.value, 10));
  });
  scrubCamera.addEventListener("input", () => setStation(parseInt(scrubCamera.value, 10)));
  sceneSelect.addEventListener("change", () => selectScene(sceneSelect.value));
  document.getElementById("modeExplore").addEventListener("click", () => setMode("explore"));
  document.getElementById("modeCompare").addEventListener("click", () => setMode("compare"));
  wipeToggle.addEventListener("click", () => {
    app.wipe = !app.wipe;
    wipeToggle.setAttribute("aria-pressed", String(app.wipe));
    rebuildPanes();
  });
  window.addEventListener("keydown", (event) => {
    if (event.target.tagName === "INPUT" || event.target.tagName === "SELECT") return;
    if (event.key === " ") { event.preventDefault(); togglePlay(); }
    else if (event.key === "ArrowRight") showFrame(app.frame + 1);
    else if (event.key === "ArrowLeft") showFrame(app.frame - 1);
    else if (event.key === "r" && app.mode === "explore") app.camera.goHome();
    else if (event.key === ".") setStation(app.station + 1);
    else if (event.key === ",") setStation(app.station - 1);
  });
}

/* The whole view state lives in the URL fragment, so a particular comparison --
 * this scene, these methods, this rig camera, this frame -- is a link someone
 * else can open. Read once at load, rewritten whenever the state changes. */
function readHash() {
  const out = {};
  for (const part of location.hash.replace(/^#/, "").split("&")) {
    if (!part) continue;
    const [key, value] = part.split("=");
    out[decodeURIComponent(key)] = decodeURIComponent(value || "");
  }
  return out;
}

function writeHash() {
  if (!app.scene) return;
  const parts = [
    `scene=${encodeURIComponent(app.scene)}`,
    `mode=${app.mode}`,
    `methods=${app.methods.map(encodeURIComponent).join(",")}`,
  ];
  if (app.mode === "compare") parts.push(`camera=${app.station}`);
  if (app.frame) parts.push(`frame=${app.frame}`);
  if (app.wipe) parts.push("wipe=1");
  const next = `#${parts.join("&")}`;
  if (location.hash !== next) history.replaceState(null, "", next);
}

async function main() {
  bindControls();
  let index;
  try {
    const response = await fetch("./view.json");
    if (!response.ok) throw new Error(`view.json: HTTP ${response.status}`);
    index = normalise(await response.json());
  } catch (error) {
    return fail(`Could not read the bundle index.\n${error.message || error}`);
  }
  app.index = index;
  app.scenes = index.scenes || {};
  app.fps = index.fps || 30;
  app.camera = new OrbitCamera();
  document.getElementById("title").textContent = index.title || "gs-tools view";
  document.getElementById("source").textContent = index.source || "";
  if (!index.clips || !index.clips.length) return fail("This bundle has no clips.");

  const canvas = document.createElement("canvas");
  if (!canvas.getContext("webgl2") && index.clips.some(hasGeometry)) {
    return fail("This browser could not start WebGL2, which every geometry clip needs.\n"
                + "Pre-rendered clips would still work; try a Chromium- or Firefox-based browser.");
  }

  for (const scene of scenesInBundle()) {
    const option = document.createElement("option");
    option.value = scene;
    option.textContent = scene;
    sceneSelect.appendChild(option);
  }
  // Compare needs a rig; without one in the bundle it has no camera to offer.
  const anyRig = Object.keys(app.scenes).length > 0;
  document.getElementById("modeCompare").disabled = !anyRig;
  if (!anyRig) document.getElementById("modeCompare").title =
    "no capture rig in this bundle — re-export with --corpus pointing at the ORBIT dataset";

  requestAnimationFrame(tick);
  const wanted = readHash();
  const scenes = scenesInBundle();
  app.scene = scenes.includes(wanted.scene) ? wanted.scene : scenes[0];
  sceneSelect.value = app.scene;
  if (wanted.wipe === "1") {
    app.wipe = true;
    wipeToggle.setAttribute("aria-pressed", "true");
  }
  setMode(wanted.mode === "compare" && anyRig ? "compare" : "explore");
  if (wanted.methods) {
    const available = methodsFor(app.scene, app.mode);
    const asked = wanted.methods.split(",").filter((m) => available.includes(m));
    if (asked.length) {
      app.methods = asked;
      renderMethodList();
      rebuildPanes();
    }
  }
  if (wanted.camera) setStation(parseInt(wanted.camera, 10) || 0);
  if (wanted.frame) showFrame(parseInt(wanted.frame, 10) || 0);
}

main();
</script>

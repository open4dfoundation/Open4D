<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4DVideoStreaming</title>
<style>
  :root { color-scheme: dark; --bg:#0d0d11; --line:#26262f; --text:#e6e6ea;
          --muted:#8b8b98; --err:#e05c5c; --link:#7ab6f0; }
  * { box-sizing: border-box; }
  body { margin:0; padding:48px 24px; background:var(--bg); color:var(--text);
         font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width:820px; margin:0 auto; }
  h1 { font-size:12px; letter-spacing:.08em; text-transform:uppercase;
       color:var(--muted); font-weight:500; margin:0 0 18px; }
  #status { margin:0 0 6px; color:var(--muted); }
  #status.bad { color:var(--err); }

  /* One row per system. Fixed-height when collapsed and free of per-row
     chrome, so the list stays scannable as methods are added. */
  ul.systems { list-style:none; margin:0; padding:0;
               border-top:1px solid var(--line); }
  li.row { display:grid; grid-template-columns: 6.5rem 1fr auto;
           align-items:baseline; gap:16px; padding:11px 8px;
           border-bottom:1px solid var(--line); }
  li.row:hover { background:#14141a; }
  a.name { color:var(--link); text-decoration:none; font-weight:600; }
  a.name:hover { text-decoration:underline; }
  /* A restartable baseline takes ~15 s to come up; the click waits. */
  a.name.busy { color:var(--muted); cursor:progress; }
  .desc { color:var(--muted); }

  /* The picker is the one thing here that does not scale, so it stays shut. */
  button.toggle { font:inherit; font-size:11px; color:var(--muted);
                  background:none; border:1px solid var(--line);
                  border-radius:4px; padding:1px 7px; cursor:pointer; }
  button.toggle:hover { color:var(--text); }
  button.toggle.open { color:var(--text); border-color:#3a3a46; }
  .picker { grid-column:2 / 4; margin:6px 0 2px; }
  .picker table { border-collapse:collapse; }
  .picker td { padding:1px 10px 1px 0; }
  .picker td.num { text-align:right; font-variant-numeric:tabular-nums;
                   color:var(--muted); }
  .picker tr.off td { opacity:.4; }

  footer { max-width:820px; margin:22px auto 0; color:var(--muted);
           font-size:11.5px; }
  code { color:var(--text); }
</style>
</head>
<body>
<main>
  <h1>Pick a system</h1>
  <p id="status">loading …</p>
  <div id="systems"></div>
</main>
<footer>
  Shaping: <code>sudo scripts/shape_web_demo.sh cascade-20</code>.
</footer>
<script src="chooser.js"></script>
</body>
</html>

# n4mc uses the repository-wide environment; see ../../../environment.yml.
#
# This file was a 348-line `conda env export`: every transitive package pinned to
# an exact version, a `prefix:` line pointing at one contributor's home
# directory, and entries no n4mc file imports (flash-attn, carvekit, diffusers,
# a full Jupyter stack). It could not be recreated on another machine and it is
# what made this codec look incompatible with the others.
#
#   conda env create -f ../../../environment.yml
#   conda activate open4d
#   pip install -r ../../../requirements-gpu.txt   # see that file; manual steps
#
# n4mc needs the GPU extras: cupy, torch-scatter, nvdiffrast, and kaolin.
name: open4d
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r ../../../requirements-codecs.txt

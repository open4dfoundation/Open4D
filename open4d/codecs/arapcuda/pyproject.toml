[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "arapcuda"
version = "0.1.0"
description = "ARAP volume tracking of mesh sequences on the GPU (the TSMC tracker)"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
wheel.packages = ["python/arapcuda"]

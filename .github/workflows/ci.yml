name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight development environment
        run: python -m pip install -e '.[dev]'
      - name: Run default headless tests
        run: python -m pytest

  torch:
    name: Torch CPU / Python 3.12
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Torch CPU test tier
        run: python -m pip install -e '.[dev,torch]'
      - name: Require the optional dependency
        run: python -c "import torch; print(torch.__version__)"
      - name: Run Torch CPU tests
        run: python -m pytest -m 'torch and not open3d' open4d/torch_ops/tests

  open3d:
    name: Open3D / Python ${{ matrix.python-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Open3D and accelerated Torch test tier
        run: python -m pip install -e '.[dev,open3d,torch]'
      - name: Require both optional dependencies
        run: python -c "import open3d, torch; print(open3d.__version__, torch.__version__)"
      - name: Run every Open3D-backed test
        run: >-
          python -m pytest -m open3d
          integrations/open3d/tests open4d/torch_ops/tests open4d/streaming/tests
          open4d/codec/tests/test_notebook.py

  research-codecs:
    name: Research codec contracts / CPU
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research codec dependencies
        run: python -m pip install -e '.[dev,klt,n4mc,qndf]'
      - name: Run real in-process encode and fresh-decode contracts on CPU
        run: >-
          python -m pytest
          open4d/codec/tests/test_research_cpu.py
          open4d/codec/tests/test_qndf_preprocess.py
          open4d/codec/tests/test_qndf_entrypoints.py
          open4d/codecs/n4mc/tests/test_codec.py

  io-tools:
    name: I/O / real optional formats and benchmark smoke
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional I/O tier
        run: python -m pip install -e '.[dev,tools,usd,gaussians]' 'DracoPy>=2,<3'
      - name: Exercise built-in and optional I/O formats
        run: python -m pytest open4d/io/tests open4d/codec/tests/test_draco.py open4d/core/tests/test_gaussians.py
      - name: Validate benchmark paths
        run: |
          python scripts/benchmark_io.py --side 24 --frames 20 --repeats 2 --json
          python scripts/benchmark_codec.py --side 24 --frames 5 --json

  visualization:
    name: Visualization / imports and GIF rendering
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1-mesa-dri libopengl0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0
      - name: Install player and OpenUSD tier
        run: python -m pip install -e '.[dev,player,usd]'
      - name: Test public visualizer and dependency imports
        run: |
          python -c "import PyQt6, pyqtgraph, OpenGL, PIL, open4d.visualization"
          python -c "from pxr import Usd; print(Usd.GetVersion())"
          python -m pytest open4d/visualization/tests examples/visualization/tests
      - name: Render and check the synthetic sample GIF
        env:
          OPEN4D_TEST_RENDER: "1"
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run -a -s '-screen 0 1024x768x24'
          python -m pytest open4d/visualization/tests/test_real_player.py
          examples/visualization/tests/test_compare.py
          -k 'synthetic or empty or gif_after_single' --basetemp '${{ runner.temp }}/open4d-render'
      - name: Keep the rendered GIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-render
          path: ${{ runner.temp }}/open4d-render/**/*.gif
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Install / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404, macos-14, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and check distributions
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          dist = Path(os.environ["RUNNER_TEMP"]) / "open4d-dist"
          subprocess.run([
              sys.executable, "-m", "pip", "install", "build>=1.2",
              "tomli>=2; python_version < '3.11'",
          ], check=True)
          subprocess.run([sys.executable, "-m", "build", "--outdir", str(dist)], check=True)
          wheel, = dist.glob("*.whl")
          sdist, = dist.glob("*.tar.gz")
          subprocess.run([sys.executable, "scripts/check_wheel_contents.py", str(wheel)], check=True)
          subprocess.run([sys.executable, "scripts/check_sdist_contents.py", str(sdist)], check=True)
      - name: Test a clean wheel installation
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          repository = Path.cwd()
          work = Path(os.environ["RUNNER_TEMP"])
          environment = work / "open4d wheel smoke"
          subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
          python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          wheel, = (work / "open4d-dist").glob("*.whl")
          subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True, cwd=work)
          subprocess.run([str(python), "-m", "pip", "check"], check=True, cwd=work)
          subprocess.run([
              str(python), "-I", str(repository / "scripts/smoke_installed_io.py"),
          ], check=True, cwd=work)

  quality:
    name: Source, documentation, and provenance
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile supported Python sources
        run: >-
          python -m compileall -q
          open4d/*.py open4d/streaming/*.py open4d/codec open4d/core open4d/io
          open4d/torch_ops open4d/visualization
          integrations/__init__.py integrations/open3d
          examples/visualization scripts
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check provenance and distribution containment
        run: |
          python scripts/check_provenance.py
          python scripts/check_release_gate.py --expect-blocked
      - name: Check whitespace errors
        run: git diff --check

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight development environment
        run: python -m pip install -e '.[dev]'
      - name: Run default headless tests
        run: python -m pytest

  torch:
    name: Torch CPU / Python 3.12
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Torch CPU test tier
        run: python -m pip install -e '.[dev,torch]'
      - name: Require the optional dependency
        run: python -c "import torch; print(torch.__version__)"
      - name: Run Torch CPU tests
        run: python -m pytest -m 'torch and not open3d' tests/torch_ops tests/ml

  open3d:
    name: Open3D / Python ${{ matrix.python-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Open3D and accelerated Torch test tier
        run: python -m pip install -e '.[dev,open3d,torch]'
      - name: Require both optional dependencies
        run: python -c "import open3d, torch; print(open3d.__version__, torch.__version__)"
      - name: Run every Open3D-backed test
        run: >-
          python -m pytest -m open3d
          tests/integrations/open3d tests/torch_ops tests/reconstruction/rgbd
          tests/codecs/test_notebook.py

  research-codecs:
    name: Research codec contracts / CPU
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research codec dependencies
        run: python -m pip install -e '.[dev,klt,n4mc,qndf,usd,gaussians]' constriction 'DracoPy>=2,<3'
      - name: Run default suite with research dependencies
        run: python -m pytest
      - name: Run native N4MC model and loss contracts
        run: >-
          python -m pytest
          tests/research/n4mc/test_codec.py
          tests/research/n4mc/test_losses.py

  native-numerics:
    name: Native tracker and editor / .NET 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      OPEN4D_TEST_DOTNET: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install native regression test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build and execute native numerical contracts
        run: |
          dotnet --info
          python -m pytest tests/codecs/test_tracker_numerics.py tests/codecs/test_editor_numerics.py --junitxml="${RUNNER_TEMP}/native-numerics.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          report = ElementTree.parse(Path(os.environ["RUNNER_TEMP"]) / "native-numerics.xml")
          cases = report.findall(".//testcase")
          assert cases and not any(case.find("skipped") is not None for case in cases), "native numerical contracts must execute"
          PY

  io-tools:
    name: I/O / real optional formats and benchmark smoke
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional I/O tier
        run: python -m pip install -e '.[dev,tools,usd,gaussians]' 'DracoPy>=2,<3'
      - name: Exercise built-in and optional I/O formats
        run: python -m pytest tests/io tests/codecs/test_draco.py tests/core/test_gaussians.py
      - name: Validate benchmark paths
        run: |
          python scripts/benchmark_io.py --side 24 --frames 20 --repeats 2 --json
          python scripts/benchmark_codec.py --side 24 --frames 5 --json

  visualization:
    name: Visualization / imports and GIF rendering
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth gdb libegl1 libgl1-mesa-dri libopengl0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0
      - name: Install player and OpenUSD tier
        run: python -m pip install -e '.[dev,player,usd]'
      - name: Test public visualizer and dependency imports
        run: |
          python -c "import PyQt6, pyqtgraph, OpenGL, PIL, open4d.visualization"
          python -c "from pxr import Usd; print(Usd.GetVersion())"
          python -m pytest tests/visualization tests/examples/visualization
      - name: Render and check the synthetic sample GIF
        env:
          OPEN4D_TEST_RENDER: "1"
          OPEN4D_TEST_GUI: "1"
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          render_args=(
            tests/visualization/test_real_player.py
            tests/examples/visualization/test_compare.py
            -k 'synthetic or empty or gif_after_single or live_viewer or sequential'
            --basetemp "$RUNNER_TEMP/open4d-render"
            --junitxml "$RUNNER_TEMP/open4d-render.xml"
          )
          if xvfb-run -a -s '-screen 0 1024x768x24' python -m pytest "${render_args[@]}"; then
            exit 0
          else
            render_status=$?
          fi
          # Collect a native trace only after failure; never mask the original exit.
          xvfb-run -a -s '-screen 0 1024x768x24' \
            gdb -nx -batch --return-child-result \
            -ex 'set print thread-events off' -ex run \
            -ex 'python if gdb.selected_thread() is not None: gdb.execute("bt 32")' --args \
            python -m pytest "${render_args[@]}" || true
          exit "$render_status"
      - name: Require the render tests to have run
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          report = ElementTree.parse(Path(os.environ["RUNNER_TEMP"]) / "open4d-render.xml")
          cases = report.findall(".//testcase")
          assert cases and not any(case.find("skipped") is not None for case in cases), "render tests must execute"
          PY
      - name: Keep the rendered GIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-render
          path: ${{ runner.temp }}/open4d-render/**/*.gif
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser / streamer and web clients
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            open4d/streamer/study/system/Server/package-lock.json
            open4d/streamer/study/system/WebClient/package-lock.json
      - name: Install browser test dependencies and standalone streamer
        run: python -m pip install -e '.[dev]' -e open4d/streamer 'DracoPy>=2,<3' scikit-image
      - name: Check installed streamer and run its headless tests
        run: |
          python -I -c "import streamer; print(streamer.__file__)"
          python -m pytest tests/streamer
      - name: Install and build browser clients
        run: |
          npm ci --prefix open4d/streamer/study/system/Server
          npm ci --prefix open4d/streamer/study/system/WebClient
          npm run build --prefix open4d/streamer/study/system/WebClient
      - name: Run web client and server JavaScript tests
        run: node --test open4d/streamer/study/tests/*.js open4d/streamer/study/system/Server/test_*.js

  package:
    name: Install / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404, macos-14, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and check distributions
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          dist = Path(os.environ["RUNNER_TEMP"]) / "open4d-dist"
          subprocess.run([
              sys.executable, "-m", "pip", "install", "build>=1.2",
              "twine>=6",
              "tomli>=2; python_version < '3.11'",
          ], check=True)
          subprocess.run([sys.executable, "-m", "build", "--outdir", str(dist)], check=True)
          wheel, = dist.glob("*.whl")
          sdist, = dist.glob("*.tar.gz")
          subprocess.run([sys.executable, "scripts/check_wheel_contents.py", str(wheel)], check=True)
          subprocess.run([sys.executable, "scripts/check_sdist_contents.py", str(sdist)], check=True)
          subprocess.run([sys.executable, "-m", "twine", "check", "--strict", str(wheel), str(sdist)], check=True)
      - name: Test clean wheel and source installations
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          repository = Path.cwd()
          work = Path(os.environ["RUNNER_TEMP"])
          for kind, pattern in (("wheel", "*.whl"), ("source", "*.tar.gz")):
              environment = work / f"open4d {kind} smoke"
              subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              artifact, = (work / "open4d-dist").glob(pattern)
              subprocess.run([str(python), "-m", "pip", "install", str(artifact)], check=True, cwd=work)
              subprocess.run([str(python), "-m", "pip", "check"], check=True, cwd=work)
              subprocess.run([
                  str(python), "-I", str(repository / "scripts/smoke_installed_io.py"),
              ], check=True, cwd=work)
      - name: Resolve every optional extra
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          wheel, = (Path(os.environ["RUNNER_TEMP"]) / "open4d-dist").glob("*.whl")
          extras = ["tools", "metrics", "player", "usd", "torch", "klt", "n4mc",
                    "gaussians", "capture", "dev", "all"]
          if sys.version_info < (3, 13):  # Open3D 0.19 has no Python 3.13 wheels
              extras += ["open3d", "qndf"]
          for extra in extras:
              subprocess.run([
                  sys.executable, "-m", "pip", "install", "--dry-run", "--quiet",
                  "--ignore-installed", f"{wheel}[{extra}]",
              ], check=True)

  installed-extras:
    name: Installed optional features / Python ${{ matrix.python-version }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1-mesa-dri libopengl0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0
      - name: Build and install the wheel with every supported extra
        run: |
          python -m pip install 'build>=1.2'
          python -m build --outdir "$RUNNER_TEMP/extras-dist"
          python -m venv "$RUNNER_TEMP/extras"
          "$RUNNER_TEMP/extras/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/extras/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          wheel=("$RUNNER_TEMP"/extras-dist/open4d-*.whl)
          "$RUNNER_TEMP/extras/bin/python" -m pip install "${wheel[0]}[all]"
          "$RUNNER_TEMP/extras/bin/python" -m pip check
      - name: Require optional I/O, reconstruction, Torch and rendering to work
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          cd "$RUNNER_TEMP"
          xvfb-run -a -s '-screen 0 1024x768x24' \
            "$RUNNER_TEMP/extras/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed_extras.py" all --render

  quality:
    name: Source, documentation, and provenance
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile supported Python sources
        run: >-
          python -m compileall -q
          open4d/*.py open4d/reconstruction/*.py open4d/reconstruction/rgbd/*.py
          open4d/transport open4d/codecs/*.py open4d/codecs/*/__init__.py
          open4d/codecs/_backends open4d/core open4d/io
          open4d/torch_ops open4d/visualization open4d/data open4d/ml
          open4d/integrations
          examples/visualization examples/streaming_demo.py scripts
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check provenance and distribution containment
        run: |
          python scripts/check_provenance.py
          python scripts/check_release_gate.py --check-ledger
      - name: Check whitespace errors
        run: git diff --check

  passed:
    name: CI passed
    if: always()
    needs: [core, torch, open3d, research-codecs, native-numerics, io-tools, visualization, browser, package, installed-extras, quality, adapter-packages]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  adapter-packages:
    name: Downloadable MIT adapter packages
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install artifact validation tools
        run: python -m pip install 'build>=1.2' 'twine>=6'
      - name: Build and verify metadata-only adapter archives
        run: |
          python scripts/build_plugins.py --out-dir "$RUNNER_TEMP/open4d-plugins"
          python -m twine check --strict "$RUNNER_TEMP/open4d-plugins"/*
      - name: Build core from its source distribution outside the checkout
        run: |
          mkdir "$RUNNER_TEMP/open4d-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/open4d-source"
          python -m build --outdir "$RUNNER_TEMP/open4d-core" "$RUNNER_TEMP/open4d-source"
          python scripts/check_wheel_contents.py "$RUNNER_TEMP/open4d-core"/*.whl
          python scripts/check_sdist_contents.py "$RUNNER_TEMP/open4d-core"/*.tar.gz
      - name: Prove clean installation, cold geometry decode and lazy adapters
        run: python scripts/smoke_installed_plugins.py --core-wheel "$RUNNER_TEMP/open4d-core"/*.whl --adapters "$RUNNER_TEMP/open4d-plugins"
      - name: Build and verify the separate browser streamer
        run: |
          python -m build --outdir "$RUNNER_TEMP/open4d-streamer" "$RUNNER_TEMP/open4d-source/open4d/streamer"
          python scripts/check_streamer_package.py "$RUNNER_TEMP/open4d-streamer"/*.whl "$RUNNER_TEMP/open4d-streamer"/*.tar.gz
          python -m twine check --strict "$RUNNER_TEMP/open4d-streamer"/*
      - name: Upload downloadable adapter packages
        uses: actions/upload-artifact@v4
        with:
          name: open4d-mit-adapter-packages
          path: ${{ runner.temp }}/open4d-plugins/*
          if-no-files-found: error
      - name: Upload the independently installable core archives
        uses: actions/upload-artifact@v4
        with:
          name: open4d-core-packages
          path: ${{ runner.temp }}/open4d-core/*
          if-no-files-found: error
      - name: Upload separate streamer archives
        uses: actions/upload-artifact@v4
        with:
          name: open4d-streamer-packages
          path: ${{ runner.temp }}/open4d-streamer/*
          if-no-files-found: error

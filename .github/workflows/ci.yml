name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight development environment
        run: python -m pip install -e '.[dev]'
      - name: Run default headless tests
        run: python -m pytest

  torch:
    name: Torch CPU / Python 3.12
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Torch CPU test tier
        run: python -m pip install -e '.[dev,torch]'
      - name: Require the optional dependency
        run: python -c "import torch; print(torch.__version__)"
      - name: Run Torch CPU tests
        run: python -m pytest -m 'torch and not open3d' open4d/torch_ops/tests

  open3d:
    name: Open3D / Python ${{ matrix.python-version }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Open3D and accelerated Torch test tier
        run: python -m pip install -e '.[dev,open3d,torch]'
      - name: Require both optional dependencies
        run: python -c "import open3d, torch; print(open3d.__version__, torch.__version__)"
      - name: Run every Open3D-backed test
        run: >-
          python -m pytest -m open3d
          integrations/open3d/tests open4d/torch_ops/tests

  io-tools:
    name: I/O / real optional formats and benchmark smoke
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install I/O tools tier
        run: python -m pip install -e '.[dev,tools]'
      - name: Exercise built-in and Trimesh-backed files
        run: python -m pytest open4d/io/tests
      - name: Validate benchmark paths
        run: python scripts/benchmark_io.py --side 24 --frames 20 --repeats 2 --json

  package:
    name: Exact distribution boundary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build source and wheel distributions
        run: |
          python -m pip install 'build>=1.2'
          python -m build --outdir "$RUNNER_TEMP/open4d-dist"
      - name: Assert exact wheel contents
        run: python scripts/check_wheel_contents.py "$(find "$RUNNER_TEMP/open4d-dist" -maxdepth 1 -name '*.whl' -print -quit)"
      - name: Assert source-distribution contents
        run: python scripts/check_sdist_contents.py "$(find "$RUNNER_TEMP/open4d-dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/open4d-wheel-smoke"
          "$RUNNER_TEMP/open4d-wheel-smoke/bin/python" -m pip install "$(find "$RUNNER_TEMP/open4d-dist" -maxdepth 1 -name '*.whl' -print -quit)"
          "$RUNNER_TEMP/open4d-wheel-smoke/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/open4d-wheel-smoke/bin/python" -c "import open4d, integrations; print(open4d.__file__)"
          "$RUNNER_TEMP/open4d-wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed_io.py"

  quality:
    name: Source, documentation, and provenance
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile supported Python sources
        run: >-
          python -m compileall -q
          open4d/__init__.py open4d/core open4d/io open4d/torch_ops
          integrations/__init__.py integrations/open3d
          examples/visualization scripts
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check provenance and distribution containment
        run: |
          python scripts/check_provenance.py
          python scripts/check_release_gate.py --expect-blocked
      - name: Check whitespace errors
        run: git diff --check

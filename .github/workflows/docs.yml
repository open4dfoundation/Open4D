name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy reviewed documentation to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation tools and the core
        run: python -m pip install -e '.[docs]'
      - name: Build versioned sources and generated API reference
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/open4d-site"
      - name: Validate navigation, source coverage and search
        run: python scripts/check_docs_site.py "$RUNNER_TEMP/open4d-site"
      - name: Exclude unreviewed documentation media
        run: |
          test ! -d "$RUNNER_TEMP/open4d-site/assets"
          test -f "$RUNNER_TEMP/open4d-site/reference/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: ${{ runner.temp }}/open4d-site
          retention-days: 7
      - name: Check publication approval
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: python scripts/check_release_gate.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          path: ${{ runner.temp }}/open4d-site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

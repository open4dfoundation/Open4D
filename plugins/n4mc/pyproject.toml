[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "open4d-n4mc"
version = "0.3.0"
description = "MIT Open4D adapter registrations; no research implementations, data or weights"
readme = {text = "This MIT package registers Open4D adapters only. It contains no research implementations, models, datasets, native binaries or CUDA extensions. Install the matching Open4D core from this revision, independently acquire each external runtime under its own license, and configure the documented OPEN4D backend root. Installing this adapter does not grant rights to any external runtime.", content-type = "text/plain"}
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["open4d>=0.3.0,<0.4"]

[project.entry-points."open4d.codecs"]
"n4mc" = "open4d.codec._n4mc:N4MC_CODEC"

[project.optional-dependencies]
runtime = ["torch", "trimesh", "scikit-image", "point-cloud-utils"]

[tool.setuptools]
packages = []
include-package-data = false

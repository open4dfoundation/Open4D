# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is disabled for this repository. Keep this file as a tombstone so
# organization-level defaults cannot silently turn repository features back on.
# Removing the repository from the CodeRabbit GitHub App installation is still
# required to revoke the app's access and prevent manually requested reviews.
inheritance: false
early_access: false
enable_free_tier: false

reviews:
  request_changes_workflow: false
  high_level_summary: false
  review_status: false
  review_progress: false
  commit_status: false
  auto_apply_labels: false
  auto_assign_reviewers: false
  slop_detection:
    enabled: false
  auto_review:
    enabled: false
    auto_incremental_review: false
    description_keyword: ""
    labels: []
    drafts: false
    base_branches: []
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks: []
  post_merge_actions: []

chat:
  auto_reply: false
  allow_non_org_members: false
  art: false
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  # This also requests deletion of retained repository learnings and context.
  opt_out: true
  web_search:
    enabled: false
  code_guidelines:
    enabled: false
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled
    disabled_servers: []
  automatic_repository_linking: false
  linked_repositories: []

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
      labels: []
  labeling:
    labeling_instructions: []
    auto_apply_labels: false

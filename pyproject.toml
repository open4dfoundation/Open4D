[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "open4d"
version = "0.3.0"
description = "Encode, decode, reconstruct and stream 4D mesh and Gaussian sequences"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SINRG Lab, Northeastern University" }]
keywords = [
    "4d", "volumetric video", "mesh compression", "dynamic mesh", "v-dmc",
    "gaussian splatting", "openusd", "point cloud", "rgb-d", "streaming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/open4dfoundation/Open4D"
Documentation = "https://open4dfoundation.github.io/wiki/"
Changelog = "https://open4dfoundation.github.io/wiki/community/changelog/"
Issues = "https://github.com/open4dfoundation/Open4D/issues"

[project.scripts]
open4d = "open4d._cli:main"

[project.optional-dependencies]
tools  = ["trimesh"]
# SciPy 1.15.x macOS arm64 wheels fail to load on macOS 26+ ("__thread_bss has
# a zero-fill section type"); it is the newest SciPy for Python 3.10.
metrics = ["scipy", "scipy!=1.15.*; sys_platform == 'darwin'"]
player = ["PyQt6", "pyqtgraph>=0.14", "PyOpenGL", "pillow>=9", "scipy", "scipy!=1.15.*; sys_platform == 'darwin'"]
# 0.20 applies depth_scale to float depth, but its legacy TSDF integrator
# still passes 1000 for images already in metres and silently extracts no mesh.
open3d = ["open3d>=0.19,<0.20", "pillow>=9"]
usd    = ["usd-core>=24.3"]
torch  = ["torch"]
klt    = ["torch", "trimesh", "zstd", "zstandard", "tqdm", "point-cloud-utils"]
n4mc   = ["torch", "trimesh", "scikit-image", "point-cloud-utils"]
qndf   = ["torch", "open3d>=0.19,<0.20", "trimesh", "tqdm"]
gaussians = ["plyfile", "pillow>=9"]
# Open3D 0.19 has no Python 3.13 or Linux aarch64 wheels, and usd-core none for
# Linux aarch64. Capture loading works without Open3D; reconstruction does not.
capture = ["opencv-python", "zstandard", "open3d>=0.19,<0.20; python_version < '3.13' and platform_machine != 'aarch64'", "pillow>=9"]
dev    = ["build>=1.2", "twine>=6", "pytest>=8", "scipy", "scipy!=1.15.*; sys_platform == 'darwin'", "tomli>=2; python_version < '3.11'"]
all    = ["plyfile", "trimesh", "PyQt6", "pyqtgraph>=0.14", "PyOpenGL", "open3d>=0.19,<0.20; python_version < '3.13' and platform_machine != 'aarch64'", "pillow>=9", "usd-core>=24.3; platform_machine != 'aarch64'", "scipy", "scipy!=1.15.*; sys_platform == 'darwin'", "torch", "zstd", "tqdm", "point-cloud-utils", "scikit-image", "opencv-python", "zstandard"]

[tool.setuptools]
include-package-data = false
packages = [
    "open4d",
    "open4d.codecs",
    "open4d.codecs._backends",
    # Per-codec adapters; each codec's research implementation in source/ is
    # not a listed package, so it never enters the wheel.
    "open4d.codecs.draco",
    "open4d.codecs.klt",
    "open4d.codecs.n4mc",
    "open4d.codecs.qndf",
    "open4d.codecs.qndf_int8",
    "open4d.codecs.vdmc",
    "open4d.codecs.faster_vdmc",
    "open4d.codecs.tvmc",
    "open4d.codecs.tsmc",
    "open4d.codecs.queen",
    "open4d.codecs.rerf",
    "open4d.codecs.vega",
    "open4d.data",
    "open4d.ml",
    "open4d.core",
    "open4d.io",
    "open4d.reconstruction",
    "open4d.reconstruction.rgbd",
    "open4d.transport",
    "open4d.torch_ops",
    "open4d.visualization",
]

[tool.setuptools.package-data]
"open4d.data" = ["catalog.json"]
"open4d.codecs._backends" = ["recipes/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
# Research suites under tests/research run in each codec's own environment.
norecursedirs = ["research", ".*", "__pycache__"]
testpaths = [
    "tests/core",
    "tests/data",
    "tests/ml",
    "tests/codecs",
    "tests/io",
    "tests/reconstruction/rgbd",
    "tests/transport",
    "tests/torch_ops",
    "tests/visualization",
    "tests/scripts",
]
markers = [
    "cpu: deterministic tests that need no optional hardware",
    "open3d: tests requiring the Open3D optional dependency",
    "torch: tests requiring the Torch optional dependency",
    "gpu: tests requiring a supported GPU stack",
    "hardware: tests requiring cameras, XR devices, or other hardware",
    "slow: tests excluded from quick feedback loops",
    "player: tests requiring the optional Qt/OpenGL player and a display",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open4d"
version = "0.1.0"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy"]

[project.optional-dependencies]
tools  = ["trimesh"]
player = ["PyQt6", "pyqtgraph", "PyOpenGL", "pillow>=9", "scipy"]
open3d = ["open3d>=0.17", "pillow>=9"]
usd    = ["usd-core>=24.3"]
all    = ["trimesh", "PyQt6", "pyqtgraph", "PyOpenGL", "open3d>=0.17", "pillow>=9", "usd-core>=24.3", "scipy"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["open4d*", "integrations*"]
exclude = [
    "data*",
    "apps*",
    "cmake*",
    "docker*",
    "pc_frames*",
    "integrations.open3d.tests*",
    "open4d.core.tests*",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open4d"
version = "0.1.0"
# This is the core package -- NumPy only, plus the optional extras below -- and
# it is deliberately wider than the codecs. open4d.core and the [player] extra
# both work on 3.13; it is Open3D that publishes no cp313 wheel, which caps the
# [open3d] extra and every codec at 3.12. That 3.12 ceiling is enforced where it
# actually applies, in environment.yml, not here: pinning the core package to
# 3.12 would stop `pip install open4d` on a 3.13 interpreter that can run it.
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy"]

[project.optional-dependencies]
tools  = ["trimesh"]
player = ["PyQt6", "pyqtgraph", "PyOpenGL", "pillow>=9", "scipy"]
draco  = ["DracoPy>=2,<3"]
# 0.19 is the floor, not 0.17: 0.18 publishes no cp312 wheel, and resolving to it
# is what held the codecs on older Pythons. It is also the last version with no
# cp313 wheel at all, so this extra is 3.12-and-below in practice.
open3d = ["open3d>=0.19", "pillow>=9"]
usd    = ["usd-core>=24.3"]
torch  = ["torch"]
klt    = ["torch", "trimesh", "zstd", "tqdm", "point-cloud-utils"]
n4mc   = ["torch", "trimesh", "scikit-image", "point-cloud-utils"]
dev    = ["build>=1.2", "pytest>=8", "scipy", "tomli>=2; python_version < '3.11'"]
all    = ["trimesh", "PyQt6", "pyqtgraph", "PyOpenGL", "open3d>=0.19", "pillow>=9", "usd-core>=24.3", "scipy"]

[tool.setuptools]
include-package-data = false
packages = [
    "open4d",
    "open4d.codec",
    "open4d.codecs",
    "open4d.codecs.klt",
    "open4d.codecs.n4mc",
    "open4d.codecs.n4mc.evaluation",
    "open4d.codecs.n4mc.losses",
    "open4d.codecs.n4mc.models",
    "open4d.core",
    "open4d.io",
    "open4d.torch_ops",
    "open4d.visualization",
    "integrations",
    "integrations.open3d",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = [
    "open4d/core/tests",
    "open4d/codec/tests",
    "open4d/io/tests",
    "open4d/torch_ops/tests",
    "open4d/visualization/tests",
    "examples/visualization/tests",
    "scripts/tests",
]
markers = [
    "cpu: deterministic tests that need no optional hardware",
    "open3d: tests requiring the Open3D optional dependency",
    "torch: tests requiring the Torch optional dependency",
    "gpu: tests requiring a supported GPU stack",
    "hardware: tests requiring cameras, XR devices, or other hardware",
    "slow: tests excluded from quick feedback loops",
    "player: tests requiring the optional Qt/OpenGL player and a display",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open4d"
version = "0.1.0"
description = "Research codecs, reconstruction and streaming for 4D geometry"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy"]

[project.urls]
Repository = "https://github.com/open4dfoundation/Open4D"
Issues = "https://github.com/open4dfoundation/Open4D/issues"

[project.scripts]
open4d = "open4d._cli:main"

[project.optional-dependencies]
tools  = ["trimesh"]
metrics = ["scipy"]
player = ["PyQt6", "pyqtgraph", "PyOpenGL", "pillow>=9", "scipy"]
open3d = ["open3d>=0.19", "pillow>=9"]
usd    = ["usd-core>=24.3"]
torch  = ["torch"]
klt    = ["torch", "trimesh", "zstd", "tqdm", "point-cloud-utils"]
n4mc   = ["torch", "trimesh", "scikit-image", "point-cloud-utils"]
qndf   = ["torch", "open3d>=0.19", "trimesh", "tqdm"]
gaussians = ["plyfile"]
dev    = ["build>=1.2", "pytest>=8", "scipy", "tomli>=2; python_version < '3.11'"]
all    = ["plyfile", "trimesh", "PyQt6", "pyqtgraph", "PyOpenGL", "open3d>=0.19", "pillow>=9", "usd-core>=24.3", "scipy", "torch", "zstd", "tqdm", "point-cloud-utils", "scikit-image"]

[tool.setuptools]
include-package-data = false
packages = [
    "open4d",
    "open4d.codec",
    "open4d.core",
    "open4d.io",
    "open4d.streaming",
    "open4d.torch_ops",
    "open4d.visualization",
    "integrations",
    "integrations.open3d",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = [
    "open4d/core/tests",
    "open4d/codec/tests",
    "open4d/io/tests",
    "open4d/streaming/tests",
    "open4d/torch_ops/tests",
    "open4d/visualization/tests",
    "examples/visualization/tests",
    "scripts/tests",
]
markers = [
    "cpu: deterministic tests that need no optional hardware",
    "open3d: tests requiring the Open3D optional dependency",
    "torch: tests requiring the Torch optional dependency",
    "gpu: tests requiring a supported GPU stack",
    "hardware: tests requiring cameras, XR devices, or other hardware",
    "slow: tests excluded from quick feedback loops",
    "player: tests requiring the optional Qt/OpenGL player and a display",
]
